<style>
/* ==========================================================================
   Google Slides, drawn in CSS.

   The recognisable parts are the yellow deck icon, the filmstrip of numbered
   thumbnails down the left, and the 16:9 slide on a grey stage. Empty
   placeholders say "Click to add text" because that is what Slides shows, and
   spotting which slides are empty is half of this task.

   Prefixed .gs- so it cannot reach the GrassLMS page around it.
   ========================================================================== */

.gs {
  --gs-yellow: #f6b704;
  --gs-blue: #1a73e8;
  --gs-text: #202124;
  --gs-dim: #5f6368;
  --gs-line: #dadce0;
  --gs-bar: #edf2fa;
  --gs-stage: #f8f9fa;
  --gs-hover: rgba(60, 64, 67, .08);

  border: 1px solid var(--gs-line);
  border-radius: 8px;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 1px 3px rgba(60, 64, 67, .16), 0 6px 22px rgba(60, 64, 67, .1);
  font-family: Roboto, "Segoe UI", Arial, system-ui, sans-serif;
  color: var(--gs-text);
  -webkit-font-smoothing: antialiased;
}
.gs svg { display: block; }

/* ---- title row ---------------------------------------------------------- */
.gs__head { display: flex; align-items: flex-start; gap: 10px; padding: 8px 12px 0; }
.gs__logo { width: 36px; height: 36px; flex: 0 0 36px; margin-top: 2px; }
.gs__titles { min-width: 0; flex: 1; }
.gs__name { font-size: 17px; line-height: 1.3; }
.gs__menu { display: flex; flex-wrap: wrap; gap: 1px; margin-top: 1px; }
.gs__menu span { padding: 3px 7px; border-radius: 4px; font-size: 13px; color: #3c4043; white-space: nowrap; }
.gs__menu span:hover { background: var(--gs-hover); }
.gs__right { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.gs__present {
  display: flex; align-items: center; gap: 6px;
  height: 34px; padding: 0 14px; border-radius: 4px;
  border: 1px solid var(--gs-line); font-size: 13px; color: #3c4043; white-space: nowrap;
}
.gs__present svg { width: 14px; height: 14px; }
.gs__share {
  display: flex; align-items: center; gap: 7px;
  height: 34px; padding: 0 18px; border-radius: 999px;
  background: #c2e7ff; color: #001d35; font-size: 13px; font-weight: 500; white-space: nowrap;
}
.gs__share svg { width: 16px; height: 16px; }
.gs__avatar {
  width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%;
  background: #0b8043; color: #fff; display: grid; place-items: center;
  font-size: 12px; font-weight: 500;
}
@media (max-width: 720px) { .gs__present { display: none; } .gs__share span { display: none; } .gs__share { padding: 0 12px; } }

/* ---- toolbar ------------------------------------------------------------ */
.gs__toolwrap { padding: 6px 12px 10px; }
.gs__tools {
  display: flex; align-items: center; gap: 1px;
  height: 40px; padding: 0 10px;
  border-radius: 999px; background: var(--gs-bar);
  overflow-x: auto; scrollbar-width: none;
}
.gs__tools::-webkit-scrollbar { display: none; }
.gs-t {
  display: flex; align-items: center; justify-content: center; gap: 5px;
  height: 28px; min-width: 28px; padding: 0 7px;
  border: 0; border-radius: 4px; background: transparent;
  font: inherit; font-size: 13px; color: #444746;
  white-space: nowrap; flex: 0 0 auto;
}
.gs-t:hover { background: rgba(68, 71, 70, .1); }
.gs-t svg { width: 18px; height: 18px; }
.gs__tsep { width: 1px; height: 20px; margin: 0 5px; background: #c7c7c7; flex: 0 0 1px; }

/* ---- filmstrip and stage ------------------------------------------------ */
.gs__body { display: grid; grid-template-columns: 148px minmax(0, 1fr); border-top: 1px solid #e3e6e8; }
@media (max-width: 720px) {
  .gs__body { grid-template-columns: 1fr; }
  .gs__strip { display: flex; gap: 8px; overflow-x: auto; max-height: none; border-right: 0; border-bottom: 1px solid var(--gs-line); }
  .gs-thumb { flex: 0 0 128px; margin-bottom: 0; }
  .gs-thumb__face { height: 58px; }
}

.gs__strip {
  padding: 10px 8px; background: #fff;
  border-right: 1px solid var(--gs-line);
  overflow-y: auto;
}
.gs-thumb {
  display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 6px;
  align-items: start; margin-bottom: 8px;
  background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-align: left;
}
.gs-thumb__n { display: block; font-size: 11px; color: var(--gs-dim); padding-top: 2px; }
.gs-thumb__face {
  /* A fixed height rather than an aspect ratio: the body text on a full slide
     is taller than 16:9 at this scale and would stretch that one thumbnail
     while the empty ones stayed short. */
  display: block; box-sizing: border-box;
  height: 63px; padding: 5px 6px;
  border: 1px solid var(--gs-line); background: #fff;
  overflow: hidden;
}
.gs-thumb[aria-current="true"] .gs-thumb__face { border: 2px solid var(--gs-blue); }
.gs-thumb[aria-current="true"] .gs-thumb__n { color: var(--gs-blue); font-weight: 500; }
.gs-thumb__t { display: block; font-size: 6px; font-weight: 700; line-height: 1.2; color: #202124; }
.gs-thumb__b { display: block; font-size: 5px; line-height: 1.3; color: #5f6368; margin-top: 3px; }
.gs-thumb__ph { display: block; margin-top: 3px; height: 58%; border: 1px dashed #bdc1c6; }

.gs__stage { background: var(--gs-stage); padding: 18px; display: grid; place-items: center; }
.gs__slide {
  width: 100%; max-width: 600px; aspect-ratio: 16 / 9;
  background: #fff; border: 1px solid #e6e6e6;
  box-shadow: 0 1px 3px rgba(60, 64, 67, .18);
  padding: 6% 7%;
  display: flex; flex-direction: column; gap: 3%;
}
.gs__slide h3 {
  margin: 0; font-family: Arial, Helvetica, sans-serif;
  font-size: clamp(17px, 3.2vw, 26px); font-weight: 700; letter-spacing: 0; color: #202124;
}
.gs__slide p {
  margin: 0; font-family: Arial, Helvetica, sans-serif;
  font-size: clamp(12px, 1.8vw, 15px); line-height: 1.5; color: #3c4043;
}
/* A slide that is still empty, shown the way Slides shows it. */
.gs__ph {
  flex: 1; display: grid; place-items: center;
  border: 1px dashed #9aa0a6; color: #80868b;
  font-size: clamp(11px, 1.6vw, 14px); text-align: center;
}
.gs__ph span { display: grid; justify-items: center; gap: 6px; }
.gs__ph svg { width: 26px; height: 26px; color: #9aa0a6; }

/* ---- status strip ------------------------------------------------------- */
.gs__status {
  display: flex; align-items: center; gap: 14px;
  height: 28px; padding: 0 14px;
  border-top: 1px solid #e3e6e8; background: #fff;
  font-size: 11px; color: var(--gs-dim);
}
.gs__status b { margin-left: auto; font-weight: 400; }
</style>
