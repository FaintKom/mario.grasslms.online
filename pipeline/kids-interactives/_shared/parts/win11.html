<style>
/* ==========================================================================
   Windows 11 File Explorer, light theme, drawn in CSS.

   Real measurements: a 40px tab strip, a 48px command bar, a 40px address row,
   a 220px navigation pane, a 28px status bar. Chrome is #f3f3f3, content is
   white, the accent is #0067c0 and selection is #cfe8fc. Prefixed .w- so it
   cannot collide with the GrassLMS layer around it.

   The icons are drawn rather than set in emoji: an emoji folder is whatever
   font the machine happens to have, and half of them are not even the same
   colour. A child is supposed to recognise this window on sight.
   ========================================================================== */

.w {
  --w-chrome: #f3f3f3;
  --w-face: #ffffff;
  --w-line: #e5e5e5;
  --w-text: #1b1b1b;
  --w-dim: #5d5d5d;
  --w-hover: rgba(0, 0, 0, .05);
  --w-accent: #0067c0;
  --w-sel: #cfe8fc;

  display: flex; flex-direction: column;
  border: 1px solid #d9d9d9;
  border-radius: 8px;
  overflow: hidden;
  background: var(--w-face);
  box-shadow: 0 8px 28px rgba(0, 0, 0, .16), 0 1px 3px rgba(0, 0, 0, .08);
  font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  font-size: 12px;
  color: var(--w-text);
  -webkit-font-smoothing: antialiased;
}
.w svg { display: block; }

/* ---- tab strip ---------------------------------------------------------- */
.w__tabs {
  display: flex; align-items: center;
  height: 40px; padding-left: 8px;
  background: var(--w-chrome);
}
.w-tab {
  display: flex; align-items: center; gap: 8px;
  height: 32px; padding: 0 10px; margin-top: 8px;
  border-radius: 6px 6px 0 0;
  background: var(--w-face);
  font-size: 12px;
}
.w-tab svg { width: 16px; height: 16px; }
.w-tab i { font-style: normal; }
.w-tab u {
  width: 16px; height: 16px; margin-left: 4px;
  display: grid; place-items: center; border-radius: 4px;
  text-decoration: none; color: var(--w-dim);
}
.w-tab u:hover { background: var(--w-hover); }
.w-tab u svg { width: 8px; height: 8px; }
.w__tabadd {
  width: 28px; height: 28px; margin-left: 4px;
  display: grid; place-items: center;
  border-radius: 4px; color: var(--w-dim);
}
.w__tabadd:hover { background: var(--w-hover); }
.w__tabadd svg { width: 11px; height: 11px; }

.w__wc { display: flex; margin-left: auto; align-self: stretch; }
.w__wc i { width: 46px; display: grid; place-items: center; color: var(--w-text); }
.w__wc i svg { width: 10px; height: 10px; }
.w__wc i:hover { background: var(--w-hover); }
.w__wc i:last-child:hover { background: #c42b1c; color: #fff; }

/* ---- command bar -------------------------------------------------------- */
.w__cmd {
  display: flex; align-items: center; gap: 2px;
  height: 48px; padding: 0 8px;
  background: var(--w-face);
}
.w-btn {
  display: flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 10px;
  border: 0; border-radius: 4px; background: transparent;
  font: inherit; font-size: 12px; color: var(--w-text);
  cursor: pointer; white-space: nowrap;
}
.w-btn:hover { background: var(--w-hover); }
.w-btn:active { background: rgba(0, 0, 0, .08); }
.w-btn:disabled { color: #a0a0a0; cursor: default; }
.w-btn:disabled:hover { background: transparent; }
.w-btn svg { width: 16px; height: 16px; flex: 0 0 16px; }
.w-btn--icon { padding: 0; width: 32px; justify-content: center; }
.w-btn--new svg:first-child { color: var(--w-accent); }
.w-btn .w-chev { width: 8px; height: 8px; opacity: .65; }
.w__sep { width: 1px; height: 20px; margin: 0 6px; background: var(--w-line); flex: 0 0 1px; }

/* ---- address row -------------------------------------------------------- */
.w__addr {
  display: flex; align-items: center; gap: 2px;
  height: 40px; padding: 0 8px 8px;
  background: var(--w-face);
}
.w__crumbs {
  display: flex; align-items: center; flex: 1; min-width: 0;
  height: 32px; padding: 0 8px;
  border: 1px solid var(--w-line); border-radius: 4px;
  background: var(--w-face);
  overflow: hidden;
}
.w__crumbs button {
  border: 0; background: none; cursor: pointer;
  font: inherit; font-size: 12px; color: var(--w-text);
  padding: 3px 6px; border-radius: 3px; white-space: nowrap;
}
.w__crumbs button:hover { background: var(--w-hover); }
.w__crumbs svg { width: 8px; height: 8px; color: #757575; flex: 0 0 8px; }
.w__crumbs > svg:first-child { width: 16px; height: 16px; flex: 0 0 16px; margin-right: 4px; }
.w__search {
  display: flex; align-items: center; gap: 6px;
  width: 190px; height: 32px; margin-left: 6px; padding: 0 10px;
  border: 1px solid var(--w-line); border-radius: 4px;
  color: #757575; font-size: 12px; white-space: nowrap; overflow: hidden;
}
.w__search svg { width: 13px; height: 13px; flex: 0 0 13px; }

/* ---- body: navigation pane and content ---------------------------------- */
/* The window is a column, so the body takes the slack and the status bar
   stays inside the frame instead of being clipped by overflow:hidden. */
.w__body { display: grid; grid-template-columns: 220px 1fr; flex: 1 1 0; min-height: 0; }
@media (max-width: 760px) { .w__body { grid-template-columns: 1fr; } .w__nav { display: none; } }

.w__nav {
  padding: 4px 8px 8px;
  background: var(--w-chrome);
  border-right: 1px solid var(--w-line);
  overflow: auto;
}
.w-nav {
  position: relative;
  display: flex; align-items: center; gap: 10px;
  height: 32px; padding: 0 10px; margin-bottom: 2px;
  border-radius: 4px; font-size: 12px; color: var(--w-text);
  white-space: nowrap;
}
.w-nav:hover { background: var(--w-hover); }
.w-nav.is-open { background: rgba(0, 0, 0, .06); font-weight: 600; }
.w-nav.is-open::before {
  content: ""; position: absolute; left: 0; top: 8px;
  width: 3px; height: 16px; border-radius: 2px; background: var(--w-accent);
}
.w-nav svg { width: 16px; height: 16px; flex: 0 0 16px; }
.w-nav--sub { padding-left: 26px; }
.w__navgap { height: 12px; }

.w__content { background: var(--w-face); display: flex; flex-direction: column; min-height: 0; }

/* ---- status bar --------------------------------------------------------- */
.w__status {
  display: flex; align-items: center; gap: 12px;
  height: 28px; padding: 0 12px;
  border-top: 1px solid var(--w-line);
  background: var(--w-chrome);
  font-size: 11px; color: var(--w-dim);
}
.w__views { margin-left: auto; display: flex; gap: 2px; }
.w__views i { width: 24px; height: 20px; display: grid; place-items: center; border-radius: 3px; }
.w__views i.is-on { background: rgba(0, 0, 0, .08); }
.w__views svg { width: 13px; height: 13px; }

/* ---- context menu, Windows 11 shape ------------------------------------- */
.w-menu {
  position: fixed; z-index: 60; min-width: 250px;
  padding: 4px;
  background: #f9f9f9;
  border: 1px solid rgba(0, 0, 0, .09);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
  font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  font-size: 12px; color: #1b1b1b;
}
/* The row of bare icons Windows 11 puts at the top of a file menu. */
.w-menu__icons { display: flex; gap: 2px; padding: 2px 2px 6px; }
.w-menu__icons button {
  flex: 1; height: 34px;
  display: grid; place-items: center;
  border: 0; border-radius: 4px; background: transparent;
  cursor: pointer; color: #1b1b1b;
}
.w-menu__icons button:hover:not(:disabled) { background: rgba(0, 0, 0, .06); }
.w-menu__icons button:disabled { color: #a0a0a0; cursor: default; }
.w-menu__icons svg { width: 16px; height: 16px; }
.w-menu > button {
  display: flex; align-items: center; gap: 12px;
  width: 100%; height: 32px; padding: 0 10px;
  border: 0; border-radius: 4px; background: transparent;
  font: inherit; font-size: 12px; color: #1b1b1b;
  text-align: left; cursor: pointer;
}
.w-menu > button:hover:not(:disabled) { background: rgba(0, 0, 0, .06); }
.w-menu > button:disabled { color: #a0a0a0; cursor: default; }
.w-menu > button svg { width: 16px; height: 16px; flex: 0 0 16px; }
.w-menu > button span { flex: 1; }
.w-menu > button kbd { font-family: inherit; font-size: 11px; color: #6d6d6d; }
.w-menu hr { border: 0; border-top: 1px solid rgba(0, 0, 0, .08); margin: 4px 6px; }
</style>
