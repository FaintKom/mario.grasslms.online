<style>
/* ==========================================================================
   Google Docs, drawn in CSS. Shared by the three text tasks.

   The measurements are the real ones: a 40px toolbar riding in a #edf2fa pill,
   an 816px page (8.5 inches at 96dpi) on a #f9fbfd desk, #1a73e8 for anything
   you can press. Prefixed .gd- so it cannot reach the GrassLMS page around it.

   The page padding is 48px rather than the real 96px: an inch of margin makes
   sense on paper and wastes half the frame inside a lesson.
   ========================================================================== */

.gd {
  --gd-blue: #1a73e8;
  --gd-text: #202124;
  --gd-dim: #5f6368;
  --gd-line: #dadce0;
  --gd-bar: #edf2fa;
  --gd-desk: #f9fbfd;
  --gd-hover: rgba(60, 64, 67, .08);

  border: 1px solid var(--gd-line);
  border-radius: 8px;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 1px 3px rgba(60, 64, 67, .16), 0 6px 22px rgba(60, 64, 67, .1);
  font-family: Roboto, "Segoe UI", Arial, system-ui, sans-serif;
  color: var(--gd-text);
  -webkit-font-smoothing: antialiased;
}
.gd svg { display: block; }

/* ---- title row ---------------------------------------------------------- */
.gd__head { display: flex; align-items: flex-start; gap: 10px; padding: 8px 12px 0; }
.gd__logo { width: 36px; height: 36px; flex: 0 0 36px; margin-top: 2px; }
.gd__titles { min-width: 0; flex: 1; }
.gd__name { font-size: 17px; line-height: 1.3; color: var(--gd-text); }
.gd__menu { display: flex; flex-wrap: wrap; gap: 1px; margin-top: 1px; }
.gd__menu span {
  padding: 3px 7px; border-radius: 4px;
  font-size: 13px; color: #3c4043; white-space: nowrap;
}
.gd__menu span:hover { background: var(--gd-hover); }
.gd__right { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.gd__share {
  display: flex; align-items: center; gap: 7px;
  height: 34px; padding: 0 18px; border-radius: 999px;
  background: #c2e7ff; color: #001d35; font-size: 13px; font-weight: 500;
  white-space: nowrap;
}
.gd__share svg { width: 16px; height: 16px; }
.gd__avatar {
  width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%;
  background: #7b4bd8; color: #fff;
  display: grid; place-items: center; font-size: 12px; font-weight: 500;
}
@media (max-width: 620px) { .gd__share span { display: none; } .gd__share { padding: 0 12px; } }

/* ---- toolbar ------------------------------------------------------------ */
.gd__toolwrap { padding: 6px 12px 10px; }
.gd__tools {
  display: flex; align-items: center; gap: 1px;
  height: 40px; padding: 0 10px;
  border-radius: 999px; background: var(--gd-bar);
  overflow-x: auto; scrollbar-width: none;
}
.gd__tools::-webkit-scrollbar { display: none; }
.gd-t {
  display: flex; align-items: center; justify-content: center; gap: 4px;
  height: 28px; min-width: 28px; padding: 0 5px;
  border: 0; border-radius: 4px; background: transparent;
  font: inherit; font-size: 13px; color: #444746;
  cursor: pointer; white-space: nowrap; flex: 0 0 auto;
}
.gd-t:hover:not(:disabled) { background: rgba(68, 71, 70, .1); }
.gd-t:disabled { opacity: .38; cursor: default; }
.gd-t[aria-pressed="true"] { background: #d3e3fd; color: #041e49; }
.gd-t svg { width: 18px; height: 18px; }
.gd-t--letter { font-family: "Times New Roman", Times, serif; font-size: 16px; }
.gd-t--letter.is-b { font-weight: 700; }
.gd-t--letter.is-i { font-style: italic; }
.gd-t--letter.is-u { text-decoration: underline; }
.gd__tsep { width: 1px; height: 20px; margin: 0 5px; background: #c7c7c7; flex: 0 0 1px; }
.gd__size { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; font-size: 13px; color: #444746; }
.gd__size i { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; font-style: normal; }
.gd__size i:hover { background: rgba(68, 71, 70, .1); }
.gd__size b {
  width: 34px; height: 24px; display: grid; place-items: center;
  border: 1px solid var(--gd-line); border-radius: 4px; background: #fff; font-weight: 400;
}

/* ---- the desk and the page ---------------------------------------------- */
.gd__desk {
  position: relative;
  background: var(--gd-desk);
  border-top: 1px solid #e3e6e8;
  padding: 20px 16px 28px;
  max-height: 58svh; overflow: auto;
}
.gd__page {
  width: 100%; max-width: 816px; margin: 0 auto;
  min-height: 240px; padding: 48px 56px;
  background: #fff;
  border: 1px solid #e6e6e6;
  box-shadow: 0 1px 3px rgba(60, 64, 67, .15);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 15px; line-height: 1.6; color: #202124;
}
.gd__page h1, .gd__page h2, .gd__page h3 {
  font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; color: #202124;
}
.gd__page p { margin: 0 0 14px; }
.gd__page p:last-child { margin-bottom: 0; }
.gd__page mark { background: #fff2a8; padding: 0 1px; }
.gd__page mark.is-now { background: #ffb300; }

/* ---- find and replace, the way Docs floats it over the page -------------- */
.gd-find {
  position: absolute; z-index: 5; top: 16px; right: 16px;
  width: min(430px, calc(100% - 32px));
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 1px 3px rgba(60, 64, 67, .3), 0 4px 16px rgba(60, 64, 67, .18);
  padding: 16px 20px 12px;
  font-size: 13px;
}
@media (max-width: 720px) {
  /* No room to float it: on a narrow screen it goes back into the flow. */
  .gd-find { position: static; width: 100%; margin: 0 0 16px; }
}
.gd-find__head {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 15px; color: var(--gd-text); margin-bottom: 12px;
}
.gd-find__head i { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; color: var(--gd-dim); font-style: normal; }
.gd-find__head i:hover { background: var(--gd-hover); }
.gd-find__head svg { width: 14px; height: 14px; }
.gd-field { margin-bottom: 14px; }
.gd-field label { display: block; font-size: 11px; color: var(--gd-blue); margin-bottom: 2px; }
.gd-field input {
  width: 100%; height: 30px; padding: 0 2px;
  border: 0; border-bottom: 2px solid var(--gd-blue);
  background: transparent; border-radius: 0;
  font: inherit; font-size: 14px; color: var(--gd-text);
}
.gd-field input:focus { outline: none; }
.gd-check { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; color: #3c4043; }
.gd-check input { accent-color: var(--gd-blue); }
.gd-find__foot { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
.gd-flat {
  height: 34px; padding: 0 12px;
  border: 0; border-radius: 4px; background: transparent;
  font: inherit; font-size: 14px; font-weight: 500; color: var(--gd-blue);
  cursor: pointer; white-space: nowrap;
}
.gd-flat:hover:not(:disabled) { background: rgba(26, 115, 232, .08); }
.gd-flat:disabled { color: #9aa0a6; cursor: default; }
.gd-flat--ghost { color: var(--gd-dim); }
.gd-flat--ghost:hover:not(:disabled) { background: var(--gd-hover); }

/* ---- status strip along the bottom of the window ------------------------ */
.gd__status {
  display: flex; align-items: center; gap: 14px;
  height: 28px; padding: 0 14px;
  border-top: 1px solid #e3e6e8;
  background: #fff;
  font-size: 11px; color: var(--gd-dim);
}
.gd__status b { margin-left: auto; font-weight: 400; }
</style>
