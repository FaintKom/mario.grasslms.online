<style>
/* Built from _shared/grasslms.css — edit that file, then run _shared/build.py */
/* ==========================================================================
   GrassLMS · Lively v2 — shared layer for standalone kid-facing activities
   Tokens lifted from lms2.9/frontend/src/app/globals.css (v2.0.0, 2026-08-02)
   and DESIGN_SPEC.md. Light only, exactly as the spec says.
   Never a raw hex inside a component — always a token.

   Load order in a page: link this file first, then the page's own style block
   with only what that one activity genuinely needs on top. Run _shared/build.py
   to fold this file into each page as a self-contained block.

   Note for future edits: nothing in this file may contain a literal closing
   style tag, not even inside a CSS comment. The build inlines this text into a
   style element, and an HTML parser ends that element at the first such tag it
   sees — comments do not protect it. A stray one dumps the whole stylesheet
   onto the page as visible text.
   ========================================================================== */

:root {
  --green-25:  #f4fbef;
  --green-50:  #ecf9e7;
  --green-100: #d4f1c4;
  --green-200: #b6e69e;
  --green-300: #8fd770;
  --green-400: #34a06a;
  --green-500: #17915e;
  --green-600: #0a8754;
  --green-700: #07683f;
  --green-800: #054d2f;
  --green-900: #0a3d24;

  --sun-50:  #fffbe5;
  --sun-100: #fff2b3;
  --sun-300: #ffe066;
  --sun-400: #ffd84d;
  --sun-500: #f5b800;
  --sun-700: #7a5500;

  --clay-50:  #fdefe7;
  --clay-100: #fbd8c7;
  --clay-300: #f6b394;
  --clay-500: #e2552f;
  --clay-600: #c1401d;
  --clay-700: #9e300f;

  --lagoon-50:  #e4f1f4;
  --lagoon-200: #b9d9e0;
  --lagoon-400: #3aa0b5;
  --lagoon-600: #12798f;
  --lagoon-800: #0a4652;

  --ink-50:  #f3f5ef;
  --ink-100: #e3e8dd;
  --ink-200: #c4cdbe;
  --ink-300: #93a08d;
  --ink-400: #6a7568;
  --ink-500: #485444;
  --ink-700: #232b22;
  --ink-900: #0d150d;

  --paper:   #fbfcf7;
  --paper-2: #ffffff;

  /* ---- SEMANTIC — components read these, never the ramps above -------- */
  --color-bg:            var(--paper);
  --color-surface:       var(--paper-2);
  --color-surface-2:     var(--ink-50);

  --color-text:          var(--ink-900);
  --color-text-muted:    var(--ink-500);
  --color-text-subtle:   var(--ink-400);
  --color-text-inverse:  #ffffff;

  --color-border:        var(--ink-100);
  --color-border-strong: var(--ink-200);
  --color-border-focus:  var(--green-500);

  --color-primary:       var(--green-600);
  --color-primary-hover: var(--green-700);
  --color-primary-soft:  var(--green-100);
  --color-primary-fg:    #ffffff;

  --color-reward:      var(--sun-400);
  --color-reward-soft: var(--sun-100);
  --color-reward-fg:   var(--sun-700);

  --color-success:      var(--green-600);
  --color-success-soft: var(--green-50);
  --color-success-fg:   var(--green-800);

  --color-danger:      var(--clay-500);
  --color-danger-soft: var(--clay-50);
  --color-danger-fg:   var(--clay-700);

  --color-info:      var(--lagoon-600);
  --color-info-soft: var(--lagoon-50);
  --color-info-fg:   var(--lagoon-800);

  /* ---- ELEVATION — the pop is a sharp solid offset, never a blur ------ */
  --shadow-xs: 0 1px 2px rgba(13, 21, 13, .05);
  --shadow-sm: 0 2px 6px -1px rgba(13, 21, 13, .07);
  --shadow-md: 0 8px 24px -8px rgba(13, 21, 13, .14);
  --shadow-lg: 0 18px 50px -20px rgba(13, 21, 13, .20);
  --ring-focus: 0 0 0 4px var(--green-100);

  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  --radius-pill: 999px;

  --s-1: 4px;  --s-2: 8px;  --s-3: 12px;  --s-4: 16px;  --s-5: 20px;
  --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px; --s-16: 64px;

  --control-sm: 36px;
  --control-md: 44px;   /* minimum touch target — a child's finger */
  --control-lg: 52px;

  --font-sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  --t-2xs: 11px; --t-xs: 12px; --t-sm: 13px; --t-base: 15px; --t-md: 17px;
  --t-lg: 20px;  --t-xl: 24px; --t-2xl: 32px; --t-3xl: 44px; --t-4xl: 60px;

  --tracking-display: -.035em;
  --tracking-heading: -.025em;
  --tracking-eyebrow: .12em;
  --leading-body: 1.65;

  /* Page gutters, as tokens: the activities that pin themselves to the
     viewport subtract --page-pad, so the two can never drift apart. */
  --page-top: 16px;
  --page-bottom: 20px;
  --page-pad: 36px;

  --motion-fast: 120ms;
  --motion-base: 200ms;
  --motion-ease: cubic-bezier(.2, .8, .3, 1);
}

/* ---- BASE -------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--t-base);
  line-height: var(--leading-body);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  margin: 0;
  font-weight: 800;
  letter-spacing: var(--tracking-heading);
  line-height: 1.15;
  text-wrap: balance;
  color: var(--color-text);          /* headings are never green */
}
h1 { font-size: clamp(var(--t-2xl), 5vw, var(--t-3xl)); letter-spacing: var(--tracking-display); }
h2 { font-size: clamp(var(--t-xl), 3.4vw, var(--t-2xl)); }
h3 { font-size: var(--t-lg); font-weight: 700; }
h4 { font-size: var(--t-md); font-weight: 700; }
p  { margin: 0; }

a { color: var(--color-info); text-decoration-thickness: 1px; text-underline-offset: 2px; }

/* The one typographic flourish: a sun marker on a single word of a heading.
   Never a UI background — the spec is explicit about that.

   The colour is pinned, not inherited. The background is always the same
   yellow, so the ink has to be always the same dark: on a night page the
   heading colour is near-white, and white on sun-300 cannot be read. */
.mark {
  background: var(--sun-300);
  color: var(--ink-900);
  padding: 0 var(--s-2);
  border-radius: var(--s-2);
  transform: rotate(-1deg);
  display: inline-block;
  font-style: normal;
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  text-transform: uppercase;
  letter-spacing: var(--tracking-eyebrow);
  font-weight: 500;
  color: var(--color-text-subtle);
}

.lede  { font-size: var(--t-md); color: var(--color-text-muted); max-width: 62ch; }
.muted { color: var(--color-text-muted); }
.mono  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---- LAYOUT ------------------------------------------------------------ */
.wrap { max-width: 960px; margin: 0 auto; padding: 0 clamp(var(--s-4), 4vw, var(--s-8)); }
.wrap--narrow { max-width: 680px; }
.wrap--wide   { max-width: 1180px; }
.stack { display: flex; flex-direction: column; gap: var(--s-4); }
.stack--tight { gap: var(--s-2); }
.stack--loose { gap: var(--s-8); }
.row { display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap; }
.row--between { justify-content: space-between; }
.center { display: grid; place-items: center; }

/* ---- BUTTONS — signature shadow-pop physics ---------------------------- */
.btn {
  --pop: var(--green-700);
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s-2);
  min-height: var(--control-md);
  padding: var(--s-3) var(--s-5);
  border: 0;
  border-radius: var(--radius-md);
  background: var(--color-primary);
  color: var(--color-primary-fg);
  font-family: inherit;
  font-size: var(--t-sm);
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 4px 0 0 var(--pop);
  transition:
    transform var(--motion-fast) var(--motion-ease),
    box-shadow var(--motion-fast) var(--motion-ease),
    background-color var(--motion-fast) var(--motion-ease);
}
.btn:hover:not(:disabled)  { transform: translateY(2px); box-shadow: 0 2px 0 0 var(--pop); background: var(--color-primary-hover); }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 0 var(--pop); }
.btn:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none !important; }

.btn--secondary { --pop: var(--ink-100); background: var(--color-surface); color: var(--color-text); }
.btn--secondary:hover:not(:disabled) { background: var(--ink-50); }
.btn--danger { --pop: var(--clay-700); background: var(--color-danger); }
.btn--danger:hover:not(:disabled) { background: var(--clay-600); }
.btn--sun { --pop: var(--sun-500); background: var(--sun-400); color: var(--ink-900); }
.btn--sun:hover:not(:disabled) { background: var(--sun-300); }
.btn--ink { --pop: var(--ink-900); background: var(--ink-700); }
.btn--ink:hover:not(:disabled) { background: var(--ink-900); }

.btn--ghost { box-shadow: none; background: transparent; color: var(--ink-700); }
.btn--ghost:hover:not(:disabled)  { background: var(--ink-50); transform: none; box-shadow: none; }
.btn--ghost:active:not(:disabled) { transform: none; box-shadow: none; }

.btn--sm { min-height: var(--control-sm); padding: var(--s-2) var(--s-4); font-size: var(--t-xs); border-radius: var(--radius-sm); }
.btn--lg { min-height: var(--control-lg); padding: var(--s-4) var(--s-6); font-size: var(--t-base); border-radius: var(--radius-lg); }
.btn--icon  { padding: 0; width: var(--control-md); height: var(--control-md); }
.btn--block { width: 100%; }

/* ---- SURFACES ---------------------------------------------------------- */
.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--s-5);
  box-shadow: var(--shadow-sm);
}
.card--flat { box-shadow: none; }
.panel { background: var(--color-surface-2); border-radius: var(--radius-md); padding: var(--s-4); }

/* ---- CHIPS ------------------------------------------------------------- */
.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--s-1);
  padding: var(--s-1) var(--s-3);
  border-radius: var(--radius-pill);
  background: var(--color-surface-2);
  color: var(--color-text-muted);
  font-size: var(--t-xs);
  font-weight: 600;
  white-space: nowrap;
}
.chip--reward  { background: var(--color-reward-soft);  color: var(--color-reward-fg); }
.chip--success { background: var(--color-success-soft); color: var(--color-success-fg); }
.chip--danger  { background: var(--color-danger-soft);  color: var(--color-danger-fg); }
.chip--info    { background: var(--color-info-soft);    color: var(--color-info-fg); }

/* ---- INPUTS ------------------------------------------------------------ */
.input, .select, .textarea {
  width: 100%;
  min-height: var(--control-md);
  padding: var(--s-3) var(--s-4);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  color: var(--color-text);
  font-family: inherit;
  font-size: var(--t-base);
}
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--color-border-focus);
  box-shadow: var(--ring-focus);
}
.label { display: block; font-size: var(--t-sm); font-weight: 600; margin-bottom: var(--s-2); }

/* ---- PROGRESS ---------------------------------------------------------- */
.progress { height: 10px; border-radius: var(--radius-pill); background: var(--ink-100); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--color-primary); border-radius: inherit; transition: width var(--motion-base) var(--motion-ease); }

.steps { display: flex; gap: var(--s-2); }
.steps > i { flex: 1; height: 6px; border-radius: var(--radius-pill); background: var(--ink-100); }
.steps > i.is-done    { background: var(--color-primary); }
.steps > i.is-current { background: var(--sun-400); }

/* ---- ACTIVITY PRIMITIVES — what every game here shares ----------------- */
.hud {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--s-4); flex-wrap: wrap;
  padding: var(--s-3) var(--s-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
}
.hud__score { font-family: var(--font-mono); font-size: var(--t-lg); font-weight: 700; font-variant-numeric: tabular-nums; }

.lives { display: inline-flex; gap: var(--s-1); }
.lives > i { width: 10px; height: 10px; border-radius: var(--radius-pill); background: var(--color-primary); }
.lives > i.is-spent { background: var(--ink-200); }

/* Draggable token and its target, sized for a finger per the tablet rule. */
.token {
  display: inline-flex; align-items: center; gap: var(--s-2);
  min-height: var(--control-md);
  padding: var(--s-2) var(--s-4);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  border: 1px solid var(--color-border-strong);
  box-shadow: var(--shadow-xs);
  cursor: grab;
  touch-action: none;
  user-select: none;
  font-weight: 600;
}
.token:active { cursor: grabbing; }
.token.is-dragging { opacity: .5; }

.dropzone {
  min-height: var(--control-lg);
  padding: var(--s-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius-md);
  background: var(--color-surface-2);
  transition: border-color var(--motion-fast) var(--motion-ease), background var(--motion-fast) var(--motion-ease);
}
.dropzone.is-over { border-color: var(--color-primary); background: var(--color-primary-soft); }

/* Verdict — colour is never the only signal; pair it with a mark or a word. */
.is-correct { border-color: var(--color-success) !important; background: var(--color-success-soft) !important; }
.is-wrong   { border-color: var(--color-danger)  !important; background: var(--color-danger-soft)  !important; }

.feedback { display: flex; gap: var(--s-3); padding: var(--s-4); border-radius: var(--radius-md); font-weight: 600; }
.feedback--ok   { background: var(--color-success-soft); color: var(--color-success-fg); }
.feedback--no   { background: var(--color-danger-soft);  color: var(--color-danger-fg); }
.feedback--hint { background: var(--color-info-soft);    color: var(--color-info-fg); font-weight: 500; }

/* ---- OPTION — the tap target for any multiple-choice answer ------------ */
.option {
  display: flex; align-items: center; gap: var(--s-3);
  width: 100%;
  min-height: 64px;                 /* the tablet rule, written down */
  padding: var(--s-3) var(--s-4);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  color: var(--color-text);
  font: inherit;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  transition: border-color var(--motion-fast) var(--motion-ease), background var(--motion-fast) var(--motion-ease);
}
.option:hover:not(:disabled) { border-color: var(--color-border-focus); }
.option:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }
.option.is-selected { border-color: var(--color-primary); background: var(--color-primary-soft); }
.option:disabled { cursor: default; }

/* ---- MODAL ------------------------------------------------------------- */
.scrim {
  position: fixed; inset: 0; z-index: 50;
  display: grid; place-items: center;
  padding: var(--s-4);
  background: rgba(13, 21, 13, .45);
}
.modal {
  width: min(480px, 100%);
  background: var(--color-surface);
  border-radius: var(--radius-xl);
  padding: var(--s-6);
  box-shadow: var(--shadow-lg);
  text-align: center;
}

/* ---- LANGUAGE SWITCH — two languages, English first -------------------- */
.langs { display: inline-flex; gap: var(--s-1); padding: var(--s-1); background: var(--color-surface-2); border-radius: var(--radius-pill); }
.langs button {
  min-height: var(--control-sm);
  padding: 0 var(--s-4);
  border: 0; border-radius: var(--radius-pill);
  background: transparent;
  color: var(--color-text-muted);
  font: inherit; font-size: var(--t-xs); font-weight: 700;
  cursor: pointer;
}
.langs button[aria-pressed="true"] { background: var(--color-surface); color: var(--color-text); box-shadow: var(--shadow-xs); }
.langs button:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }

/* ---- A11Y -------------------------------------------------------------- */
.visually-hidden {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    transition-duration: .001ms !important;
  }
  .btn:hover, .btn:active { transform: none; }
}

/* ---- NIGHT ------------------------------------------------------------- */
/* Not a dark mode. The spec is light-only and stays that way; this is a
   palette for pages whose subject is genuinely dark — the space scenes, where
   painting a starfield onto warm paper would fight the picture. Put
   data-night on <html> or on one section. Only the semantic aliases move; the
   ramps and every component below them are untouched, so a button keeps the
   same physics and a card keeps the same radius. */
[data-night] {
  --color-bg:            #070d12;
  --color-surface:       #0e1720;
  --color-surface-2:     #16222e;

  --color-text:          #eef4f1;
  --color-text-muted:    #b3c2c9;
  --color-text-subtle:   #7f929c;
  --color-text-inverse:  #070d12;

  --color-border:        #23323f;
  --color-border-strong: #35485a;
  --color-border-focus:  var(--green-300);

  --color-primary:       var(--green-400);
  --color-primary-hover: var(--green-300);
  --color-primary-soft:  #14342a;
  --color-primary-fg:    #041109;

  --color-reward:      var(--sun-300);
  --color-reward-soft: #3a3111;
  --color-reward-fg:   var(--sun-300);

  --color-success:      var(--green-300);
  --color-success-soft: #12301f;
  --color-success-fg:   var(--green-300);

  --color-danger:      var(--clay-300);
  --color-danger-soft: #3a1d13;
  --color-danger-fg:   var(--clay-300);

  --color-info:      var(--lagoon-400);
  --color-info-soft: #0d2b33;
  --color-info-fg:   var(--lagoon-200);

  --ring-focus: 0 0 0 4px #14342a;
}

/* The pop shadow needs a colour that reads against a dark ground. */
[data-night] .btn { --pop: #041109; }

/* These two variants name ramp colours directly rather than semantic aliases,
   so the night palette cannot reach them: a ghost button would be near-black
   ink on a near-black page, and a secondary button would flash a white panel
   under white text on hover. */
[data-night] .btn--ghost { color: var(--color-text-muted); }
[data-night] .btn--ghost:hover:not(:disabled) { background: rgba(255, 255, 255, .08); }
[data-night] .btn--secondary { --pop: #23323f; }
[data-night] .btn--secondary:hover:not(:disabled) { background: var(--color-surface-2); }

/* ---- SHORT SCREENS ------------------------------------------------------ */
/* A 1366x768 laptop leaves roughly 660px once the browser has taken its share,
   and every activity here is meant to land whole on one screen. Below 760px of
   viewport the heading block and the card padding give up some of their air so
   the working part stays above the fold. Nothing moves, nothing hides — the
   same layout, breathing a little less. */
@media (max-height: 760px) {
  :root { --page-top: 12px; --page-bottom: 14px; --page-pad: 26px; }
  h1 { font-size: var(--t-xl); }
  h2 { font-size: var(--t-lg); }
  .lede { font-size: var(--t-sm); }
  .stack { gap: var(--s-3); }
  .stack--loose { gap: var(--s-3); }
  .stack--tight { gap: var(--s-1); }
  .card { padding: var(--s-4); }
  .hud { padding: var(--s-2) var(--s-3); }
  body { padding-bottom: var(--s-4); }
}

/* A netbook, a projector, a browser with three toolbars open. Same layout
   again, one notch tighter. */
@media (max-height: 700px) {
  :root { --page-top: 10px; --page-bottom: 10px; --page-pad: 20px; }
  h1 { font-size: var(--t-lg); }
  h2 { font-size: var(--t-md); }
  .lede { font-size: var(--t-xs); }
  .card { padding: var(--s-3); }
  .stack, .stack--loose { gap: var(--s-2); }
  .hud { padding: var(--s-1) var(--s-3); }
}
</style>
<!-- grasslms:end -->
<style>
  body { padding: var(--s-6) 0 var(--s-12); }

  .doors { display: flex; gap: var(--s-2); }
  .doors i { flex: 1; height: 8px; border-radius: var(--radius-pill); background: var(--ink-100); }
  .doors i.is-open { background: var(--color-primary); }
  .doors i.is-now  { background: var(--sun-400); }

  .speaker { display: flex; gap: var(--s-3); align-items: flex-start; }
  .speaker__face {
    width: 44px; height: 44px; flex: none; display: grid; place-items: center;
    border-radius: var(--radius-pill); background: var(--color-info-soft); font-size: 24px;
  }
  .speaker__line { font-size: var(--t-md); }

  .answers { display: grid; gap: var(--s-2); }
  .answers--grid { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .option.is-right { border-color: var(--color-success); background: var(--color-success-soft); }
  .option.is-off   { border-color: var(--color-danger);  background: var(--color-danger-soft); }

  .letters { display: flex; flex-wrap: wrap; gap: var(--s-2); }
  .letter {
    width: 52px; height: 52px; border-radius: var(--radius-md);
    border: 1px solid var(--color-border-strong); background: var(--color-surface);
    font: inherit; font-family: var(--font-mono); font-size: var(--t-lg); font-weight: 700;
    cursor: pointer;
  }
  .letter:disabled { opacity: .35; cursor: default; }
  .slots { display: flex; gap: var(--s-2); }
  .slot {
    width: 52px; height: 52px; border-radius: var(--radius-md);
    border: 2px dashed var(--color-border-strong); background: var(--color-surface-2);
    display: grid; place-items: center;
    font-family: var(--font-mono); font-size: var(--t-lg); font-weight: 700;
  }
  .slot.is-filled { border-style: solid; background: var(--color-surface); }

  .pairs { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-4); }
  .pairs .col { display: grid; gap: var(--s-2); }
  .pair {
    min-height: var(--control-md); padding: var(--s-2) var(--s-3);
    border: 1px solid var(--color-border-strong); border-radius: var(--radius-md);
    background: var(--color-surface); font: inherit; font-weight: 600; font-size: var(--t-sm);
    color: var(--color-text); cursor: pointer; text-align: left;
  }
  .pair { display: flex; align-items: center; gap: var(--s-2); }
  .pair[aria-pressed="true"] { border-color: var(--color-primary); background: var(--color-primary-soft); }
  /* Joined but not yet checked: neutral, numbered, and still tappable to
     undo. Green is kept for after the check, so a wrong pair never looks
     right just because it is joined. */
  .pair.is-linked { border-style: dashed; border-color: var(--ink-400); background: var(--color-surface-2); }
  .pair.is-right { border-style: solid; border-color: var(--color-success); background: var(--color-success-soft); cursor: default; }
  .pair__n {
    flex: none; width: 24px; height: 24px; display: grid; place-items: center;
    border-radius: var(--radius-pill); background: var(--ink-700); color: #ffffff;
    font-family: var(--font-mono); font-size: var(--t-xs); font-weight: 700;
  }

  .source { font-size: var(--t-xs); color: var(--color-text-subtle); }
  .source a { color: var(--color-info); }

  /* Small labels in plain sentence case, not spaced capitals. */
  .eyebrow { font-family: var(--font-sans); font-size: var(--t-sm); font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--color-text-muted); }
  .row--between > .back { align-self: center; }

  [hidden] { display: none !important; }
</style>
<style>
  /* Way back to the catalogue, same look as its own back link. */
  .back { display: inline-flex; align-items: center; gap: var(--s-2); align-self: flex-start;
    font-family: var(--font-mono); font-size: var(--t-2xs); font-weight: 500; text-transform: uppercase;
    letter-spacing: var(--tracking-eyebrow); color: var(--color-text-subtle); text-decoration: none; }
  .back:hover { color: var(--color-text); }
  .back svg { width: 13px; height: 13px; flex: 0 0 13px; }
</style>
</head>
<body>

<div class="wrap wrap--narrow stack stack--loose">

  <header class="stack stack--tight">
    <div class="row row--between">
      <span class="row" style="gap: var(--s-4)"><a class="back" href="../../index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg><span data-t="allActivities">All activities</span></a><a class="back" href="../../10-cosmodrome/cosmodrome-map-3d.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg><span data-t="toMap">Back to the map</span></a></span>

      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="es" aria-pressed="false">ES</button>
      </div>
    </div>
    <h1><span data-t="title1">Five doors between you and</span> <em class="mark" data-t="title2">Andy</em></h1>
    <p class="lede" data-t="intro">The virus has locked Andy, the spaceport's helper robot, behind five doors. Each door asks about one of the spaceport tasks you have played, and when you answer it, the next door opens.</p>
  </header>

  <section class="card stack" id="game">
    <div class="row row--between">
      <span class="eyebrow"><span data-t="doorLabel">Door</span> <span id="dNum" class="mono">1</span>/5</span>
      <span class="chip" id="score">0 / 5</span>
    </div>
    <div class="doors" id="doors" aria-hidden="true"></div>

    <div class="speaker">
      <div class="speaker__face" aria-hidden="true">🔒</div>
      <p class="speaker__line" id="say">…</p>
    </div>
    <p class="source" id="source"></p>

    <div id="body"></div>
    <div id="verdict" hidden></div>
    <div class="row">
      <button class="btn" id="check" data-t="check" hidden>Check</button>
      <button class="btn" id="next" data-t="next" hidden>Go to the next door</button>
    </div>
  </section>

  <section class="card stack" id="over" hidden aria-live="polite">
    <h2 data-t="wonTitle">Andy is free</h2>
    <p class="muted" id="wonBody"></p>
    <div><button class="btn" id="again" data-t="again">Play again</button></div>
  </section>

</div>

<script>
(function () {
  "use strict";

  /* Every door asks about a task that is in the catalogue, so a visitor who
     has played them can answer and one who has not can go and look: each
     door names its task and links to it. Facts come from those pages:
     2157 is the impossible launch year in Find and replace (task-c1), START
     and MARTE are decoded words in The secret cipher (task-c2), the
     cancelled spacewalk is struck through in Format the report (task-c3),
     royal-song.mp3 goes to Audio in File Kingdom, and the pairs come from
     the folder tree (task-a3), the pixel rocket (task-b3) and task-c1.

     Answers are stored as values, never as positions: the options, the
     letters and the right-hand column are shuffled when a door opens. */
  const BASE = "../../01-interface-simulators/html-editor-find-replace/";
  const TASKS = {
    c1: { href: BASE + "task-c1.html", en: "Find and replace", es: "Buscar y reemplazar" },
    c2: { href: BASE + "task-c2.html", en: "The secret cipher", es: "La clave secreta" },
    c3: { href: BASE + "task-c3.html", en: "Format the report", es: "Formatear el informe" },
    fk: { href: "../file-kingdom/index.html", en: "File Kingdom", es: "Reino de Archivos" },
    a3: { href: "../cosmodrome-virus/task-a3.html", en: "Rebuild the folder tree", es: "Reconstruir el árbol de carpetas" },
    b3: { href: "../cosmodrome-virus/task-b3.html", en: "Pixel rocket", es: "Cohete de píxeles" }
  };
  const SOURCES = { 1: ["c1"], 2: ["c2"], 3: ["c3"], 4: ["fk"], 5: ["a3", "b3", "c1"] };

  const T = {
    en: {
      allActivities: "All activities", toMap: "Back to the map",
      title1: "Five doors between you and", title2: "Andy",
      intro: "The virus has locked Andy, the spaceport's helper robot, behind five doors. Each door asks about one of the spaceport tasks you have played, and when you answer it, the next door opens.",
      doorLabel: "Door", check: "Check", next: "Go to the next door", again: "Play again",
      wonTitle: "Andy is free",
      from: "This door asks about",
      undo: "Take back the last letter", restartPairs: "Undo all the pairs",
      wonBody: function (n) {
        return n === 5
          ? "You opened all five doors, each one on your first answer."
          : "You opened all five doors, and " + n + " of them opened on your first answer.";
      },
      d1: { say: "When you fixed the mission log with Find and replace, one launch year was impossible. Which year was it?",
            options: ["2157", "2030", "2026", "2036"], answer: "2157",
            ok: "2157 is much too far in the future for a rocket that is already waiting on the launch pad.",
            no: "That year could still happen. Look for the one that is much too far in the future." },
      d2: { say: "The password for this door is the second word you decoded in the secret cipher. Put its letters in the right order.",
            answer: "START",
            ok: "START opens the door.",
            no: "Those letters do not make the word yet. Think of the word a race begins with." },
      d3: { say: "In the mission report, Mission Control asked you to change the line about the cancelled spacewalk. What did you do to that line?",
            options: ["Struck it through", "Made it bold", "Coloured it blue", "Made it bigger"], answer: "Struck it through",
            ok: "A line through the text shows that the spacewalk was cancelled, and everyone can still read it.",
            no: "That change would not show that the plan was cancelled. Think about what people do on paper to a plan they drop." },
      d4: { say: "In the File Kingdom, which room does royal-song.mp3 belong in?",
            options: ["Audio", "Documents", "Pictures", "Video"], answer: "Audio",
            ok: "The .mp3 at the end of the name means it is a sound file, so it goes to Audio.",
            no: "That room takes another kind of file. Look again at the letters after the dot." },
      d5: { say: "This is the last door. Join each task to what you did in it by tapping a task on the left and then its partner on the right.",
            left: ["Rebuild the folder tree", "Copy the pixel rocket", "Fix the mission log"],
            right: ["Put the Pilots folder inside Crew", "Paint a plan square by square", "Swap wrong words with Replace all"],
            ok: "All three pairs match, and the last door opens.",
            no: "One pair does not match yet. The pairs have been undone, and you can try again." }
    },
    es: {
      allActivities: "Todas las actividades", toMap: "Volver al mapa",
      title1: "Cinco puertas entre tú y", title2: "Andy",
      intro: "El virus ha encerrado a Andy, el robot que ayuda en el puerto espacial, detrás de cinco puertas. Cada puerta pregunta por una de las tareas del puerto espacial que ya has jugado, y cuando la respondes, se abre la siguiente.",
      doorLabel: "Puerta", check: "Comprobar", next: "Ir a la siguiente puerta", again: "Jugar otra vez",
      wonTitle: "Andy está libre",
      from: "Esta puerta pregunta por",
      undo: "Quitar la última letra", restartPairs: "Deshacer todas las parejas",
      wonBody: function (n) {
        return n === 5
          ? "Abriste las cinco puertas, cada una con tu primera respuesta."
          : "Abriste las cinco puertas, y " + n + " de ellas se abrieron con tu primera respuesta.";
      },
      d1: { say: "Cuando arreglaste el diario de misión con Buscar y reemplazar, había un año de lanzamiento imposible. ¿Qué año era?",
            options: ["2157", "2030", "2026", "2036"], answer: "2157",
            ok: "2157 queda demasiado lejos en el futuro para un cohete que ya espera en la plataforma.",
            no: "Ese año todavía podría ser. Busca el que queda demasiado lejos en el futuro." },
      d2: { say: "La contraseña de esta puerta es la primera palabra que descifraste en la clave secreta. Pon sus letras en el orden correcto.",
            answer: "MARTE",
            ok: "MARTE abre la puerta.",
            no: "Esas letras todavía no forman la palabra. Piensa en el planeta rojo." },
      d3: { say: "En el informe de misión, Control de Misión te pidió cambiar la línea del paseo espacial cancelado. ¿Qué le hiciste a esa línea?",
            options: ["La tachaste", "La pusiste en negrita", "La pusiste en azul", "La hiciste más grande"], answer: "La tachaste",
            ok: "Una raya encima del texto muestra que el paseo espacial se canceló, y todos pueden seguir leyéndolo.",
            no: "Ese cambio no mostraría que el plan se canceló. Piensa qué se hace en un papel con un plan que ya no va." },
      d4: { say: "En el Reino de Archivos, ¿en qué sala va cancion-real.mp3?",
            options: ["Audio", "Documentos", "Imágenes", "Vídeo"], answer: "Audio",
            ok: "El .mp3 del final del nombre significa que es un archivo de sonido, así que va a Audio.",
            no: "Esa sala es para otro tipo de archivo. Vuelve a mirar las letras que van después del punto." },
      d5: { say: "Esta es la última puerta. Une cada tarea con lo que hiciste en ella tocando una tarea a la izquierda y después su pareja a la derecha.",
            left: ["Reconstruir el árbol de carpetas", "Copiar el cohete de píxeles", "Arreglar el diario de misión"],
            right: ["Meter la carpeta Pilotos dentro de Tripulacion", "Pintar un plano cuadro a cuadro", "Cambiar palabras mal con Reemplazar todo"],
            ok: "Las tres parejas encajan, y la última puerta se abre.",
            no: "Una pareja todavía no encaja. Se han deshecho las parejas y puedes volver a intentarlo." }
    }
  };

  var lang = "en", door = 1, score = 0, firstTry = true, solved = 0, passed = false;
  var slots = [], usedLetters = [], links = [], pendingLeft = null;
  var perm = null, finishTimer = null, over = false;

  const $ = function (id) { return document.getElementById(id); };
  const t = function () { return T[lang]; };
  const spec = function () { return t()["d" + door]; };

  /* A shuffled list of the indices 0..n-1. With avoidIdentity it never comes
     back in the original order, which for letters would be the answer and
     for pairs would put every partner straight across. */
  function shuffled(n, avoidIdentity) {
    var a = [], i, tries = 0;
    for (i = 0; i < n; i++) a.push(i);
    do {
      for (i = n - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var x = a[i]; a[i] = a[j]; a[j] = x;
      }
      tries++;
    } while (avoidIdentity && n > 1 && tries < 50 && a.every(function (v, k) { return v === k; }));
    return a;
  }

  function lettersOf(word) { return word.split(""); }

  function paintChrome() {
    const d = t();
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach(function (el) {
      const v = d[el.dataset.t];
      if (typeof v === "string") el.textContent = v;
    });
    $("dNum").textContent = String(door);
    $("score").textContent = solved + " / 5";
    const db = $("doors");
    db.innerHTML = "";
    for (var i = 1; i <= 5; i++) {
      const x = document.createElement("i");
      if (i < door || (i === door && passed)) x.className = "is-open";
      else if (i === door) x.className = "is-now";
      db.appendChild(x);
    }

    const src = $("source");
    src.innerHTML = "";
    src.appendChild(document.createTextNode(d.from + " "));
    /* Read as a sentence: "…about A, B and C." */
    var list = SOURCES[door];
    list.forEach(function (key, i) {
      if (i) src.appendChild(document.createTextNode(i === list.length - 1 ? (lang === "es" ? " y " : " and ") : ", "));
      const a = document.createElement("a");
      a.href = TASKS[key].href; a.target = "_blank"; a.rel = "noopener";
      a.textContent = TASKS[key][lang];
      src.appendChild(a);
    });
    src.appendChild(document.createTextNode("."));
  }

  function say(kind, text) {
    const v = $("verdict");
    v.hidden = false;
    v.className = "feedback feedback--" + kind;
    v.textContent = text;
  }

  function pass(text) {
    solved++;
    if (firstTry) score++;
    passed = true;
    say("ok", text);
    $("check").hidden = true;
    $("next").hidden = door >= 5;
    paintChrome();
    if (door >= 5) finish();
  }

  /* fresh: a new door, so shuffle and forget the old answers. Not fresh:
     the same door redrawn in the other language, keeping its shuffle, its
     first-try flag and whether it is already open. */
  function renderDoor(fresh) {
    const s = spec();
    if (fresh) {
      firstTry = true; passed = false;
      var n = s.options ? s.options.length : s.left ? s.left.length : 0;
      perm = s.options ? shuffled(n, false)
           : s.left ? shuffled(n, true)
           : null;
    }
    pendingLeft = null;
    slots = []; usedLetters = []; links = [];
    $("verdict").hidden = true;
    $("next").hidden = true;
    $("check").hidden = true;
    $("say").textContent = s.say;
    paintChrome();

    const body = $("body");
    body.innerHTML = "";

    if (s.options) {
      const box = document.createElement("div");
      box.className = "answers" + (door === 4 ? " answers--grid" : "");
      perm.forEach(function (i) {
        const label = s.options[i];
        const b = document.createElement("button");
        b.type = "button"; b.className = "option"; b.textContent = label;
        b.disabled = passed;
        if (passed && label === s.answer) b.classList.add("is-right");
        b.onclick = function () {
          if (b.disabled) return;
          if (label === s.answer) {
            b.classList.add("is-right");
            Array.prototype.forEach.call(box.children, function (x) { x.disabled = true; });
            pass(s.ok);
          } else {
            b.classList.add("is-off"); b.disabled = true;
            firstTry = false; say("no", s.no);
          }
        };
        box.appendChild(b);
      });
      body.appendChild(box);
      if (passed) { say("ok", s.ok); $("next").hidden = door >= 5; }
      return;
    }

    if (!s.left) {
      /* The letters door. The shuffle is redrawn per language, because the
         word itself changes with the language. */
      const word = s.answer;
      if (fresh || !perm || perm.length !== word.length) perm = shuffled(word.length, true);
      const letters = perm.map(function (i) { return word[i]; });

      const wrap = document.createElement("div");
      wrap.className = "stack";
      const slotRow = document.createElement("div"); slotRow.className = "slots";
      const letterRow = document.createElement("div"); letterRow.className = "letters";

      const paint = function () {
        slotRow.innerHTML = "";
        for (var i = 0; i < word.length; i++) {
          const sl = document.createElement("div");
          const shown = passed ? word[i] : slots[i];
          sl.className = "slot" + (shown ? " is-filled" : "");
          sl.textContent = shown || "";
          slotRow.appendChild(sl);
        }
        letterRow.innerHTML = "";
        letters.forEach(function (L, i) {
          const b = document.createElement("button");
          b.type = "button"; b.className = "letter"; b.textContent = L;
          b.disabled = passed || usedLetters.indexOf(i) >= 0;
          b.onclick = function () {
            if (slots.length >= word.length) return;
            slots.push(L); usedLetters.push(i); paint();
          };
          letterRow.appendChild(b);
        });
        $("check").hidden = passed || slots.length !== word.length;
      };

      const undo = document.createElement("button");
      undo.type = "button"; undo.className = "btn btn--ghost btn--sm";
      undo.textContent = "←";
      undo.setAttribute("aria-label", t().undo);
      undo.title = t().undo;
      undo.hidden = passed;
      undo.onclick = function () { slots.pop(); usedLetters.pop(); paint(); };

      wrap.append(slotRow, letterRow, undo);
      body.appendChild(wrap);
      paint();

      $("check").onclick = function () {
        if (slots.join("") === word) {
          pass(s.ok);
          undo.hidden = true;
          paint();
        } else {
          firstTry = false; say("no", s.no);
          slots = []; usedLetters = []; paint();
        }
      };
      if (passed) { say("ok", s.ok); $("next").hidden = door >= 5; }
      return;
    }

    /* The pairs door. perm[j] is the original index of the item shown in
       right-hand row j; a link is right when that index equals the left one. */
    const grid = document.createElement("div");
    grid.className = "pairs";
    const colL = document.createElement("div"); colL.className = "col";
    const colR = document.createElement("div"); colR.className = "col";

    const numberOf = function (side, i) {
      for (var k = 0; k < links.length; k++) if (links[k][side] === i) return k + 1;
      return 0;
    };
    const tag = function (b, n, text) {
      b.innerHTML = "";
      if (n) {
        const badge = document.createElement("span");
        badge.className = "pair__n"; badge.textContent = String(n);
        b.appendChild(badge);
      }
      b.appendChild(document.createTextNode(text));
    };

    const paint = function () {
      colL.innerHTML = ""; colR.innerHTML = "";
      s.left.forEach(function (label, i) {
        const b = document.createElement("button");
        b.type = "button"; b.className = "pair";
        const n = passed ? i + 1 : numberOf("l", i);
        tag(b, n, label);
        if (passed) b.classList.add("is-right");
        else if (n) b.classList.add("is-linked");
        b.setAttribute("aria-pressed", String(pendingLeft === i));
        b.disabled = passed;
        b.onclick = function () {
          if (n) { links = links.filter(function (l) { return l.l !== i; }); pendingLeft = null; }
          else pendingLeft = pendingLeft === i ? null : i;
          paint();
        };
        colL.appendChild(b);
      });
      perm.forEach(function (orig, j) {
        const b = document.createElement("button");
        b.type = "button"; b.className = "pair";
        const n = passed ? orig + 1 : numberOf("r", j);
        tag(b, n, s.right[orig]);
        if (passed) b.classList.add("is-right");
        else if (n) b.classList.add("is-linked");
        b.disabled = passed;
        b.onclick = function () {
          if (n) { links = links.filter(function (l) { return l.r !== j; }); paint(); return; }
          if (pendingLeft === null) return;
          links.push({ l: pendingLeft, r: j });
          pendingLeft = null;
          paint();
        };
        colR.appendChild(b);
      });
      $("check").hidden = passed || links.length !== s.left.length;
    };

    const restart = document.createElement("button");
    restart.type = "button"; restart.className = "btn btn--ghost btn--sm";
    restart.textContent = "↺";
    restart.setAttribute("aria-label", t().restartPairs);
    restart.title = t().restartPairs;
    restart.hidden = passed;
    restart.onclick = function () { links = []; pendingLeft = null; paint(); };

    grid.append(colL, colR);
    body.append(grid, restart);
    paint();

    $("check").onclick = function () {
      const ok = links.length === s.left.length && links.every(function (l) { return perm[l.r] === l.l; });
      if (ok) { pass(s.ok); restart.hidden = true; paint(); }
      else { firstTry = false; say("no", s.no); links = []; paint(); }
    };
    if (passed) say("ok", s.ok);
  }

  function paintOver() {
    $("game").hidden = over;
    $("over").hidden = !over;
    if (over) $("wonBody").textContent = t().wonBody(score);
  }

  /* The end card waits a moment so the last green answer can be seen. The
     timer is kept so a restart can cancel it; a language switch does not
     touch the game state any more, so the card it opens is always right. */
  const TASK_ID = "five-doors";
  /* Progress. One shared key, so the spaceport map knows this one is done.
     try/catch: a private window or blocked site data makes localStorage throw. */
  function remember() {
    try {
      const key = "kids.progress.v1";
      const seen = JSON.parse(localStorage.getItem(key) || "{}");
      seen[TASK_ID] = true;
      localStorage.setItem(key, JSON.stringify(seen));
    } catch (err) {}
  }

  function finish() {
    remember();
    clearTimeout(finishTimer);
    finishTimer = setTimeout(function () {
      finishTimer = null;
      over = true;
      paintOver();
    }, 1400);
  }

  function reset() {
    clearTimeout(finishTimer); finishTimer = null;
    door = 1; score = 0; solved = 0; over = false;
    paintOver();
    renderDoor(true);
  }

  $("next").onclick = function () { door++; renderDoor(true); };
  $("again").onclick = reset;

  document.querySelectorAll(".langs button").forEach(function (b) {
    b.onclick = function () {
      lang = b.dataset.lang;
      document.querySelectorAll(".langs button").forEach(function (x) {
        x.setAttribute("aria-pressed", String(x === b));
      });
      renderDoor(false);
      paintOver();
    };
  });

  reset();
})();
</script>
</body>
</html>
