<!DOCTYPE html>
<html lang="en" data-night>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spaceport Sector Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;700&display=swap">
<!-- grasslms:begin -->
<style>
/* Built from _shared/grasslms.css — edit that file, then run _shared/build.py */
/* ==========================================================================
   GrassLMS · Lively v2 — shared layer for standalone kid-facing activities
   Tokens lifted from lms2.9/frontend/src/app/globals.css (v2.0.0, 2026-08-02)
   and DESIGN_SPEC.md. Light only, exactly as the spec says.
   Never a raw hex inside a component — always a token.

   Load order in a page: link this file first, then the page's own style block
   with only what that one activity genuinely needs on top. Run _shared/build.py
   to fold this file into each page as a self-contained block.

   Note for future edits: nothing in this file may contain a literal closing
   style tag, not even inside a CSS comment. The build inlines this text into a
   style element, and an HTML parser ends that element at the first such tag it
   sees — comments do not protect it. A stray one dumps the whole stylesheet
   onto the page as visible text.
   ========================================================================== */

:root {
  --green-25:  #f4fbef;
  --green-50:  #ecf9e7;
  --green-100: #d4f1c4;
  --green-200: #b6e69e;
  --green-300: #8fd770;
  --green-400: #34a06a;
  --green-500: #17915e;
  --green-600: #0a8754;
  --green-700: #07683f;
  --green-800: #054d2f;
  --green-900: #0a3d24;

  --sun-50:  #fffbe5;
  --sun-100: #fff2b3;
  --sun-300: #ffe066;
  --sun-400: #ffd84d;
  --sun-500: #f5b800;
  --sun-700: #7a5500;

  --clay-50:  #fdefe7;
  --clay-100: #fbd8c7;
  --clay-300: #f6b394;
  --clay-500: #e2552f;
  --clay-600: #c1401d;
  --clay-700: #9e300f;

  --lagoon-50:  #e4f1f4;
  --lagoon-200: #b9d9e0;
  --lagoon-400: #3aa0b5;
  --lagoon-600: #12798f;
  --lagoon-800: #0a4652;

  --ink-50:  #f3f5ef;
  --ink-100: #e3e8dd;
  --ink-200: #c4cdbe;
  --ink-300: #93a08d;
  --ink-400: #6a7568;
  --ink-500: #485444;
  --ink-700: #232b22;
  --ink-900: #0d150d;

  --paper:   #fbfcf7;
  --paper-2: #ffffff;

  /* ---- SEMANTIC — components read these, never the ramps above -------- */
  --color-bg:            var(--paper);
  --color-surface:       var(--paper-2);
  --color-surface-2:     var(--ink-50);

  --color-text:          var(--ink-900);
  --color-text-muted:    var(--ink-500);
  --color-text-subtle:   var(--ink-400);
  --color-text-inverse:  #ffffff;

  --color-border:        var(--ink-100);
  --color-border-strong: var(--ink-200);
  --color-border-focus:  var(--green-500);

  --color-primary:       var(--green-600);
  --color-primary-hover: var(--green-700);
  --color-primary-soft:  var(--green-100);
  --color-primary-fg:    #ffffff;

  --color-reward:      var(--sun-400);
  --color-reward-soft: var(--sun-100);
  --color-reward-fg:   var(--sun-700);

  --color-success:      var(--green-600);
  --color-success-soft: var(--green-50);
  --color-success-fg:   var(--green-800);

  --color-danger:      var(--clay-500);
  --color-danger-soft: var(--clay-50);
  --color-danger-fg:   var(--clay-700);

  --color-info:      var(--lagoon-600);
  --color-info-soft: var(--lagoon-50);
  --color-info-fg:   var(--lagoon-800);

  /* ---- ELEVATION — the pop is a sharp solid offset, never a blur ------ */
  --shadow-xs: 0 1px 2px rgba(13, 21, 13, .05);
  --shadow-sm: 0 2px 6px -1px rgba(13, 21, 13, .07);
  --shadow-md: 0 8px 24px -8px rgba(13, 21, 13, .14);
  --shadow-lg: 0 18px 50px -20px rgba(13, 21, 13, .20);
  --ring-focus: 0 0 0 4px var(--green-100);

  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  --radius-pill: 999px;

  --s-1: 4px;  --s-2: 8px;  --s-3: 12px;  --s-4: 16px;  --s-5: 20px;
  --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px; --s-16: 64px;

  --control-sm: 36px;
  --control-md: 44px;   /* minimum touch target — a child's finger */
  --control-lg: 52px;

  --font-sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  --t-2xs: 11px; --t-xs: 12px; --t-sm: 13px; --t-base: 15px; --t-md: 17px;
  --t-lg: 20px;  --t-xl: 24px; --t-2xl: 32px; --t-3xl: 44px; --t-4xl: 60px;

  --tracking-display: -.035em;
  --tracking-heading: -.025em;
  --tracking-eyebrow: .12em;
  --leading-body: 1.65;

  /* Page gutters, as tokens: the activities that pin themselves to the
     viewport subtract --page-pad, so the two can never drift apart. */
  --page-top: 16px;
  --page-bottom: 20px;
  --page-pad: 36px;

  --motion-fast: 120ms;
  --motion-base: 200ms;
  --motion-ease: cubic-bezier(.2, .8, .3, 1);
}

/* ---- BASE -------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--t-base);
  line-height: var(--leading-body);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  margin: 0;
  font-weight: 800;
  letter-spacing: var(--tracking-heading);
  line-height: 1.15;
  text-wrap: balance;
  color: var(--color-text);          /* headings are never green */
}
h1 { font-size: clamp(var(--t-2xl), 5vw, var(--t-3xl)); letter-spacing: var(--tracking-display); }
h2 { font-size: clamp(var(--t-xl), 3.4vw, var(--t-2xl)); }
h3 { font-size: var(--t-lg); font-weight: 700; }
h4 { font-size: var(--t-md); font-weight: 700; }
p  { margin: 0; }

a { color: var(--color-info); text-decoration-thickness: 1px; text-underline-offset: 2px; }

/* The one typographic flourish: a sun marker on a single word of a heading.
   Never a UI background — the spec is explicit about that.

   The colour is pinned, not inherited. The background is always the same
   yellow, so the ink has to be always the same dark: on a night page the
   heading colour is near-white, and white on sun-300 cannot be read. */
.mark {
  background: var(--sun-300);
  color: var(--ink-900);
  padding: 0 var(--s-2);
  border-radius: var(--s-2);
  transform: rotate(-1deg);
  display: inline-block;
  font-style: normal;
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  text-transform: uppercase;
  letter-spacing: var(--tracking-eyebrow);
  font-weight: 500;
  color: var(--color-text-subtle);
}

.lede  { font-size: var(--t-md); color: var(--color-text-muted); max-width: 62ch; }
.muted { color: var(--color-text-muted); }
.mono  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---- LAYOUT ------------------------------------------------------------ */
.wrap { max-width: 960px; margin: 0 auto; padding: 0 clamp(var(--s-4), 4vw, var(--s-8)); }
.wrap--narrow { max-width: 680px; }
.wrap--wide   { max-width: 1180px; }
.stack { display: flex; flex-direction: column; gap: var(--s-4); }
.stack--tight { gap: var(--s-2); }
.stack--loose { gap: var(--s-8); }
.row { display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap; }
.row--between { justify-content: space-between; }
.center { display: grid; place-items: center; }

/* ---- BUTTONS — signature shadow-pop physics ---------------------------- */
.btn {
  --pop: var(--green-700);
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s-2);
  min-height: var(--control-md);
  padding: var(--s-3) var(--s-5);
  border: 0;
  border-radius: var(--radius-md);
  background: var(--color-primary);
  color: var(--color-primary-fg);
  font-family: inherit;
  font-size: var(--t-sm);
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 4px 0 0 var(--pop);
  transition:
    transform var(--motion-fast) var(--motion-ease),
    box-shadow var(--motion-fast) var(--motion-ease),
    background-color var(--motion-fast) var(--motion-ease);
}
.btn:hover:not(:disabled)  { transform: translateY(2px); box-shadow: 0 2px 0 0 var(--pop); background: var(--color-primary-hover); }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 0 var(--pop); }
.btn:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none !important; }

.btn--secondary { --pop: var(--ink-100); background: var(--color-surface); color: var(--color-text); }
.btn--secondary:hover:not(:disabled) { background: var(--ink-50); }
.btn--danger { --pop: var(--clay-700); background: var(--color-danger); }
.btn--danger:hover:not(:disabled) { background: var(--clay-600); }
.btn--sun { --pop: var(--sun-500); background: var(--sun-400); color: var(--ink-900); }
.btn--sun:hover:not(:disabled) { background: var(--sun-300); }
.btn--ink { --pop: var(--ink-900); background: var(--ink-700); }
.btn--ink:hover:not(:disabled) { background: var(--ink-900); }

.btn--ghost { box-shadow: none; background: transparent; color: var(--ink-700); }
.btn--ghost:hover:not(:disabled)  { background: var(--ink-50); transform: none; box-shadow: none; }
.btn--ghost:active:not(:disabled) { transform: none; box-shadow: none; }

.btn--sm { min-height: var(--control-sm); padding: var(--s-2) var(--s-4); font-size: var(--t-xs); border-radius: var(--radius-sm); }
.btn--lg { min-height: var(--control-lg); padding: var(--s-4) var(--s-6); font-size: var(--t-base); border-radius: var(--radius-lg); }
.btn--icon  { padding: 0; width: var(--control-md); height: var(--control-md); }
.btn--block { width: 100%; }

/* ---- SURFACES ---------------------------------------------------------- */
.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--s-5);
  box-shadow: var(--shadow-sm);
}
.card--flat { box-shadow: none; }
.panel { background: var(--color-surface-2); border-radius: var(--radius-md); padding: var(--s-4); }

/* ---- CHIPS ------------------------------------------------------------- */
.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--s-1);
  padding: var(--s-1) var(--s-3);
  border-radius: var(--radius-pill);
  background: var(--color-surface-2);
  color: var(--color-text-muted);
  font-size: var(--t-xs);
  font-weight: 600;
  white-space: nowrap;
}
.chip--reward  { background: var(--color-reward-soft);  color: var(--color-reward-fg); }
.chip--success { background: var(--color-success-soft); color: var(--color-success-fg); }
.chip--danger  { background: var(--color-danger-soft);  color: var(--color-danger-fg); }
.chip--info    { background: var(--color-info-soft);    color: var(--color-info-fg); }

/* ---- INPUTS ------------------------------------------------------------ */
.input, .select, .textarea {
  width: 100%;
  min-height: var(--control-md);
  padding: var(--s-3) var(--s-4);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  color: var(--color-text);
  font-family: inherit;
  font-size: var(--t-base);
}
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--color-border-focus);
  box-shadow: var(--ring-focus);
}
.label { display: block; font-size: var(--t-sm); font-weight: 600; margin-bottom: var(--s-2); }

/* ---- PROGRESS ---------------------------------------------------------- */
.progress { height: 10px; border-radius: var(--radius-pill); background: var(--ink-100); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--color-primary); border-radius: inherit; transition: width var(--motion-base) var(--motion-ease); }

.steps { display: flex; gap: var(--s-2); }
.steps > i { flex: 1; height: 6px; border-radius: var(--radius-pill); background: var(--ink-100); }
.steps > i.is-done    { background: var(--color-primary); }
.steps > i.is-current { background: var(--sun-400); }

/* ---- ACTIVITY PRIMITIVES — what every game here shares ----------------- */
.hud {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--s-4); flex-wrap: wrap;
  padding: var(--s-3) var(--s-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
}
.hud__score { font-family: var(--font-mono); font-size: var(--t-lg); font-weight: 700; font-variant-numeric: tabular-nums; }

.lives { display: inline-flex; gap: var(--s-1); }
.lives > i { width: 10px; height: 10px; border-radius: var(--radius-pill); background: var(--color-primary); }
.lives > i.is-spent { background: var(--ink-200); }

/* Draggable token and its target, sized for a finger per the tablet rule. */
.token {
  display: inline-flex; align-items: center; gap: var(--s-2);
  min-height: var(--control-md);
  padding: var(--s-2) var(--s-4);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  border: 1px solid var(--color-border-strong);
  box-shadow: var(--shadow-xs);
  cursor: grab;
  touch-action: none;
  user-select: none;
  font-weight: 600;
}
.token:active { cursor: grabbing; }
.token.is-dragging { opacity: .5; }

.dropzone {
  min-height: var(--control-lg);
  padding: var(--s-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius-md);
  background: var(--color-surface-2);
  transition: border-color var(--motion-fast) var(--motion-ease), background var(--motion-fast) var(--motion-ease);
}
.dropzone.is-over { border-color: var(--color-primary); background: var(--color-primary-soft); }

/* Verdict — colour is never the only signal; pair it with a mark or a word. */
.is-correct { border-color: var(--color-success) !important; background: var(--color-success-soft) !important; }
.is-wrong   { border-color: var(--color-danger)  !important; background: var(--color-danger-soft)  !important; }

.feedback { display: flex; gap: var(--s-3); padding: var(--s-4); border-radius: var(--radius-md); font-weight: 600; }
.feedback--ok   { background: var(--color-success-soft); color: var(--color-success-fg); }
.feedback--no   { background: var(--color-danger-soft);  color: var(--color-danger-fg); }
.feedback--hint { background: var(--color-info-soft);    color: var(--color-info-fg); font-weight: 500; }

/* ---- OPTION — the tap target for any multiple-choice answer ------------ */
.option {
  display: flex; align-items: center; gap: var(--s-3);
  width: 100%;
  min-height: 64px;                 /* the tablet rule, written down */
  padding: var(--s-3) var(--s-4);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  color: var(--color-text);
  font: inherit;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  transition: border-color var(--motion-fast) var(--motion-ease), background var(--motion-fast) var(--motion-ease);
}
.option:hover:not(:disabled) { border-color: var(--color-border-focus); }
.option:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }
.option.is-selected { border-color: var(--color-primary); background: var(--color-primary-soft); }
.option:disabled { cursor: default; }

/* ---- MODAL ------------------------------------------------------------- */
.scrim {
  position: fixed; inset: 0; z-index: 50;
  display: grid; place-items: center;
  padding: var(--s-4);
  background: rgba(13, 21, 13, .45);
}
.modal {
  width: min(480px, 100%);
  background: var(--color-surface);
  border-radius: var(--radius-xl);
  padding: var(--s-6);
  box-shadow: var(--shadow-lg);
  text-align: center;
}

/* ---- LANGUAGE SWITCH — two languages, English first -------------------- */
.langs { display: inline-flex; gap: var(--s-1); padding: var(--s-1); background: var(--color-surface-2); border-radius: var(--radius-pill); }
.langs button {
  min-height: var(--control-sm);
  padding: 0 var(--s-4);
  border: 0; border-radius: var(--radius-pill);
  background: transparent;
  color: var(--color-text-muted);
  font: inherit; font-size: var(--t-xs); font-weight: 700;
  cursor: pointer;
}
.langs button[aria-pressed="true"] { background: var(--color-surface); color: var(--color-text); box-shadow: var(--shadow-xs); }
.langs button:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }

/* ---- A11Y -------------------------------------------------------------- */
.visually-hidden {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    transition-duration: .001ms !important;
  }
  .btn:hover, .btn:active { transform: none; }
}

/* ---- NIGHT ------------------------------------------------------------- */
/* Not a dark mode. The spec is light-only and stays that way; this is a
   palette for pages whose subject is genuinely dark — the space scenes, where
   painting a starfield onto warm paper would fight the picture. Put
   data-night on <html> or on one section. Only the semantic aliases move; the
   ramps and every component below them are untouched, so a button keeps the
   same physics and a card keeps the same radius. */
[data-night] {
  --color-bg:            #070d12;
  --color-surface:       #0e1720;
  --color-surface-2:     #16222e;

  --color-text:          #eef4f1;
  --color-text-muted:    #b3c2c9;
  --color-text-subtle:   #7f929c;
  --color-text-inverse:  #070d12;

  --color-border:        #23323f;
  --color-border-strong: #35485a;
  --color-border-focus:  var(--green-300);

  --color-primary:       var(--green-400);
  --color-primary-hover: var(--green-300);
  --color-primary-soft:  #14342a;
  --color-primary-fg:    #041109;

  --color-reward:      var(--sun-300);
  --color-reward-soft: #3a3111;
  --color-reward-fg:   var(--sun-300);

  --color-success:      var(--green-300);
  --color-success-soft: #12301f;
  --color-success-fg:   var(--green-300);

  --color-danger:      var(--clay-300);
  --color-danger-soft: #3a1d13;
  --color-danger-fg:   var(--clay-300);

  --color-info:      var(--lagoon-400);
  --color-info-soft: #0d2b33;
  --color-info-fg:   var(--lagoon-200);

  --ring-focus: 0 0 0 4px #14342a;
}

/* The pop shadow needs a colour that reads against a dark ground. */
[data-night] .btn { --pop: #041109; }

/* These two variants name ramp colours directly rather than semantic aliases,
   so the night palette cannot reach them: a ghost button would be near-black
   ink on a near-black page, and a secondary button would flash a white panel
   under white text on hover. */
[data-night] .btn--ghost { color: var(--color-text-muted); }
[data-night] .btn--ghost:hover:not(:disabled) { background: rgba(255, 255, 255, .08); }
[data-night] .btn--secondary { --pop: #23323f; }
[data-night] .btn--secondary:hover:not(:disabled) { background: var(--color-surface-2); }

/* ---- SHORT SCREENS ------------------------------------------------------ */
/* A 1366x768 laptop leaves roughly 660px once the browser has taken its share,
   and every activity here is meant to land whole on one screen. Below 760px of
   viewport the heading block and the card padding give up some of their air so
   the working part stays above the fold. Nothing moves, nothing hides — the
   same layout, breathing a little less. */
@media (max-height: 760px) {
  :root { --page-top: 12px; --page-bottom: 14px; --page-pad: 26px; }
  h1 { font-size: var(--t-xl); }
  h2 { font-size: var(--t-lg); }
  .lede { font-size: var(--t-sm); }
  .stack { gap: var(--s-3); }
  .stack--loose { gap: var(--s-3); }
  .stack--tight { gap: var(--s-1); }
  .card { padding: var(--s-4); }
  .hud { padding: var(--s-2) var(--s-3); }
  body { padding-bottom: var(--s-4); }
}

/* A netbook, a projector, a browser with three toolbars open. Same layout
   again, one notch tighter. */
@media (max-height: 700px) {
  :root { --page-top: 10px; --page-bottom: 10px; --page-pad: 20px; }
  h1 { font-size: var(--t-lg); }
  h2 { font-size: var(--t-md); }
  .lede { font-size: var(--t-xs); }
  .card { padding: var(--s-3); }
  .stack, .stack--loose { gap: var(--s-2); }
  .hud { padding: var(--s-1) var(--s-3); }
}
</style>
<!-- grasslms:end -->
<style>
  /* One screen on open. The page is a column the height of the viewport and
     the stage takes whatever the fixed rows leave over. */
  body { padding: var(--page-top) 0 var(--page-bottom); }
  .wrap { height: calc(100svh - var(--page-pad)); }
  h1 { font-size: clamp(var(--t-xl), 3.2vw, var(--t-2xl)); }
  .lede { font-size: var(--t-sm); max-width: 74ch; }
  .stack--loose { gap: var(--s-4); }

  .stage {
    position: relative;
    flex: 1 1 0; min-height: 320px;
    border: 2px solid var(--color-border-strong); border-radius: var(--radius-xl);
    background: radial-gradient(120% 95% at 50% 12%, var(--green-900) 0%, var(--ink-900) 72%);
    overflow: hidden;
  }
  .stage canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  .stage canvas.is-dragging { cursor: grabbing; }
  .stage canvas.is-over { cursor: pointer; }

  /* Name tags that follow the buildings around as the island turns. */
  .tag {
    position: absolute; left: 0; top: 0; z-index: 5;
    display: inline-flex; align-items: center; gap: var(--s-2);
    padding: 3px var(--s-3) 3px 3px; border-radius: var(--radius-pill);
    background: rgba(13, 21, 13, .8); border: 1px solid rgba(255, 255, 255, .16);
    color: var(--ink-50); font: 600 var(--t-2xs)/1.2 var(--font-sans);
    white-space: nowrap; cursor: pointer; transform: translate(-50%, -100%);
  }
  .tag:hover { border-color: var(--sun-400); }
  .tag__id {
    display: grid; place-items: center; width: 22px; height: 22px; border-radius: var(--radius-pill);
    background: var(--ink-500); color: #fff; font-family: var(--font-mono);
  }
  .tag svg { width: 12px; height: 12px; }
  .tag.is-open .tag__id { background: var(--clay-500); }
  .tag.is-clear .tag__id { background: var(--green-500); }
  .tag.is-locked { color: var(--ink-300); }

  .stage__views { position: absolute; right: var(--s-3); top: var(--s-3); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--s-1); z-index: 6; }
  .stage__views button {
    min-height: 36px; padding: 0 var(--s-3);
    border-radius: var(--radius-pill); border: 1px solid rgba(255, 255, 255, .16);
    background: rgba(13, 21, 13, .8); color: var(--ink-50);
    font: inherit; font-size: var(--t-2xs); cursor: pointer;
  }
  .stage__views button:hover { border-color: var(--sun-400); }
  .stage__hint {
    position: absolute; right: var(--s-3); bottom: var(--s-3); z-index: 6;
    padding: var(--s-2) var(--s-3); border-radius: var(--radius-pill);
    background: rgba(13, 21, 13, .8); font-size: var(--t-2xs); color: var(--ink-200);
    pointer-events: none;
  }

  /* The speech box. A light card on purpose, night mode or not: it is the
     one thing on the stage that has to be read. */
  .say {
    position: absolute; left: var(--s-3); right: var(--s-3); bottom: var(--s-3); z-index: 20;
    max-width: 580px; display: grid; grid-template-columns: 76px 1fr; gap: var(--s-3); align-items: end;
    padding: var(--s-3) var(--s-4); border-radius: var(--radius-lg);
    background: var(--paper-2); color: var(--ink-900); box-shadow: var(--shadow-lg);
  }
  .say__face svg { display: block; width: 76px; height: 76px; margin-top: -30px; }
  .say__who { font: 700 var(--t-2xs)/1 var(--font-mono); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--green-600); }
  .say--virus .say__who { color: var(--clay-600); }
  .say__text { margin: var(--s-1) 0 var(--s-2); font-size: var(--t-md); line-height: 1.45; }
  .say .btn--ghost { color: var(--ink-700); background: transparent; border-color: var(--ink-200); }

  /* Building and mini-event panel: a side card on a wide screen. */
  .panel { position: absolute; top: var(--s-3); right: var(--s-3); bottom: var(--s-3); z-index: 15; width: min(370px, 48%); overflow: auto; }
  .panel h2 { margin: 0; }

  .tasks { display: grid; gap: var(--s-2); }
  .tasklink {
    display: grid; grid-template-columns: auto 1fr auto; gap: var(--s-2); align-items: center;
    padding: var(--s-2) var(--s-3); min-height: var(--control-md);
    border: 1px solid var(--color-border); border-radius: var(--radius-md);
    background: var(--color-surface-2); color: var(--color-text); text-decoration: none; font-size: var(--t-sm);
  }
  a.tasklink:hover { border-color: var(--color-primary); }

  .tasklink.is-done .tasklink__state { color: var(--color-success-fg); }
  .tasklink.is-locked { opacity: .55; }
  .locknote { font-size: var(--t-sm); font-weight: 600; color: var(--color-reward-fg); }

  .legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--s-2); }
  .lg {
    display: grid; grid-template-columns: auto 1fr auto; gap: var(--s-2); align-items: center;
    padding: var(--s-2) var(--s-3); min-height: var(--control-md);
    border: 1px solid var(--color-border); border-radius: var(--radius-md);
    background: var(--color-surface); font: inherit; font-size: var(--t-sm); text-align: left;
    cursor: pointer; color: inherit; width: 100%;
  }
  .lg:hover { border-color: var(--color-border-strong); }
  .lg__dot { width: 12px; height: 12px; border-radius: var(--radius-pill); background: var(--ink-400); }
  .lg.is-open .lg__dot { background: var(--clay-500); }
  .lg.is-clear .lg__dot { background: var(--green-500); }
  .lg__state { font-family: var(--font-mono); font-size: var(--t-2xs); color: var(--color-text-subtle); }
  .lg.is-clear .lg__state { color: var(--color-success-fg); }

  .fallback { display: grid; place-items: center; gap: var(--s-3); height: 100%; padding: var(--s-6); text-align: center; color: var(--ink-200); font-size: var(--t-sm); }
  .fallback svg { width: min(420px, 100%); height: auto; }

  /* ---- mini-events: wires and lever. Optional, they clear nothing. ---- */
  .job { display: grid; gap: var(--s-3); }
  .wires { position: relative; display: grid; grid-template-columns: auto 1fr auto; gap: var(--s-6); align-items: stretch; min-height: 180px; }
  .wires__col { display: grid; gap: var(--s-3); align-content: space-between; }
  .plug {
    position: relative; width: 48px; height: 32px; border: 2px solid var(--ink-900); border-radius: 5px;
    padding: 0; cursor: grab; touch-action: none; font: 700 19px/1 var(--font-sans);
  }
  .plug::after { content: attr(data-shape); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.45); }
  .plug.is-done { cursor: default; box-shadow: inset 0 0 0 3px #fff; }
  .wires svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .lever { position: relative; height: 190px; width: 92px; margin: 0 auto; touch-action: none; }
  .lever__track {
    position: absolute; left: 50%; top: 0; bottom: 0; width: 26px; margin-left: -13px;
    border-radius: var(--radius-pill); background: var(--color-surface-2); border: 2px solid var(--color-border-strong);
  }
  .lever__fill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: var(--radius-pill); background: var(--color-primary-soft); }
  .lever__grip {
    position: absolute; left: 50%; width: 76px; height: 34px; margin-left: -38px;
    border-radius: var(--radius-sm); border: 2px solid var(--ink-900);
    background: var(--sun-400); cursor: grab; touch-action: none; box-shadow: 0 4px 0 var(--sun-500);
  }
  .lever__grip::after { content: ""; position: absolute; inset: 6px 10px; border-radius: 2px; background: repeating-linear-gradient(var(--ink-900) 0 2px, transparent 2px 6px); opacity: .35; }

  .back { display: inline-flex; align-items: center; gap: var(--s-2); align-self: flex-start;
    font-family: var(--font-mono); font-size: var(--t-2xs); font-weight: 500; text-transform: uppercase;
    letter-spacing: var(--tracking-eyebrow); color: var(--color-text-subtle); text-decoration: none; }
  .back:hover { color: var(--color-text); }
  .back svg { width: 13px; height: 13px; flex: 0 0 13px; }

  /* A phone: the page scrolls, the panel becomes a sheet from the bottom and
     the speech box sits above everything. */
  @media (max-width: 700px) {
    .wrap { height: auto; }
    .stage { flex: none; height: 64svh; min-height: 340px; }
    .stage__hint { display: none; }
    .tag { padding-right: 3px; }
    .tag__name { display: none; }   /* the letter is enough; the list below has the names */
    .panel { position: fixed; top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 72svh; z-index: 50;
             border-radius: var(--radius-xl) var(--radius-xl) 0 0; }
    .say { position: fixed; left: var(--s-2); right: var(--s-2); bottom: var(--s-2); z-index: 60; grid-template-columns: 56px 1fr; }
    .say__face svg { width: 56px; height: 56px; margin-top: -24px; }
    .say__text { font-size: var(--t-base); }
  }

  [hidden] { display: none !important; }
</style>

      Object.keys(d).forEach(function (k) { if (k.indexOf("map-") === 0) delete d[k]; });

  /* ---- the wires, now the pad-lights mini-event ----------------------- */
  function jobWires(host, won) {

  /* ---- the lever, now the engine-test mini-event ---------------------- */
  function jobLever(host, won) {

    var box = el("div", "lever");

    grip.setAttribute("aria-valuemax", "100");

    var y = TOP, dragging = false, held = 0, keyDown = false, finished = false, last = 0;

    function place() {
      grip.style.top = y + "px";

    grip.addEventListener("pointerdown", function (e) { e.preventDefault(); dragging = true; grip.setPointerCapture(e.pointerId); });
    grip.addEventListener("pointermove", function (e) {

    grip.addEventListener("pointercancel", function () { dragging = false; });
    grip.addEventListener("keydown", function (e) { if (e.key === "ArrowDown") { e.preventDefault(); keyDown = true; } });
    grip.addEventListener("keyup", function (e) { if (e.key === "ArrowDown") keyDown = false; });

      if (finished) return;

      if (!last) last = now;
      var dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (keyDown) { y = Math.min(BOT, y + dt * 220); place(); }
      /* Let go and the spring takes it back, so the lever has to be held. */

    } catch (err) { return false; }
    if (!renderer.getContext()) return false;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(34, 16 / 10, 0.1, 300);

    var ramp = new THREE.DataTexture(new Uint8Array([95, 175, 255]), 3, 1, THREE.LuminanceFormat);
    ramp.minFilter = ramp.magFilter = THREE.NearestFilter;
    ramp.needsUpdate = true;
    var INK = new THREE.MeshBasicMaterial({ color: C.ink, side: THREE.BackSide });
    var tinted = [], pickables = [];

    /* Every visible piece is a toon mesh with a slightly larger inked copy
       behind it, which is where the outline comes from. Pieces that belong
       to a sector are remembered so they can be greyed while it is locked. */
    function part(geo, color, x, y, z, parent, sector) {
      var mat = new THREE.MeshToonMaterial({ color: color, gradientMap: ramp });
      var m = new THREE.Mesh(geo, mat);
      m.position.set(x || 0, y || 0, z || 0);
      var hull = new THREE.Mesh(geo, INK);
      hull.scale.setScalar(1.05);
      m.add(hull);
      (parent || scene).add(m);
      if (sector) tinted.push({ sector: sector, mat: mat, base: new THREE.Color(color) });
      return m;
    }
    /* One plain invisible box per clickable thing, rather than every mesh. */
    function hitBox(w, h, d, y, parent, pickData) {
      var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial({ visible: false }));
      m.position.y = y;
      m.userData.pick = pickData;
      parent.add(m);
      pickables.push(m);
      return m;
    }

    scene.add(new THREE.HemisphereLight(0xfffbe5, 0x0a3d24, 0.7));
    var sun = new THREE.DirectionalLight(0xffffff, 0.75);
    sun.position.set(7, 14, 6);
    scene.add(sun);

    /* The island: a grass top, rock layers underneath, a few loose rocks. */
    part(new THREE.CylinderGeometry(8.6, 8.2, 0.8, 14), C.green300, 0, -0.4, 0);
    part(new THREE.CylinderGeometry(8.1, 5.4, 1.8, 11), C.ink400, 0, -1.7, 0);
    part(new THREE.ConeGeometry(5.2, 4.6, 9), C.ink500, 0, -4.9, 0).rotation.x = Math.PI;
    var floaters = [];
    [[-10, -2, 3], [9.5, -3, -4], [3, -2.5, 10.5], [-6, -3.5, -9.5]].forEach(function (p, i) {
      var r = part(new THREE.DodecahedronGeometry(0.6 + (i % 2) * 0.35, 0), i % 2 ? C.ink400 : C.ink500, p[0], p[1], p[2]);
      r.userData.base = p[1];
      floaters.push(r);
    });

    /* The pad, its six lamps and the generator box that powers them. */
    part(new THREE.CylinderGeometry(2.5, 2.5, 0.14, 32), C.ink200, 0, 0.07, 0);
    part(new THREE.CylinderGeometry(1.7, 1.7, 0.16, 32), C.ink100, 0, 0.09, 0);
    var bulbs = [];
    for (var lb = 0; lb < 6; lb++) {
      var la = lb / 6 * Math.PI * 2 + 0.26;
      part(new THREE.CylinderGeometry(0.06, 0.06, 0.6, 6), C.ink500, Math.cos(la) * 2.75, 0.3, Math.sin(la) * 2.75);
      var bulb = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), new THREE.MeshBasicMaterial({ color: C.ink500 }));
      bulb.position.set(Math.cos(la) * 2.75, 0.68, Math.sin(la) * 2.75);
      scene.add(bulb);
      bulbs.push(bulb);
    }
    var gen = new THREE.Group();
    gen.position.set(1.2, 0, 3.6);
    scene.add(gen);
    part(new THREE.BoxGeometry(0.9, 0.7, 0.6), C.ink500, 0, 0.35, 0, gen);
    part(new THREE.BoxGeometry(0.92, 0.14, 0.62), C.sun400, 0, 0.5, 0, gen);
    hitBox(1.4, 1.4, 1.2, 0.5, gen, { type: "wires" });

    /* Path stones from the pad to each building. */
    ORDER.forEach(function (id) {
      var p = PLACES[id];
      for (var k = 1; k <= 3; k++) {
        var f = 0.36 + k * 0.12;
        part(new THREE.CylinderGeometry(0.28, 0.3, 0.06, 7), C.ink100, p[0] * f, 0.03, p[1] * f);
      }
    });

    /* Low-poly trees round the edge. */
    [[-7, 0.2], [-6.4, -5.6], [-1.2, -7.4], [1.8, -7.2], [7.2, 0], [6.6, -6], [-1.5, 7.3], [2.6, 7.1], [-7.3, 5.6], [7.4, 6.2]].forEach(function (p, i) {
      var s = 0.8 + (i % 3) * 0.22;
      part(new THREE.CylinderGeometry(0.1, 0.13, 0.5, 6), C.ink500, p[0], 0.25, p[1]);
      part(new THREE.ConeGeometry(0.55 * s, 1.3 * s, 7), i % 2 ? C.green500 : C.green400, p[0], 0.5 + 0.65 * s, p[1]);
    });

    /* Stars on a dome around everything. */
    var starPos = [];
    for (var s = 0; s < 700; s++) {
      var rad = 80 + Math.random() * 30, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
      starPos.push(rad * Math.sin(ph) * Math.cos(th), rad * Math.cos(ph), rad * Math.sin(ph) * Math.sin(th));
    }
    var starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute("position", new THREE.Float32BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: C.sun100, size: 0.35 })));

    /* Buildings, each with its pulsing ring and its cloud of virus copies. */
    var built = {};
    var makers = { A: makeArchive, B: makeStation, C: makeTower, D: makeCommand };
    ORDER.forEach(function (id) {
      var g = new THREE.Group();
      var p = PLACES[id];
      g.position.set(p[0], 0, p[1]);
      g.rotation.y = Math.atan2(-p[0], -p[1]);   /* front faces the pad */
      scene.add(g);
      var model = new THREE.Group();
      g.add(model);
      var anim = makers[id](model, part, id);

      var ring = new THREE.Mesh(new THREE.RingGeometry(2.1, 2.45, 40), new THREE.MeshBasicMaterial({ color: C.sun400, transparent: true, opacity: 0.8 }));
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.05;
      g.add(ring);

      var bugs = new THREE.Group();
      bugs.position.y = 3.6;
      g.add(bugs);
      for (var v = 0; v < 4; v++) bugs.add(makeBug(part, pickables, v));

      hitBox(3, 4.4, 2.8, 2.2, g, { type: "sector", id: id });
      built[id] = { group: g, model: model, anim: anim, ring: ring, bugs: bugs };
    });

    /* The cage beside the command centre. It only shows while Andy is held. */
    var cage = new THREE.Group();
    cage.position.set(PLACES.D[0] - 1.6, 0, PLACES.D[1] + 2.1);   /* to one side, so the building never hides it */
    scene.add(cage);
    part(new THREE.CylinderGeometry(1, 1, 0.12, 16), C.ink500, 0, 0.06, 0, cage);
    for (var cb = 0; cb < 10; cb++) {
      var ca = cb / 10 * Math.PI * 2;
      part(new THREE.CylinderGeometry(0.05, 0.05, 2.1, 6), C.ink300, Math.cos(ca) * 0.95, 1.1, Math.sin(ca) * 0.95, cage);
    }
    part(new THREE.CylinderGeometry(1.05, 1.05, 0.14, 16), C.clay500, 0, 2.2, 0, cage);
    cage.visible = false;

    /* The rocket on its pad. */
    var rocket = new THREE.Group();
    scene.add(rocket);
    part(new THREE.CylinderGeometry(0.62, 0.72, 2.8, 20), C.paper, 0, 1.6, 0, rocket);
    part(new THREE.ConeGeometry(0.62, 1.2, 20), C.clay500, 0, 3.6, 0, rocket);
    part(new THREE.CylinderGeometry(0.25, 0.25, 0.08, 16), C.lagoon400, 0, 2.3, 0.66, rocket).rotation.x = Math.PI / 2;
    part(new THREE.CylinderGeometry(0.73, 0.73, 0.2, 20), C.clay500, 0, 1.0, 0, rocket);
    for (var f = 0; f < 3; f++) {
      var fin = part(new THREE.BoxGeometry(0.09, 0.9, 0.7), C.clay500, 0, 0, 0, rocket);
      fin.position.set(Math.cos(f * 2.094) * 0.7, 0.55, Math.sin(f * 2.094) * 0.7);
      fin.rotation.y = -f * 2.094;
    }
    var flame = part(new THREE.ConeGeometry(0.4, 1.1, 10), C.sun400, 0, -0.35, 0, rocket);
    flame.rotation.x = Math.PI;
    flame.visible = false;
    hitBox(1.8, 4.6, 1.8, 2, rocket, { type: "lever" });

    var andy = makeAndy(part);
    scene.add(andy.group);
    hitBox(1.6, 2.3, 1.6, 1, andy.group, { type: "andy" });

    var orbit = { angle: VIEWS.orbit.angle, height: VIEWS.orbit.height, dist: VIEWS.orbit.dist };
    S = {
      ready: true, renderer: renderer, scene: scene, camera: camera, pickables: pickables,
      built: built, tinted: tinted, bulbs: bulbs, cage: cage, rocket: rocket, flame: flame, andy: andy,
      floaters: floaters, smoke: [], sparks: [], padLit: false,
      rocketMode: null, rocketT: 0,
      raycaster: new THREE.Raycaster(), pointer: new THREE.Vector2(-2, -2),
      cam: { angle: orbit.angle, height: orbit.height, dist: orbit.dist, look: new THREE.Vector3(0, -0.4, 0) },
      goal: { angle: orbit.angle, height: orbit.height, dist: orbit.dist, look: new THREE.Vector3(0, -0.4, 0) },
      dragging: false, moved: 0, lastX: 0, lastY: 0, hover: null, time: 0
    };

    placeTags();
    resize();
    window.addEventListener("resize", resize);
    bindPointer(canvas);
    requestAnimationFrame(animate);
    return true;
  }

  /* ---- building models. Each is made of what its sector does. ---------- */
  function makeArchive(g, part, id) {
    part(new THREE.BoxGeometry(2.8, 1.9, 2.2), C.green400, 0, 0.95, 0, g, id);
    part(new THREE.BoxGeometry(3.1, 0.3, 2.5), C.green700, 0, 2.05, 0, g, id);
    part(new THREE.BoxGeometry(1.1, 0.3, 2.5), C.green700, -0.8, 2.35, 0, g, id);
    var drawers = [];
    for (var r = 0; r < 3; r++) for (var c = 0; c < 2; c++) {
      var dr = part(new THREE.BoxGeometry(1.05, 0.42, 0.3), C.green50, c ? 0.6 : -0.6, 0.4 + r * 0.52, 1.1, g, id);
      part(new THREE.BoxGeometry(0.34, 0.07, 0.08), C.ink500, 0, 0, 0.17, dr);
      drawers.push(dr);
    }
    return function (time, clear) {
      drawers.forEach(function (dr, i) {
        dr.position.z = 1.1 + (clear ? Math.max(0, Math.sin(time * 1.4 + i * 1.3)) * 0.35 : 0);
      });
    };
  }

  function makeStation(g, part, id) {
    part(new THREE.CylinderGeometry(1.5, 1.6, 1.2, 10), C.sun400, 0, 0.6, 0, g, id);
    part(new THREE.SphereGeometry(1.35, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2), C.sun100, 0, 1.2, 0, g, id);
    var screen = part(new THREE.BoxGeometry(2, 1.15, 0.14), C.ink700, 0, 1.4, 1.35, g, id);
    screen.rotation.x = -0.25;
    var lamps = [C.clay500, C.sun500, C.green500, C.lagoon600].map(function (col, i) {
      return part(new THREE.BoxGeometry(0.34, 0.34, 0.1), col, -0.63 + i * 0.42, 0, 0.09, screen, id);
    });
    return function (time, clear) {
      lamps.forEach(function (l, i) {
        l.position.y = clear ? Math.max(0, Math.sin(time * 3 - i * 0.8)) * 0.18 : 0;
      });
    };
  }

  function makeTower(g, part, id) {
    part(new THREE.CylinderGeometry(0.75, 0.95, 3.6, 10), C.lagoon400, 0, 1.8, 0, g, id);
    part(new THREE.CylinderGeometry(1, 1, 0.3, 10), C.lagoon600, 0, 3.7, 0, g, id);
    part(new THREE.CylinderGeometry(0.05, 0.05, 0.9, 6), C.ink300, 0, 4.3, 0, g);
    part(new THREE.SphereGeometry(0.16, 10, 8), C.clay500, 0, 4.8, 0, g);
    var ring = new THREE.Group();
    ring.position.y = 2.3;
    g.add(ring);
    for (var i = 0; i < 10; i++) {
      var a = i / 10 * Math.PI * 2;
      var tile = part(new THREE.BoxGeometry(0.34, 0.44, 0.08), i % 3 ? C.paper : C.sun300, Math.cos(a) * 1.25, 0, Math.sin(a) * 1.25, ring, id);
      tile.rotation.y = -a + Math.PI / 2;
    }
    return function (time, clear) {
      /* Smooth while it works, a stuck stutter while the virus has it. */
      ring.rotation.y = clear ? time * 0.6 : Math.floor(time * 1.5) * 0.4;
    };
  }

  function makeCommand(g, part, id) {
    part(new THREE.CylinderGeometry(1.5, 1.7, 1.6, 8), C.clay300, 0, 0.8, 0, g, id);
    part(new THREE.CylinderGeometry(1.1, 1.5, 0.5, 8), C.clay100, 0, 1.85, 0, g, id);
    for (var w = 0; w < 8; w++) {
      var a = w / 8 * Math.PI * 2;
      part(new THREE.BoxGeometry(0.28, 0.4, 0.06), C.sun300, Math.cos(a) * 1.62, 0.95, Math.sin(a) * 1.62, g, id).rotation.y = -a + Math.PI / 2;
    }
    var dish = new THREE.Group();
    dish.position.y = 2.3;
    g.add(dish);
    part(new THREE.CylinderGeometry(0.12, 0.12, 0.8, 8), C.ink300, 0, 0.3, 0, dish);
    var bowl = part(new THREE.SphereGeometry(0.85, 20, 10, 0, Math.PI * 2, 0, Math.PI / 2.4), C.paper, 0, 0.85, 0.1, dish, id);
    bowl.rotation.x = -0.9;
    return function (time, clear) {
      dish.rotation.y = clear ? time * 0.7 : Math.sin(time * 4) * 0.25;
    };
  }

  function makeBug(part, pickables, v) {
    var g = new THREE.Group();
    var body = part(new THREE.IcosahedronGeometry(0.3, 0), C.clay500, 0, 0, 0, g);
    [-0.11, 0.11].forEach(function (x) {
      var eye = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      eye.position.set(x, 0.05, 0.26);
      var pupil = new THREE.Mesh(new THREE.SphereGeometry(0.04, 6, 4), new THREE.MeshBasicMaterial({ color: C.ink }));
      pupil.position.z = 0.06;
      eye.add(pupil);
      g.add(eye);
    });
    g.userData = { seed: v * 1.6, popped: 0 };
    body.userData.pick = { type: "bug", bug: g };
    pickables.push(body);
    return g;
  }

  function makeAndy(part) {
    var g = new THREE.Group();
    var inner = new THREE.Group();
    g.add(inner);
    part(new THREE.BoxGeometry(1.3, 0.32, 1.1), C.ink500, 0, 0.16, 0, inner);
    part(new THREE.BoxGeometry(1, 0.9, 0.9), C.sun400, 0, 0.77, 0, inner);
    part(new THREE.BoxGeometry(0.6, 0.3, 0.05), C.sun500, 0, 0.8, 0.47, inner);
    part(new THREE.CylinderGeometry(0.06, 0.06, 0.4, 8), C.ink400, 0, 1.38, 0, inner);
    var head = new THREE.Group();
    head.position.y = 1.62;
    inner.add(head);
    var pupils = [];
    [-0.24, 0.24].forEach(function (x) {
      part(new THREE.BoxGeometry(0.4, 0.36, 0.4), C.ink100, x, 0, 0, head);
      part(new THREE.CylinderGeometry(0.14, 0.14, 0.06, 16), C.lagoon200, x, 0, 0.21, head).rotation.x = Math.PI / 2;
      var pupil = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.02, 12), new THREE.MeshBasicMaterial({ color: C.ink }));
      pupil.rotation.x = Math.PI / 2;
      pupil.position.set(x, 0, 0.25);
      head.add(pupil);
      pupils.push(pupil);
    });
    g.position.set(-2.6, 0, 1.4);
    return { group: g, inner: inner, head: head, pupils: pupils, mode: "free", target: new THREE.Vector3(-2.6, 0, 1.4), wait: 2, spin: 0, wiggle: 0, carry: 0, from: new THREE.Vector3() };
  }

  /* ---- what the story does to the island --------------------------------- */
  var SPARK_HUE = { A: C.green300, B: C.sun400, C: C.lagoon400, D: C.clay300 };
  function burst(id) {
    if (!S.ready || reduced) return;
    var b = S.built[id], pos = [], vel = [];
    for (var i = 0; i < 120; i++) {
      pos.push(0, 3.4, 0);
      vel.push((Math.random() - .5) * 0.24, Math.random() * 0.24 + 0.05, (Math.random() - .5) * 0.24);
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    var pts = new THREE.Points(geo, new THREE.PointsMaterial({ color: SPARK_HUE[id], size: 0.2, transparent: true }));
    b.group.add(pts);
    S.sparks.push({ points: pts, vel: vel, life: 0, group: b.group });
  }

  function carryAndy() {
    if (!S.ready) return;
    var a = S.andy;
    a.mode = "carry";
    a.carry = 0;
    a.from.copy(a.group.position);
    S.cage.visible = true;
    focusSector("D");
  }
  function freeAndy() {
    if (!S.ready) return;
    var a = S.andy;
    a.mode = "free";
    a.target.set(PLACES.D[0] * 0.45, 0, PLACES.D[1] * 0.45);
    a.wait = 5;
    S.cage.visible = false;
  }
  function wiggleAndy() { if (S.ready) S.andy.wiggle = 0.6; }
  function sendAndy(id) {
    if (!S.ready || S.andy.mode !== "free") return;
    var p = PLACES[id];
    S.andy.target.set(p[0] * 0.55, 0, p[1] * 0.55);
    S.andy.wait = 6;
  }

  function hop() {
    if (!S.ready || S.rocketMode) return;
    S.rocketMode = "hop"; S.rocketT = 0;
  }
  function launch() {
    if (!S.ready) return;
    S.rocketMode = "launch"; S.rocketT = 0;
    S.goal.height = 7; S.goal.dist = 30;
    S.goal.look.set(0, 5, 0);
  }
  function lightPad() {
    if (!S.ready) return;
    S.padLit = true;
  }

  function puff() {
    var m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.4, 1),
      new THREE.MeshToonMaterial({ color: C.paper, transparent: true, opacity: 0.9 }));
    var r = S.rocket.position;
    m.position.set(r.x + (Math.random() - .5) * 0.6, r.y + 0.1, r.z + (Math.random() - .5) * 0.6);
    S.scene.add(m);
    S.smoke.push({ mesh: m, life: 0, vx: (Math.random() - .5) * 0.04, vz: (Math.random() - .5) * 0.04 });
  }

  /* Puts the story state onto the scene. An animation in flight wins; the
     resting state is whatever the progress says. */
  function sync() {
    if (!S.ready) return;
    var grey = new THREE.Color(C.ink300);
    ORDER.forEach(function (id) {
      var st = state(id), b = S.built[id];
      b.ring.visible = st === "open";
      b.bugs.visible = st !== "clear";
      /* the whole swarm where the work is, one lookout on a locked building */
      b.bugs.children.forEach(function (bug, i) { bug.visible = st === "open" || i === 0; });
    });
    S.tinted.forEach(function (it) {
      it.mat.color.copy(it.base);
      if (state(it.sector) === "locked") it.mat.color.lerp(grey, 0.6);
    });
    var held = captured(), a = S.andy;
    if (held && a.mode === "free") {
      a.mode = "caged";
      a.group.position.copy(S.cage.position);
      a.group.rotation.y = 0;
    }
    if (!held && a.mode === "caged") freeAndy();
    S.cage.visible = held || a.mode === "carry";
    if (!S.padLit) S.bulbs.forEach(function (b) { b.material.color.setHex(C.ink500); });
  }

  /* ---- camera --------------------------------------------------------------- */
  var VIEWS = {
    orbit: { angle: 0.95, height: 13, dist: 25 },
    top: { angle: 0.95, height: 27, dist: 10 },
    low: { angle: 2.6, height: 4.2, dist: 19 }
  };
  function nearAngle(a) {
    var cur = S.cam.angle;
    while (a - cur > Math.PI) a -= Math.PI * 2;
    while (a - cur < -Math.PI) a += Math.PI * 2;
    return a;
  }
  function focusSector(id) {
    if (!S.ready) return;
    var p = PLACES[id];
    S.goal.angle = nearAngle(Math.atan2(p[1], p[0]));
    S.goal.look.set(p[0] * 0.45, 0.4, p[1] * 0.45);
    S.goal.dist = 20; S.goal.height = 10.5;
  }
  function focusPad() {
    if (!S.ready) return;
    S.goal.look.set(0, 0.8, 0);
    S.goal.dist = 18; S.goal.height = 9;
  }

  function placeCamera() {
    var c = S.cam, aspect = S.camera.aspect;
    /* A tall phone screen needs the camera further back to fit the island. */
    var fit = Math.min(2.1, aspect < 1.3 ? 1.3 / aspect : 1);
    S.camera.position.set(c.look.x + Math.cos(c.angle) * c.dist * fit, c.height * Math.min(fit, 1.6), c.look.z + Math.sin(c.angle) * c.dist * fit);
    S.camera.lookAt(c.look);
  }

  function resize() {
    if (!S.ready) return;
    var stage = byId("stage"), w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    S.renderer.setSize(w, h, false);
    S.camera.aspect = w / h;
    S.camera.updateProjectionMatrix();
    placeCamera();
  }

  function bindPointer(canvas) {
    canvas.addEventListener("pointerdown", function (e) {
      S.dragging = true; S.moved = 0;
      S.lastX = e.clientX; S.lastY = e.clientY;
      setPointer(e);
      canvas.classList.add("is-dragging");
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    });
    canvas.addEventListener("pointermove", function (e) {
      setPointer(e);
      if (!S.dragging) return;
      var dx = e.clientX - S.lastX, dy = e.clientY - S.lastY;
      S.moved += Math.abs(dx) + Math.abs(dy);
      S.lastX = e.clientX; S.lastY = e.clientY;
      if (S.moved < 6) return;
      S.goal.angle = S.cam.angle = S.cam.angle - dx * 0.006;
      S.goal.height = S.cam.height = Math.max(3, Math.min(30, S.cam.height + dy * 0.05));
    });
    function release() {
      canvas.classList.remove("is-dragging");
      /* a short press is a click, a long one was a drag */
      if (S.dragging && S.moved < 6) pickAt();
      S.dragging = false;
    }
    canvas.addEventListener("pointerup", release);
    canvas.addEventListener("pointercancel", function () { S.dragging = false; canvas.classList.remove("is-dragging"); });
    canvas.addEventListener("pointerleave", function () { if (!S.dragging) S.pointer.set(-2, -2); });
    canvas.addEventListener("wheel", function (e) {
      e.preventDefault();
      S.goal.dist = S.cam.dist = Math.max(11, Math.min(40, S.cam.dist + e.deltaY * 0.015));
    }, { passive: false });
  }
  function setPointer(e) {
    var r = byId("scene").getBoundingClientRect();
    S.pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    S.pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  }
  function hitTest() {
    S.raycaster.setFromCamera(S.pointer, S.camera);
    var hits = S.raycaster.intersectObjects(S.pickables, false);
    for (var i = 0; i < hits.length; i++) {
      var p = hits[i].object.userData.pick;
      if (p.type === "bug" && (!p.bug.parent.visible || !p.bug.visible || p.bug.userData.popped)) continue;
      if (p.type === "andy" && S.andy.mode === "carry") continue;
      return p;
    }
    return null;
  }

  var pops = 0;
  function pickAt() {
    var p = hitTest();
    if (!p) return;
    if (p.type === "sector") openPanel(p.id);
    else if (p.type === "lever" || p.type === "wires") openPanel(p.type);
    else if (p.type === "andy") {
      S.andy.spin = 1;
      speak(pick(S.andy.mode === "caged" ? "andyCaged" : "andyIdle"));
    } else if (p.type === "bug") {
      p.bug.userData.popped = 0.01;
      if (++pops % 3 === 1) speak(pick("virusPop"));
    }
  }

  /* ---- name tags -------------------------------------------------------- */
  var LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
  function placeTags() {
    var box = byId("tags");
    ORDER.forEach(function (id) {
      var b = el("button", "tag");
      b.type = "button";
      b.dataset.id = id;
      b.onclick = function () { openPanel(id); };
      box.appendChild(b);
    });
  }
  function paintTags() {
    var d = t();
    Array.prototype.forEach.call(byId("tags").children, function (b) {
      var id = b.dataset.id, st = state(id);
      b.className = "tag is-" + st;
      b.innerHTML = '<span class="tag__id">' + id + "</span>" + (st === "locked" ? LOCK : st === "clear" ? CHECK : "");
      b.appendChild(el("span", "tag__name", d.names[id][0]));
      b.setAttribute("aria-label", d.sector + " " + id + ", " + d.names[id][0] + ", " + d.states[st]);
    });
  }
  var tagPos = null;
  function moveTags() {
    if (!tagPos) tagPos = new THREE.Vector3();
    var stage = byId("stage"), w = stage.clientWidth, h = stage.clientHeight;
    Array.prototype.forEach.call(byId("tags").children, function (b) {
      var g = S.built[b.dataset.id].group;
      tagPos.set(g.position.x, 4.9, g.position.z).project(S.camera);
      b.style.visibility = tagPos.z > 1 ? "hidden" : "visible";
      b.style.left = ((tagPos.x + 1) / 2 * w).toFixed(1) + "px";
      b.style.top = ((1 - tagPos.y) / 2 * h).toFixed(1) + "px";
    });
  }

  /* ---- the loop ----------------------------------------------------------- */
  var lastFrame = 0;
  function animate(now) {
    requestAnimationFrame(animate);
    var dt = lastFrame ? Math.min(0.05, (now - lastFrame) / 1000) : 0.016;
    lastFrame = now;
    S.time += dt;
    var time = S.time;

    /* the camera eases towards its goal */
    var k = reduced ? 1 : 1 - Math.pow(0.03, dt);
    var c = S.cam, g = S.goal;
    c.angle += (g.angle - c.angle) * k;
    c.height += (g.height - c.height) * k;
    c.dist += (g.dist - c.dist) * k;
    c.look.lerp(g.look, k);
    placeCamera();

    ORDER.forEach(function (id, si) {
      var b = S.built[id];
      b.anim(time, isClearCache[id]);
      b.ring.material.opacity = 0.45 + Math.sin(time * 3) * 0.3;
      var lift = S.hover === id ? 0.25 : 0;
      b.model.position.y += (lift - b.model.position.y) * 0.15;
      if (!b.bugs.visible) return;
      b.bugs.children.forEach(function (bug) {
        var u = bug.userData;
        if (u.popped) {
          /* shrinks away, then sneaks back a few seconds later */
          u.popped += dt;
          bug.scale.setScalar(Math.max(0, 1 - u.popped * 4));
          if (u.popped > 7) { u.popped = 0; bug.scale.setScalar(1); }
          return;
        }
        var a = time * 0.8 + u.seed + si;
        bug.position.set(Math.cos(a) * 1.7, Math.sin(a * 1.7) * 0.35, Math.sin(a) * 1.7);
        bug.lookAt(S.camera.position);
      });
    });

    S.floaters.forEach(function (r, i) {
      r.position.y = r.userData.base + Math.sin(time * 0.7 + i) * 0.3;
      r.rotation.y += dt * 0.2;
    });
    if (S.padLit) S.bulbs.forEach(function (b, i) { b.material.color.setHex(Math.sin(time * 4 - i) > -0.3 ? C.sun300 : C.sun500); });

    stepAndy(dt, time);
    stepRocket(dt);
    stepParticles(dt);

    if (!S.dragging) {
      var hit = hitTest();
      S.hover = hit && hit.type === "sector" ? hit.id : null;
      byId("scene").classList.toggle("is-over", !!hit);
    }

    moveTags();
    S.renderer.render(S.scene, S.camera);
  }

  function stepAndy(dt, time) {
    var a = S.andy, gp = a.group.position;
    if (a.mode === "carry") {
      /* lifted off, wriggling, and dropped into the cage */
      a.carry = Math.min(1, a.carry + dt / 2.6);
      gp.lerpVectors(a.from, S.cage.position, a.carry);
      gp.y = Math.sin(a.carry * Math.PI) * 3;
      a.inner.rotation.z = Math.sin(time * 12) * 0.25;
      if (a.carry >= 1) { a.mode = "caged"; a.inner.rotation.z = 0; a.group.rotation.y = 0; }
    } else if (a.mode === "caged") {
      a.head.rotation.x = 0.3;
    } else {
      a.head.rotation.x = 0;
      a.wait -= dt;
      if (a.wait <= 0 && !open) {
        /* Potter about near whichever building is waiting, or round the pad. */
        var cur = current(), base = cur ? PLACES[cur] : null;
        var ang = Math.random() * Math.PI * 2;
        if (base) a.target.set(base[0] * 0.5 + Math.cos(ang) * 0.8, 0, base[1] * 0.5 + Math.sin(ang) * 0.8);
        else a.target.set(Math.cos(ang) * 3.2, 0, Math.sin(ang) * 3.2);
        a.wait = 3 + Math.random() * 3;
      }
      var dx = a.target.x - gp.x, dz = a.target.z - gp.z, dist = Math.sqrt(dx * dx + dz * dz);
      if (dist > 0.05) {
        var step = Math.min(dist, dt * 2.2);
        gp.x += dx / dist * step; gp.z += dz / dist * step;
        var want = Math.atan2(dx, dz), cy = a.group.rotation.y;
        while (want - cy > Math.PI) want -= Math.PI * 2;
        while (want - cy < -Math.PI) want += Math.PI * 2;
        a.group.rotation.y = cy + (want - cy) * Math.min(1, dt * 6);
        a.inner.position.y = Math.abs(Math.sin(time * 14)) * 0.04;
      }
      gp.y += (0 - gp.y) * Math.min(1, dt * 6);
    }
    if (a.spin > 0) { a.spin = Math.max(0, a.spin - dt * 1.4); a.inner.rotation.y = (1 - a.spin) * Math.PI * 2; }
    if (a.wiggle > 0) { a.wiggle = Math.max(0, a.wiggle - dt); a.head.rotation.z = Math.sin(a.wiggle * 30) * 0.15; }
    var blink = (time % 4) < 0.12;
    a.pupils.forEach(function (p) { p.scale.z = blink ? 0.15 : 1; });
  }

  function stepRocket(dt) {
    var r = S.rocket;
    if (!S.rocketMode) { S.flame.visible = false; return; }
    S.rocketT += dt;
    var tt = S.rocketT;
    S.flame.visible = true;
    S.flame.scale.y = 0.8 + Math.random() * 0.6;
    if (Math.random() < 0.6) puff();
    if (S.rocketMode === "hop") {
      r.position.y = Math.sin(Math.min(1, tt / 1.8) * Math.PI) * 1.5;
      if (tt > 1.8) { S.rocketMode = null; r.position.y = 0; }
      return;
    }
    /* Up and out of sight, a pause up there, then a slow way back down. */
    if (tt < 3.5) r.position.y = Math.pow(tt / 3.5, 2.2) * 50;
    else if (tt < 5) { r.position.y = 50; S.flame.visible = false; }
    else if (tt < 9) r.position.y = 50 * Math.pow(1 - (tt - 5) / 4, 2);
    else {
      S.rocketMode = null;
      r.position.y = 0;
      S.goal.height = VIEWS.orbit.height; S.goal.dist = VIEWS.orbit.dist;
      S.goal.look.set(0, -0.4, 0);
    }
  }

  function stepParticles(dt) {
    for (var i = S.smoke.length - 1; i >= 0; i--) {
      var p = S.smoke[i];
      p.life += dt;
      p.mesh.position.x += p.vx; p.mesh.position.z += p.vz;
      p.mesh.position.y += dt * 0.4;
      p.mesh.scale.setScalar(1 + p.life * 2.2);
      p.mesh.material.opacity = Math.max(0, 0.9 - p.life * 0.75);
      if (p.life > 1.2) {
        S.scene.remove(p.mesh); p.mesh.geometry.dispose(); p.mesh.material.dispose();
        S.smoke.splice(i, 1);
      }
    }
    for (var j = S.sparks.length - 1; j >= 0; j--) {
      var s = S.sparks[j], arr = s.points.geometry.attributes.position.array;
      for (var n = 0; n < arr.length; n += 3) {
        arr[n] += s.vel[n]; arr[n + 1] += s.vel[n + 1]; arr[n + 2] += s.vel[n + 2];
        s.vel[n + 1] -= 0.006;
      }
      s.points.geometry.attributes.position.needsUpdate = true;
      s.life += dt;
      s.points.material.opacity = Math.max(0, 1 - s.life / 1.6);
      if (s.life > 1.6) {
        s.group.remove(s.points); s.points.geometry.dispose(); s.points.material.dispose();
        S.sparks.splice(j, 1);
      }
    }
  }

  /* ======================================================================
     Page
     ====================================================================== */
  function render() {
    var d = t();
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach(function (n) {
      var v = d[n.dataset.t];
      if (typeof v === "string") n.textContent = v;
    });
    ORDER.forEach(function (id) { isClearCache[id] = isClear(id); });

    var views = byId("views");
    views.innerHTML = "";
    if (S.ready) {
      Object.keys(VIEWS).forEach(function (key) {
        var b = el("button", null, d.views[key]);
        b.type = "button";
        b.onclick = function () {
          S.goal.angle = nearAngle(VIEWS[key].angle);
          S.goal.height = VIEWS[key].height;
          S.goal.dist = VIEWS[key].dist;
          S.goal.look.set(0, -0.4, 0);
        };
        views.appendChild(b);
      });
      paintTags();
    }

    var lg = byId("legend");
    lg.innerHTML = "";
    ORDER.forEach(function (id) {
      var st = state(id);
      var b = el("button", "lg is-" + st);
      b.type = "button";
      b.appendChild(el("span", "lg__dot"));
      b.appendChild(el("span", null, d.sector + " " + id + " · " + d.names[id][0]));
      b.appendChild(el("span", "lg__state", d.states[st]));
      b.onclick = function () { openPanel(id); };
      lg.appendChild(b);
    });
    byId("openAll").hidden = done("map-open-all") || ORDER.every(isClear);
    byId("openAll").title = d.openAllTip;

    paintPanel();
    sync();
    if (!byId("say").hidden && queue.length) showLine();
  }

  /* Coming back from a task (the back button, another tab, a restored page)
     re-reads the store and plays whatever the child has earned since. */
  function refresh() { render(); queueBeats(); }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
  window.addEventListener("focus", refresh);
  window.addEventListener("storage", refresh);
  window.addEventListener("pageshow", function (e) { if (e.persisted) refresh(); });

  byId("openAll").onclick = function () {
    remember("map-open-all");
    render();
    speak({ key: "openAllLine" });
  };
  byId("reset").onclick = function () {
    forget();
    queue = []; queued = {};
    open = null;
    byId("say").hidden = true;
    if (S.ready) {
      S.andy.mode = "free";
      S.andy.group.position.set(-2.6, 0, 1.4);
      S.padLit = false;
      S.rocketMode = null;
      S.rocket.position.y = 0;
    }
    render();
    queueBeats();
  };

  document.querySelectorAll(".langs button").forEach(function (b) {
    b.onclick = function () {
      lang = b.dataset.lang;
      document.querySelectorAll(".langs button").forEach(function (x) {
        x.setAttribute("aria-pressed", String(x === b));
      });
      render();
    };
  });

  /* No WebGL: a flat picture of the island takes the stage, and everything
     else (the list, the panel, the dialogue) works exactly the same. */
  if (!initThree()) {
    var stage = byId("stage");
    stage.removeChild(byId("scene"));
    stage.removeChild(byId("hint"));
    var box = el("div", "fallback");
    box.innerHTML = '<svg viewBox="0 0 420 220" aria-hidden="true">' +
      '<ellipse cx="210" cy="150" rx="190" ry="52" fill="#485444" stroke="#0d150d" stroke-width="3"/>' +
      '<ellipse cx="210" cy="132" rx="196" ry="52" fill="#8fd770" stroke="#0d150d" stroke-width="3"/>' +
      '<rect x="48" y="80" width="62" height="46" rx="4" fill="#34a06a" stroke="#0d150d" stroke-width="3"/>' +
      '<path d="M120 128 v-28 a28 28 0 0 1 56 0 v28 z" fill="#ffd84d" stroke="#0d150d" stroke-width="3"/>' +
      '<rect x="270" y="54" width="26" height="76" rx="6" fill="#3aa0b5" stroke="#0d150d" stroke-width="3"/>' +
      '<path d="M318 130 v-34 l22 -10 l22 10 v34 z" fill="#f6b394" stroke="#0d150d" stroke-width="3"/>' +
      '<path d="M200 130 v-58 q10 -28 20 0 v58 z" fill="#fbfcf7" stroke="#0d150d" stroke-width="3"/>' +
      '<path d="M200 72 q10 -28 20 0 z" fill="#e2552f" stroke="#0d150d" stroke-width="3"/>' +
      '<g transform="translate(240,116) scale(.36)">' + andyFace("happy").replace(/^<svg[^>]*>|<\/svg>$/g, "") + "</g></svg>";
    var msg = el("p");
    msg.dataset.t = "noWebgl";
    box.appendChild(msg);
    stage.insertBefore(box, stage.firstChild);
  }
  render();
  queueBeats();
})();
</script>
</body>
</html>
