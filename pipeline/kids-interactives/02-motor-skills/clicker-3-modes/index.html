<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mouse control practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Built from _shared/grasslms.css — edit that file, then run _shared/build.py */
/* ==========================================================================
   GrassLMS · Lively v2 — shared layer for standalone kid-facing activities
   Tokens lifted from lms2.9/frontend/src/app/globals.css (v2.0.0, 2026-08-02)
   and DESIGN_SPEC.md. Light only, exactly as the spec says.
   Never a raw hex inside a component — always a token.

   Load order in a page: link this file first, then the page's own style block
   with only what that one activity genuinely needs on top. Run _shared/build.py
   to fold this file into each page as a self-contained block.

   Note for future edits: nothing in this file may contain a literal closing
   style tag, not even inside a CSS comment. The build inlines this text into a
   style element, and an HTML parser ends that element at the first such tag it
   sees — comments do not protect it. A stray one dumps the whole stylesheet
   onto the page as visible text.
   ========================================================================== */

:root {
  --green-25:  #f4fbef;
  --green-50:  #ecf9e7;
  --green-100: #d4f1c4;
  --green-200: #b6e69e;
  --green-300: #8fd770;
  --green-400: #34a06a;
  --green-500: #17915e;
  --green-600: #0a8754;
  --green-700: #07683f;
  --green-800: #054d2f;
  --green-900: #0a3d24;

  --sun-50:  #fffbe5;
  --sun-100: #fff2b3;
  --sun-300: #ffe066;
  --sun-400: #ffd84d;
  --sun-500: #f5b800;
  --sun-700: #7a5500;

  --clay-50:  #fdefe7;
  --clay-100: #fbd8c7;
  --clay-300: #f6b394;
  --clay-500: #e2552f;
  --clay-600: #c1401d;
  --clay-700: #9e300f;

  --lagoon-50:  #e4f1f4;
  --lagoon-200: #b9d9e0;
  --lagoon-400: #3aa0b5;
  --lagoon-600: #12798f;
  --lagoon-800: #0a4652;

  --ink-50:  #f3f5ef;
  --ink-100: #e3e8dd;
  --ink-200: #c4cdbe;
  --ink-300: #93a08d;
  --ink-400: #6a7568;
  --ink-500: #485444;
  --ink-700: #232b22;
  --ink-900: #0d150d;

  --paper:   #fbfcf7;
  --paper-2: #ffffff;

  /* ---- SEMANTIC — components read these, never the ramps above -------- */
  --color-bg:            var(--paper);
  --color-surface:       var(--paper-2);
  --color-surface-2:     var(--ink-50);

  --color-text:          var(--ink-900);
  --color-text-muted:    var(--ink-500);
  --color-text-subtle:   var(--ink-400);
  --color-text-inverse:  #ffffff;

  --color-border:        var(--ink-100);
  --color-border-strong: var(--ink-200);
  --color-border-focus:  var(--green-500);

  --color-primary:       var(--green-600);
  --color-primary-hover: var(--green-700);
  --color-primary-soft:  var(--green-100);
  --color-primary-fg:    #ffffff;

  --color-reward:      var(--sun-400);
  --color-reward-soft: var(--sun-100);
  --color-reward-fg:   var(--sun-700);

  --color-success:      var(--green-600);
  --color-success-soft: var(--green-50);
  --color-success-fg:   var(--green-800);

  --color-danger:      var(--clay-500);
  --color-danger-soft: var(--clay-50);
  --color-danger-fg:   var(--clay-700);

  --color-info:      var(--lagoon-600);
  --color-info-soft: var(--lagoon-50);
  --color-info-fg:   var(--lagoon-800);

  /* ---- ELEVATION — the pop is a sharp solid offset, never a blur ------ */
  --shadow-xs: 0 1px 2px rgba(13, 21, 13, .05);
  --shadow-sm: 0 2px 6px -1px rgba(13, 21, 13, .07);
  --shadow-md: 0 8px 24px -8px rgba(13, 21, 13, .14);
  --shadow-lg: 0 18px 50px -20px rgba(13, 21, 13, .20);
  --ring-focus: 0 0 0 4px var(--green-100);

  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  --radius-pill: 999px;

  --s-1: 4px;  --s-2: 8px;  --s-3: 12px;  --s-4: 16px;  --s-5: 20px;
  --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px; --s-16: 64px;

  --control-sm: 36px;
  --control-md: 44px;   /* minimum touch target — a child's finger */
  --control-lg: 52px;

  --font-sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  --t-2xs: 11px; --t-xs: 12px; --t-sm: 13px; --t-base: 15px; --t-md: 17px;
  --t-lg: 20px;  --t-xl: 24px; --t-2xl: 32px; --t-3xl: 44px; --t-4xl: 60px;

  --tracking-display: -.035em;
  --tracking-heading: -.025em;
  --tracking-eyebrow: .12em;
  --leading-body: 1.65;

  /* Page gutters, as tokens: the activities that pin themselves to the
     viewport subtract --page-pad, so the two can never drift apart. */
  --page-top: 16px;
  --page-bottom: 20px;
  --page-pad: 36px;

  --motion-fast: 120ms;
  --motion-base: 200ms;
  --motion-ease: cubic-bezier(.2, .8, .3, 1);
}

/* ---- BASE -------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--t-base);
  line-height: var(--leading-body);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  margin: 0;
  font-weight: 800;
  letter-spacing: var(--tracking-heading);
  line-height: 1.15;
  text-wrap: balance;
  color: var(--color-text);          /* headings are never green */
}
h1 { font-size: clamp(var(--t-2xl), 5vw, var(--t-3xl)); letter-spacing: var(--tracking-display); }
h2 { font-size: clamp(var(--t-xl), 3.4vw, var(--t-2xl)); }
h3 { font-size: var(--t-lg); font-weight: 700; }
h4 { font-size: var(--t-md); font-weight: 700; }
p  { margin: 0; }

a { color: var(--color-info); text-decoration-thickness: 1px; text-underline-offset: 2px; }

/* The one typographic flourish: a sun marker on a single word of a heading.
   Never a UI background — the spec is explicit about that.

   The colour is pinned, not inherited. The background is always the same
   yellow, so the ink has to be always the same dark: on a night page the
   heading colour is near-white, and white on sun-300 cannot be read. */
.mark {
  background: var(--sun-300);
  color: var(--ink-900);
  padding: 0 var(--s-2);
  border-radius: var(--s-2);
  transform: rotate(-1deg);
  display: inline-block;
  font-style: normal;
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  text-transform: uppercase;
  letter-spacing: var(--tracking-eyebrow);
  font-weight: 500;
  color: var(--color-text-subtle);
}

.lede  { font-size: var(--t-md); color: var(--color-text-muted); max-width: 62ch; }
.muted { color: var(--color-text-muted); }
.mono  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---- LAYOUT ------------------------------------------------------------ */
.wrap { max-width: 960px; margin: 0 auto; padding: 0 clamp(var(--s-4), 4vw, var(--s-8)); }
.wrap--narrow { max-width: 680px; }
.wrap--wide   { max-width: 1180px; }
.stack { display: flex; flex-direction: column; gap: var(--s-4); }
.stack--tight { gap: var(--s-2); }
.stack--loose { gap: var(--s-8); }
.row { display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap; }
.row--between { justify-content: space-between; }
.center { display: grid; place-items: center; }

/* ---- BUTTONS — signature shadow-pop physics ---------------------------- */
.btn {
  --pop: var(--green-700);
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s-2);
  min-height: var(--control-md);
  padding: var(--s-3) var(--s-5);
  border: 0;
  border-radius: var(--radius-md);
  background: var(--color-primary);
  color: var(--color-primary-fg);
  font-family: inherit;
  font-size: var(--t-sm);
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 4px 0 0 var(--pop);
  transition:
    transform var(--motion-fast) var(--motion-ease),
    box-shadow var(--motion-fast) var(--motion-ease),
    background-color var(--motion-fast) var(--motion-ease);
}
.btn:hover:not(:disabled)  { transform: translateY(2px); box-shadow: 0 2px 0 0 var(--pop); background: var(--color-primary-hover); }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 0 var(--pop); }
.btn:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none !important; }

.btn--secondary { --pop: var(--ink-100); background: var(--color-surface); color: var(--color-text); }
.btn--secondary:hover:not(:disabled) { background: var(--ink-50); }
.btn--danger { --pop: var(--clay-700); background: var(--color-danger); }
.btn--danger:hover:not(:disabled) { background: var(--clay-600); }
.btn--sun { --pop: var(--sun-500); background: var(--sun-400); color: var(--ink-900); }
.btn--sun:hover:not(:disabled) { background: var(--sun-300); }
.btn--ink { --pop: var(--ink-900); background: var(--ink-700); }
.btn--ink:hover:not(:disabled) { background: var(--ink-900); }

.btn--ghost { box-shadow: none; background: transparent; color: var(--ink-700); }
.btn--ghost:hover:not(:disabled)  { background: var(--ink-50); transform: none; box-shadow: none; }
.btn--ghost:active:not(:disabled) { transform: none; box-shadow: none; }

.btn--sm { min-height: var(--control-sm); padding: var(--s-2) var(--s-4); font-size: var(--t-xs); border-radius: var(--radius-sm); }
.btn--lg { min-height: var(--control-lg); padding: var(--s-4) var(--s-6); font-size: var(--t-base); border-radius: var(--radius-lg); }
.btn--icon  { padding: 0; width: var(--control-md); height: var(--control-md); }
.btn--block { width: 100%; }

/* ---- SURFACES ---------------------------------------------------------- */
.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--s-5);
  box-shadow: var(--shadow-sm);
}
.card--flat { box-shadow: none; }
.panel { background: var(--color-surface-2); border-radius: var(--radius-md); padding: var(--s-4); }

/* ---- CHIPS ------------------------------------------------------------- */
.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--s-1);
  padding: var(--s-1) var(--s-3);
  border-radius: var(--radius-pill);
  background: var(--color-surface-2);
  color: var(--color-text-muted);
  font-size: var(--t-xs);
  font-weight: 600;
  white-space: nowrap;
}
.chip--reward  { background: var(--color-reward-soft);  color: var(--color-reward-fg); }
.chip--success { background: var(--color-success-soft); color: var(--color-success-fg); }
.chip--danger  { background: var(--color-danger-soft);  color: var(--color-danger-fg); }
.chip--info    { background: var(--color-info-soft);    color: var(--color-info-fg); }

/* ---- INPUTS ------------------------------------------------------------ */
.input, .select, .textarea {
  width: 100%;
  min-height: var(--control-md);
  padding: var(--s-3) var(--s-4);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  color: var(--color-text);
  font-family: inherit;
  font-size: var(--t-base);
}
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--color-border-focus);
  box-shadow: var(--ring-focus);
}
.label { display: block; font-size: var(--t-sm); font-weight: 600; margin-bottom: var(--s-2); }

/* ---- PROGRESS ---------------------------------------------------------- */
.progress { height: 10px; border-radius: var(--radius-pill); background: var(--ink-100); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--color-primary); border-radius: inherit; transition: width var(--motion-base) var(--motion-ease); }

.steps { display: flex; gap: var(--s-2); }
.steps > i { flex: 1; height: 6px; border-radius: var(--radius-pill); background: var(--ink-100); }
.steps > i.is-done    { background: var(--color-primary); }
.steps > i.is-current { background: var(--sun-400); }

/* ---- ACTIVITY PRIMITIVES — what every game here shares ----------------- */
.hud {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--s-4); flex-wrap: wrap;
  padding: var(--s-3) var(--s-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
}
.hud__score { font-family: var(--font-mono); font-size: var(--t-lg); font-weight: 700; font-variant-numeric: tabular-nums; }

.lives { display: inline-flex; gap: var(--s-1); }
.lives > i { width: 10px; height: 10px; border-radius: var(--radius-pill); background: var(--color-primary); }
.lives > i.is-spent { background: var(--ink-200); }

/* Draggable token and its target, sized for a finger per the tablet rule. */
.token {
  display: inline-flex; align-items: center; gap: var(--s-2);
  min-height: var(--control-md);
  padding: var(--s-2) var(--s-4);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  border: 1px solid var(--color-border-strong);
  box-shadow: var(--shadow-xs);
  cursor: grab;
  touch-action: none;
  user-select: none;
  font-weight: 600;
}
.token:active { cursor: grabbing; }
.token.is-dragging { opacity: .5; }

.dropzone {
  min-height: var(--control-lg);
  padding: var(--s-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius-md);
  background: var(--color-surface-2);
  transition: border-color var(--motion-fast) var(--motion-ease), background var(--motion-fast) var(--motion-ease);
}
.dropzone.is-over { border-color: var(--color-primary); background: var(--color-primary-soft); }

/* Verdict — colour is never the only signal; pair it with a mark or a word. */
.is-correct { border-color: var(--color-success) !important; background: var(--color-success-soft) !important; }
.is-wrong   { border-color: var(--color-danger)  !important; background: var(--color-danger-soft)  !important; }

.feedback { display: flex; gap: var(--s-3); padding: var(--s-4); border-radius: var(--radius-md); font-weight: 600; }
.feedback--ok   { background: var(--color-success-soft); color: var(--color-success-fg); }
.feedback--no   { background: var(--color-danger-soft);  color: var(--color-danger-fg); }
.feedback--hint { background: var(--color-info-soft);    color: var(--color-info-fg); font-weight: 500; }

/* ---- OPTION — the tap target for any multiple-choice answer ------------ */
.option {
  display: flex; align-items: center; gap: var(--s-3);
  width: 100%;
  min-height: 64px;                 /* the tablet rule, written down */
  padding: var(--s-3) var(--s-4);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  color: var(--color-text);
  font: inherit;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  transition: border-color var(--motion-fast) var(--motion-ease), background var(--motion-fast) var(--motion-ease);
}
.option:hover:not(:disabled) { border-color: var(--color-border-focus); }
.option:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }
.option.is-selected { border-color: var(--color-primary); background: var(--color-primary-soft); }
.option:disabled { cursor: default; }

/* ---- MODAL ------------------------------------------------------------- */
.scrim {
  position: fixed; inset: 0; z-index: 50;
  display: grid; place-items: center;
  padding: var(--s-4);
  background: rgba(13, 21, 13, .45);
}
.modal {
  width: min(480px, 100%);
  background: var(--color-surface);
  border-radius: var(--radius-xl);
  padding: var(--s-6);
  box-shadow: var(--shadow-lg);
  text-align: center;
}

/* ---- LANGUAGE SWITCH — two languages, English first -------------------- */
.langs { display: inline-flex; gap: var(--s-1); padding: var(--s-1); background: var(--color-surface-2); border-radius: var(--radius-pill); }
.langs button {
  min-height: var(--control-sm);
  padding: 0 var(--s-4);
  border: 0; border-radius: var(--radius-pill);
  background: transparent;
  color: var(--color-text-muted);
  font: inherit; font-size: var(--t-xs); font-weight: 700;
  cursor: pointer;
}
.langs button[aria-pressed="true"] { background: var(--color-surface); color: var(--color-text); box-shadow: var(--shadow-xs); }
.langs button:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }

/* ---- A11Y -------------------------------------------------------------- */
.visually-hidden {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    transition-duration: .001ms !important;
  }
  .btn:hover, .btn:active { transform: none; }
}

/* ---- NIGHT ------------------------------------------------------------- */
/* Not a dark mode. The spec is light-only and stays that way; this is a
   palette for pages whose subject is genuinely dark — the space scenes, where
   painting a starfield onto warm paper would fight the picture. Put
   data-night on <html> or on one section. Only the semantic aliases move; the
   ramps and every component below them are untouched, so a button keeps the
   same physics and a card keeps the same radius. */
[data-night] {
  --color-bg:            #070d12;
  --color-surface:       #0e1720;
  --color-surface-2:     #16222e;

  --color-text:          #eef4f1;
  --color-text-muted:    #b3c2c9;
  --color-text-subtle:   #7f929c;
  --color-text-inverse:  #070d12;

  --color-border:        #23323f;
  --color-border-strong: #35485a;
  --color-border-focus:  var(--green-300);

  --color-primary:       var(--green-400);
  --color-primary-hover: var(--green-300);
  --color-primary-soft:  #14342a;
  --color-primary-fg:    #041109;

  --color-reward:      var(--sun-300);
  --color-reward-soft: #3a3111;
  --color-reward-fg:   var(--sun-300);

  --color-success:      var(--green-300);
  --color-success-soft: #12301f;
  --color-success-fg:   var(--green-300);

  --color-danger:      var(--clay-300);
  --color-danger-soft: #3a1d13;
  --color-danger-fg:   var(--clay-300);

  --color-info:      var(--lagoon-400);
  --color-info-soft: #0d2b33;
  --color-info-fg:   var(--lagoon-200);

  --ring-focus: 0 0 0 4px #14342a;
}

/* The pop shadow needs a colour that reads against a dark ground. */
[data-night] .btn { --pop: #041109; }

/* These two variants name ramp colours directly rather than semantic aliases,
   so the night palette cannot reach them: a ghost button would be near-black
   ink on a near-black page, and a secondary button would flash a white panel
   under white text on hover. */
[data-night] .btn--ghost { color: var(--color-text-muted); }
[data-night] .btn--ghost:hover:not(:disabled) { background: rgba(255, 255, 255, .08); }
[data-night] .btn--secondary { --pop: #23323f; }
[data-night] .btn--secondary:hover:not(:disabled) { background: var(--color-surface-2); }

/* ---- SHORT SCREENS ------------------------------------------------------ */
/* A 1366x768 laptop leaves roughly 660px once the browser has taken its share,
   and every activity here is meant to land whole on one screen. Below 760px of
   viewport the heading block and the card padding give up some of their air so
   the working part stays above the fold. Nothing moves, nothing hides — the
   same layout, breathing a little less. */
@media (max-height: 760px) {
  :root { --page-top: 12px; --page-bottom: 14px; --page-pad: 26px; }
  h1 { font-size: var(--t-xl); }
  h2 { font-size: var(--t-lg); }
  .lede { font-size: var(--t-sm); }
  .stack { gap: var(--s-3); }
  .stack--loose { gap: var(--s-3); }
  .stack--tight { gap: var(--s-1); }
  .card { padding: var(--s-4); }
  .hud { padding: var(--s-2) var(--s-3); }
  body { padding-bottom: var(--s-4); }
}

/* A netbook, a projector, a browser with three toolbars open. Same layout
   again, one notch tighter. */
@media (max-height: 700px) {
  :root { --page-top: 10px; --page-bottom: 10px; --page-pad: 20px; }
  h1 { font-size: var(--t-lg); }
  h2 { font-size: var(--t-md); }
  .lede { font-size: var(--t-xs); }
  .card { padding: var(--s-3); }
  .stack, .stack--loose { gap: var(--s-2); }
  .hud { padding: var(--s-1) var(--s-3); }
}
</style>
<!-- grasslms:end -->

<style>
/* ==========================================================================
   Arcade shell — a match-three game look, in the Candy Crush manner.

   This is the one place in the collection that steps off the GrassLMS design
   system on purpose. A reflex drill for six-year-olds has to look like a game
   or it will not be played twice, and the paper-and-green look reads as
   schoolwork. Everything is scoped under .arcade, so the shared layer stays
   underneath and the page only wears this on top.

   The three moves that carry the style:
     1. A deep grape ground with a warm glow at the top, not a flat colour.
     2. Every solid has a lit top face and a hard bottom lip, so it reads as a
        moulded sweet rather than a rectangle.
     3. Display type is filled light and outlined dark the way cartoon
        lettering is, done with layered text-shadows: Firefox does not support
        paint-order on HTML text.
   ========================================================================== */

.arcade {
  --ar-ink: #fff8e7;
  --ar-dim: #cdbdf5;
  --ar-panel: #5b3fc4;
  --ar-panel-lip: #38228c;
  --ar-panel-top: #7a5fe0;
  --ar-board: #2a1a63;
  --ar-board-lip: #170d3d;
  --ar-gold: #ffd54a;
  --ar-gold-lip: #d99a10;
  --ar-green: #6ec83f;
  --ar-green-lip: #3f8a19;
  --ar-pink: #ff5d8f;
  --ar-pink-lip: #c62c5c;

  background:
    radial-gradient(120% 80% at 50% -10%, #6a4fd6 0%, #3b2790 45%, #221552 78%, #170e3c 100%)
    fixed;
  color: var(--ar-ink);
}

/* ---- display type ------------------------------------------------------- */
.arcade h1 {
  color: #fff;
  letter-spacing: -.01em;
  text-shadow:
     2px 0 0 #2b1560, -2px 0 0 #2b1560, 0 2px 0 #2b1560, 0 -2px 0 #2b1560,
     2px 2px 0 #2b1560, -2px 2px 0 #2b1560, 2px -2px 0 #2b1560, -2px -2px 0 #2b1560,
     0 5px 0 #2b1560, 0 8px 14px rgba(0, 0, 0, .45);
}
/* A smaller heading needs a thinner outline: the same eight offsets at 2px
   close up the counters and the word turns into a smudge. */
.arcade h2 {
  color: #fff;
  text-shadow:
     1.2px 0 0 #2b1560, -1.2px 0 0 #2b1560, 0 1.2px 0 #2b1560, 0 -1.2px 0 #2b1560,
     1.2px 1.2px 0 #2b1560, -1.2px 1.2px 0 #2b1560, 1.2px -1.2px 0 #2b1560, -1.2px -1.2px 0 #2b1560,
     0 3px 0 #2b1560;
}
.arcade .mark {
  background: linear-gradient(#ffe57a, var(--ar-gold) 55%, #f5b100);
  color: #5a3600;
  border-radius: 12px;
  padding: 0 var(--s-3);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .7), 0 4px 0 var(--ar-gold-lip);
  text-shadow: none;
}
.arcade .lede,
.arcade .muted { color: var(--ar-dim); }
.arcade .eyebrow, .arcade .tag { color: var(--ar-gold); }

/* ---- panels: a lit top face and a hard lip ------------------------------ */
.arcade .card,
.arcade .hud {
  background: linear-gradient(var(--ar-panel-top), var(--ar-panel) 42%, #4a30ac);
  border: 3px solid rgba(20, 8, 60, .55);
  border-radius: 20px;
  box-shadow:
    inset 0 3px 0 rgba(255, 255, 255, .38),
    inset 0 -6px 0 rgba(20, 8, 60, .28),
    0 7px 0 var(--ar-panel-lip),
    0 14px 24px rgba(10, 4, 34, .5);
  color: var(--ar-ink);
}
.arcade .hud { border-radius: 16px; }
.arcade .hud__score {
  font-family: var(--font-sans); font-weight: 800; font-size: var(--t-2xl);
  color: #fff;
  text-shadow: 1.5px 1.5px 0 #2b1560, -1.5px 1.5px 0 #2b1560, 1.5px -1.5px 0 #2b1560, -1.5px -1.5px 0 #2b1560, 0 3px 0 #2b1560;
}

/* ---- buttons: moulded sweets -------------------------------------------- */
.arcade .btn {
  --ar-face: var(--ar-green);
  --ar-lip: var(--ar-green-lip);
  border-radius: 999px;
  border: 3px solid rgba(20, 8, 60, .45);
  background: linear-gradient(rgba(255, 255, 255, .42), rgba(255, 255, 255, 0) 46%), var(--ar-face);
  color: #fff;
  font-weight: 800;
  text-shadow: 0 2px 0 rgba(0, 0, 0, .3);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .55), 0 6px 0 var(--ar-lip), 0 10px 16px rgba(10, 4, 34, .4);
  transition: transform var(--motion-fast) var(--motion-ease), box-shadow var(--motion-fast) var(--motion-ease);
}
.arcade .btn:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .55), 0 7px 0 var(--ar-lip), 0 12px 18px rgba(10, 4, 34, .45);
}
.arcade .btn:active:not(:disabled) {
  transform: translateY(5px);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .45), 0 1px 0 var(--ar-lip);
}
.arcade .btn--lg { font-size: var(--t-md); padding: var(--s-4) var(--s-8); }
.arcade .btn--ghost {
  --ar-face: rgba(255, 255, 255, .14);
  --ar-lip: rgba(20, 8, 60, .5);
  color: var(--ar-ink);
}

/* ---- the game picker ---------------------------------------------------- */
.arcade .mode {
  border-radius: 16px;
  border: 3px solid rgba(20, 8, 60, .4);
  background: linear-gradient(rgba(255, 255, 255, .16), rgba(255, 255, 255, .04));
  color: var(--ar-ink);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .3), 0 5px 0 rgba(20, 8, 60, .35);
  transition: transform var(--motion-fast) var(--motion-ease), border-color var(--motion-fast) var(--motion-ease);
}
.arcade .mode:hover { transform: translateY(-2px); border-color: rgba(255, 213, 74, .6); }
.arcade .mode span { color: var(--ar-dim); }
.arcade .mode[aria-pressed="true"] {
  background: linear-gradient(#ffe57a, var(--ar-gold) 60%, #f2ab08);
  border-color: #8a5c00;
  color: #4a2c00;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .8), 0 5px 0 var(--ar-gold-lip);
}
.arcade .mode[aria-pressed="true"] span { color: #6b4200; }

.arcade .picker button {
  border-radius: 999px;
  border: 3px solid rgba(20, 8, 60, .4);
  background: linear-gradient(rgba(255, 255, 255, .18), rgba(255, 255, 255, .05));
  color: var(--ar-ink); font-weight: 800;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .3), 0 4px 0 rgba(20, 8, 60, .35);
}
.arcade .picker button[aria-pressed="true"] {
  background: linear-gradient(#ff8fb1, var(--ar-pink) 60%, #ea3f75);
  border-color: #8d1f45; color: #fff;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .5), 0 4px 0 var(--ar-pink-lip);
}

/* ---- the board ---------------------------------------------------------- */
.arcade .field {
  border: 4px solid rgba(20, 8, 60, .6);
  border-radius: 22px;
  background:
    radial-gradient(circle at 1px 1px, rgba(255, 255, 255, .1) 1.5px, transparent 0) 0 0 / 30px 30px,
    linear-gradient(var(--ar-board), var(--ar-board-lip));
  box-shadow: inset 0 6px 18px rgba(0, 0, 0, .5), inset 0 -3px 0 rgba(255, 255, 255, .06), 0 8px 0 rgba(15, 7, 40, .8);
}

/* ---- the sweets themselves ---------------------------------------------- */
.arcade .target {
  --ar-face: #7ad84a;
  --ar-lip: #3f8a19;
  border-radius: 50%;
  border: 3px solid rgba(20, 8, 60, .45);
  background:
    radial-gradient(circle at 32% 26%, rgba(255, 255, 255, .92) 0 12%, rgba(255, 255, 255, 0) 46%),
    radial-gradient(circle at 50% 118%, rgba(0, 0, 0, .3), rgba(0, 0, 0, 0) 60%),
    var(--ar-face);
  color: #fff;
  font-weight: 800;
  text-shadow: 0 2px 0 rgba(0, 0, 0, .35);
  box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .18), 0 6px 0 var(--ar-lip), 0 10px 16px rgba(10, 4, 34, .5);
}
.arcade .target:active { transform: translateY(4px); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .18), 0 2px 0 var(--ar-lip); }
.arcade .target--sun  { --ar-face: #ffc23d; --ar-lip: #d18a00; color: #4a2c00; text-shadow: 0 2px 0 rgba(255, 255, 255, .4); }
.arcade .target--clay { --ar-face: #ff6b6b; --ar-lip: #c22f2f; }

/* ---- the place a sweet has to be dragged to ----------------------------- */
.arcade .goal {
  border: 3px dashed var(--ar-gold);
  border-radius: 18px;
  background: radial-gradient(circle at 50% 40%, rgba(255, 213, 74, .3), rgba(255, 213, 74, .08));
  color: var(--ar-gold);
  font-weight: 800;
  box-shadow: inset 0 0 22px rgba(255, 213, 74, .28);
  animation: ar-breathe 1.6s ease-in-out infinite;
}
.arcade .goal.is-over {
  border-style: solid;
  background: radial-gradient(circle at 50% 40%, rgba(255, 213, 74, .6), rgba(255, 160, 30, .3));
  color: #4a2c00;
}
@keyframes ar-breathe { 50% { box-shadow: inset 0 0 34px rgba(255, 213, 74, .5); } }

/* A hit throws off a burst rather than a ring. */
.arcade .pulse {
  background: radial-gradient(circle, rgba(255, 255, 255, .95) 0 18%, rgba(255, 213, 74, .75) 34%, rgba(255, 213, 74, 0) 70%);
  animation: ar-pop 340ms cubic-bezier(.2, .9, .3, 1) forwards;
}
@keyframes ar-pop {
  from { opacity: 1; transform: scale(.4) rotate(0deg); }
  to   { opacity: 0; transform: scale(2.1) rotate(35deg); }
}

/* ---- the score screen --------------------------------------------------- */
.arcade .stats b {
  color: #fff; font-family: var(--font-sans); font-weight: 800;
  text-shadow: 1.5px 1.5px 0 #2b1560, -1.5px 1.5px 0 #2b1560, 1.5px -1.5px 0 #2b1560, -1.5px -1.5px 0 #2b1560, 0 4px 0 #2b1560;
}
.arcade .stars { display: flex; justify-content: center; align-items: center; gap: var(--s-3); min-height: 58px; }
.arcade .stars svg { width: 54px; height: 54px; display: block; }
.arcade .stars .is-off { opacity: .22; filter: grayscale(1); }
.arcade .stars .is-on { animation: ar-land 420ms cubic-bezier(.2, 1.5, .4, 1) backwards; }
.arcade .stars .is-on:nth-child(2) { animation-delay: 140ms; }
.arcade .stars .is-on:nth-child(3) { animation-delay: 280ms; }
@keyframes ar-land { from { transform: scale(2.4) rotate(-25deg); opacity: 0; } }

.arcade .langs { background: rgba(20, 8, 60, .45); }
.arcade .langs button { color: var(--ar-dim); }
.arcade .langs button[aria-pressed="true"] { background: var(--ar-gold); color: #4a2c00; box-shadow: none; }

@media (prefers-reduced-motion: reduce) {
  .arcade .goal, .arcade .stars .is-on { animation: none; }
}
</style>

    <div class="row" style="gap: var(--s-8); align-items: flex-start;">
      <div class="stack stack--tight">

      </div>
      <div class="stack stack--tight">
        <p class="tag" data-t="pickLength">Round length</p>

      </div>

  </section>

      allActivities: "Todas las actividades",
      title1: "", title2: "Clics y arrastres", title3: "con el ratón",
      intro: "Cada uno de estos cuatro juegos pequeños entrena un movimiento que tu mano hace en el ordenador, así que elige un juego y un nivel y pulsa Empezar.",
      pickGame: "Elige un juego", pickLevel: "Nivel", pickLength: "Duración",
      start: "Empezar", stop: "Parar", again: "Jugar otra vez", back: "Elegir otro juego",
      hits: "Aciertos", misses: "Fallos", timeLeft: "Tiempo", accuracy: "Precisión",
      resultTitle: "La ronda ha terminado",
      levels: { easy: "Fácil", medium: "Medio", hard: "Difícil" },
      lengths: { 30: "30 segundos", 60: "60 segundos" },
      modes: {
        single: { name: "Un clic", note: "Haz un clic en el círculo antes de que desaparezca, porque solo espera unos segundos." },
        double: { name: "Doble clic", note: "Haz dos clics rápidos en el mismo círculo para hacer un doble clic." },
        drag:   { name: "Arrastrar y soltar", note: "Mantén pulsado el círculo y llévalo hasta el marco punteado antes de soltarlo." },
        dodge:  { name: "Objetivos en movimiento", note: "Los círculos no paran de moverse. Sigue uno con el puntero y haz clic cuando lo alcances." }
      },
      hints: {
        single: "Haz clic en cada círculo antes de que desaparezca.",
        double: "Haz doble clic en cada círculo, con los dos clics rápidos y en el mismo sitio.",
        drag: "Arrastra el círculo amarillo hasta el marco punteado y suéltalo dentro.",
        dodge: "Sigue un círculo que se mueve y haz clic cuando el puntero esté encima."
      },
      goal: "Suelta aquí",
      verdict: function (r, total) {
        return !total ? "Has parado antes del primer clic. Pulsa Jugar otra vez cuando estés listo."
             : r >= 80 ? (level === "hard" ? "Casi todos tus clics dieron en el círculo, incluso en el nivel más difícil." : "Casi todos tus clics dieron en el círculo. Cuando quieras un reto mayor, prueba el nivel siguiente.")
             : r >= 50 ? "Más de la mitad de tus clics acertaron. Con unos cuantos más, la próxima vez tendrás tres estrellas."
                       : "Prueba a ir un poco más despacio y a apuntar antes de hacer clic. La rapidez ya vendrá sola.";
      }
    }
  };

  var lang = "en", mode = "single", level = "easy", length = 60;
  var hits = 0, misses = 0, running = false;
  var clockId = null, frameId = null, endsAt = 0, movers = [];

  const $ = function (id) { return document.getElementById(id); };
  const field = $("field");
  const t = function () { return T[lang]; };

  function paintStatic() {
    const d = t();
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach(function (el) {
      const v = d[el.dataset.t];
      if (typeof v === "string") el.textContent = v;
    });

    $("modes").innerHTML = "";
    ["single", "double", "drag", "dodge"].forEach(function (k) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "mode";
      b.setAttribute("aria-pressed", String(mode === k));
      const ic = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      ic.setAttribute("class", "mode__icon");
      ic.setAttribute("viewBox", "0 0 48 32");
      ic.setAttribute("aria-hidden", "true");
      ic.innerHTML = ICONS[k];
      const nm = document.createElement("b"); nm.textContent = d.modes[k].name;
      const nt = document.createElement("span"); nt.textContent = d.modes[k].note;
      b.append(ic, nm, nt);
      b.onclick = function () { mode = k; paintStatic(); };
      $("modes").appendChild(b);
    });

    $("levels").innerHTML = "";
    ["easy", "medium", "hard"].forEach(function (k) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = d.levels[k];
      b.setAttribute("aria-pressed", String(level === k));
      b.onclick = function () { level = k; paintStatic(); };
      $("levels").appendChild(b);
    });

    $("lengths").innerHTML = "";
    [30, 60].forEach(function (n) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = d.lengths[n];
      b.setAttribute("aria-pressed", String(length === n));
      b.onclick = function () { length = n; paintStatic(); };
      $("lengths").appendChild(b);
    });

    $("hint").textContent = d.hints[mode];
  }

  function rnd(min, max) { return min + Math.random() * (max - min); }

  function place(el, w, h) {
    const r = field.getBoundingClientRect();
    const x = rnd(0, Math.max(0, r.width - w));
    const y = rnd(0, Math.max(0, r.height - h));
    el.style.left = x + "px";
    el.style.top = y + "px";
    return { x: x, y: y };
  }

  function spark(x, y, tone) {
    const s = document.createElement("span");
    s.className = "pulse";
    s.style.cssText = "left:" + (x - 40) + "px;top:" + (y - 40) + "px;width:80px;height:80px;background:" +
      (tone === "no" ? "var(--clay-300)" : "var(--green-300)");
    field.appendChild(s);
    setTimeout(function () { s.remove(); }, 280);
  }

  function scored(ok, el) {
    const r = field.getBoundingClientRect();
    const b = el.getBoundingClientRect();
    spark(b.left - r.left + b.width / 2, b.top - r.top + b.height / 2, ok ? "ok" : "no");
    if (ok) { hits++; $("hits").textContent = hits; }
    else { misses++; $("misses").textContent = misses; }
  }

  function clearField() {
    field.innerHTML = "";
    movers = [];
    if (frameId) { cancelAnimationFrame(frameId); frameId = null; }
  }

  function spawnTap(dbl) {
    if (!running) return;
    const life = CFG[dbl ? "double" : "single"].life[level];
    const el = document.createElement("button");
    el.type = "button"; el.className = "target";
    el.setAttribute("aria-label", t().hints[mode]);
    el.textContent = dbl ? "2" : "";
    place(el, SIZE, SIZE);
    field.appendChild(el);

    var taps = 0, firstAt = 0;
    const gone = setTimeout(function () {
      if (el.isConnected) { scored(false, el); el.remove(); spawnTap(dbl); }
    }, life);

    el.onclick = function () {
      /* A double click is two clicks within half a second. A slow second
         click starts the pair again instead of counting. */
      const now = performance.now();
      if (dbl && taps === 1 && now - firstAt > 500) taps = 0;
      if (taps === 0) firstAt = now;
      taps++;
      if (!dbl || taps >= 2) {
        clearTimeout(gone); scored(true, el); el.remove(); spawnTap(dbl);
      } else {
        el.classList.add("target--sun");
      }
    };
  }

  function spawnDrag() {
    if (!running) return;
    const life = CFG.drag.life[level];
    const zoneSize = Math.round(SIZE * CFG.drag.zone[level]);

    const goal = document.createElement("div");
    goal.className = "goal";
    goal.style.width = zoneSize + "px";
    goal.style.height = zoneSize + "px";
    goal.textContent = t().goal;
    place(goal, zoneSize, zoneSize);
    field.appendChild(goal);

    const el = document.createElement("div");
    el.className = "target target--sun";
    el.setAttribute("role", "button");
    el.setAttribute("aria-label", t().hints.drag);
    /* The circle never starts on top of the frame: a hit has to be a carry,
       not a nudge. A few tries, then whatever the field leaves room for. */
    const g = { x: parseFloat(goal.style.left), y: parseFloat(goal.style.top) };
    for (var tries = 0; tries < 30; tries++) {
      const p = place(el, SIZE, SIZE);
      const apart = p.x + SIZE < g.x - 8 || p.x > g.x + zoneSize + 8 ||
                    p.y + SIZE < g.y - 8 || p.y > g.y + zoneSize + 8;
      if (apart) break;
    }
    field.appendChild(el);

    const gone = setTimeout(function () {
      if (el.isConnected) { scored(false, el); clearField(); spawnDrag(); }
    }, life);

    var dx = 0, dy = 0, dragging = false;
    el.addEventListener("pointerdown", function (e) {
      dragging = true;
      el.setPointerCapture(e.pointerId);
      const b = el.getBoundingClientRect();
      dx = e.clientX - b.left; dy = e.clientY - b.top;
    });
    el.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      const r = field.getBoundingClientRect();
      el.style.left = Math.min(Math.max(0, e.clientX - r.left - dx), r.width - SIZE) + "px";
      el.style.top = Math.min(Math.max(0, e.clientY - r.top - dy), r.height - SIZE) + "px";
      const g = goal.getBoundingClientRect(), b = el.getBoundingClientRect();
      const inside = b.left + b.width / 2 > g.left && b.left + b.width / 2 < g.right &&
                     b.top + b.height / 2 > g.top && b.top + b.height / 2 < g.bottom;
      goal.classList.toggle("is-over", inside);
    });
    el.addEventListener("pointerup", function () {
      dragging = false;
      if (goal.classList.contains("is-over")) {
        clearTimeout(gone); scored(true, el); clearField(); spawnDrag();
      }
    });
  }

  function addMover(speed) {
    const el = document.createElement("button");
    el.type = "button"; el.className = "target target--clay";
    el.setAttribute("aria-label", t().hints.dodge);
    const p = place(el, SIZE, SIZE);
    field.appendChild(el);
    const a = Math.random() * Math.PI * 2;
    const m = { el: el, x: p.x, y: p.y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed };
    el.onclick = function () {
      scored(true, el);
      el.remove();
      movers = movers.filter(function (o) { return o !== m; });
      if (running) addMover(speed);
    };
    movers.push(m);
  }

  function startDodge() {
    if (!running) return;
    const n = CFG.dodge.count[level], speed = CFG.dodge.speed[level];
    for (var i = 0; i < n; i++) addMover(speed);
    lastFrame = 0;
    tick();
  }

  /* Speeds are in pixels per frame at 60 frames a second, the rate they were
     tuned at. A 120 or 144 Hz screen calls this twice as often, so each step
     is scaled by the time that really passed; a long gap (the tab was hidden)
     counts as three frames at most, so nothing jumps across the field. */
  var lastFrame = 0;
  function tick(now) {
    if (!running) return;
    const r = field.getBoundingClientRect();
    const k = lastFrame && now ? Math.min(3, (now - lastFrame) / (1000 / 60)) : 1;
    lastFrame = now || 0;
    movers.forEach(function (m) {
      m.x += m.vx * k; m.y += m.vy * k;
      if (m.x <= 0 || m.x >= r.width - SIZE) m.vx *= -1;
      if (m.y <= 0 || m.y >= r.height - SIZE) m.vy *= -1;
      m.x = Math.min(Math.max(0, m.x), r.width - SIZE);
      m.y = Math.min(Math.max(0, m.y), r.height - SIZE);
      m.el.style.left = m.x + "px";
      m.el.style.top = m.y + "px";
    });
    frameId = requestAnimationFrame(tick);
  }

  function start() {
    hits = 0; misses = 0; running = true;
    $("hits").textContent = "0"; $("misses").textContent = "0";
    $("setup").hidden = true; $("result").hidden = true; $("play").hidden = false;
    $("hint").textContent = t().hints[mode];
    clearField();

    endsAt = Date.now() + length * 1000;
    $("clock").textContent = String(length);
    clockId = setInterval(function () {
      const left = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
      $("clock").textContent = String(left);
      if (left <= 0) finish(false);
    }, 200);

    if (mode === "single") spawnTap(false);
    else if (mode === "double") spawnTap(true);
    else if (mode === "drag") spawnDrag();
    else startDodge();

    field.onclick = function (e) {
      if (e.target === field && mode !== "drag") { misses++; $("misses").textContent = misses; }
    };
  }

  function finish(early) {
    running = false;
    if (clockId) { clearInterval(clockId); clockId = null; }
    clearField();
    const total = hits + misses;
    const rate = total ? Math.round((hits / total) * 100) : 0;
    $("rHits").textContent = hits;
    $("rMiss").textContent = misses;
    $("rRate").textContent = rate + "%";
    $("verdict").textContent = t().verdict(rate, total);

    /* Three stars, the way a match-three round ends: one for playing the
       round to the end (Stop does not earn it), one for half the taps
       landing, one for four in five. No clicks, no stars. */
    const earned = !total ? 0 : (early ? 0 : 1) + (rate >= 50 ? 1 : 0) + (rate >= 80 ? 1 : 0);
    const box = $("stars");
    box.innerHTML = "";
    for (let i = 0; i < 3; i++) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 48 48");
      svg.setAttribute("class", i < earned ? "is-on" : "is-off");
      const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
      use.setAttribute("href", "#ar-star");
      svg.appendChild(use);
      box.appendChild(svg);
    }
    $("play").hidden = true; $("result").hidden = false;
  }

  $("start").onclick = start;
  $("stop").onclick = function () { finish(true); };
  $("again").onclick = start;
  $("back").onclick = function () { $("result").hidden = true; $("setup").hidden = false; };

  document.querySelectorAll(".langs button").forEach(function (b) {
    b.onclick = function () {
      lang = b.dataset.lang;
      document.querySelectorAll(".langs button").forEach(function (x) {
        x.setAttribute("aria-pressed", String(x === b));
      });
      paintStatic();
    };
  });

  paintStatic();
})();
</script>
</body>
</html>
