<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Literacy 2.0 — Algonova | Презентация</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --coral: #FF6B6B;
            --mint: #4ECDC4;
            --yellow: #FFE66D;
            --blue: #74B9FF;
            --pink: #FD79A8;
            --green: #00B894;
            --dark: #1a1a2e;
            --darker: #0f0f1a;
            --gradient-main: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-coral: linear-gradient(135deg, #FF6B6B 0%, #ee5a5a 100%);
            --gradient-mint: linear-gradient(135deg, #4ECDC4 0%, #38f9d7 100%);
            --gradient-dark: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            --shadow: 0 25px 80px rgba(0,0,0,0.4);
            --glow: 0 0 60px rgba(102, 126, 234, 0.3);
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--gradient-dark);
            color: white;
        }

        .presentation {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .slides-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Base Slide - Fixed dimensions */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 50px 70px 80px;
            opacity: 0;
            visibility: hidden;
            transform: translateX(100px);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }

        .slide.prev {
            transform: translateX(-100px);
        }

        /* Cover Slide */
        .slide-cover {
            background: var(--gradient-dark);
            text-align: center;
            justify-content: center;
            align-items: center;
        }

        .slide-cover::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 70% 70%, rgba(118, 75, 162, 0.1) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-20px, -20px) rotate(5deg); }
        }

        .slide-cover .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--mint);
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .slide-cover h1 {
            font-size: clamp(3rem, 6vw, 5.5rem);
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #a8edea 50%, #fed6e3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
            line-height: 1.1;
        }

        .slide-cover .subtitle {
            font-size: 1.8rem;
            font-weight: 400;
            opacity: 0.85;
            position: relative;
            z-index: 1;
        }

        /* Separator Slides */
        .slide-separator {
            background: var(--gradient-main);
            text-align: center;
            justify-content: center;
            align-items: center;
        }

        .slide-separator h2 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            max-width: 1000px;
        }

        .slide-separator.coral { background: var(--gradient-coral); }
        .slide-separator.mint { background: var(--gradient-mint); color: var(--dark); }

        /* Content Slides */
        .slide-content {
            background: var(--darker);
        }

        .slide-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--gradient-main);
        }

        .slide-header {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 35px;
            flex-shrink: 0;
        }

        .slide-icon {
            width: 75px;
            height: 75px;
            border-radius: 20px;
            background: var(--gradient-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            box-shadow: var(--glow);
            flex-shrink: 0;
        }

        .slide-content h2 {
            font-size: clamp(2rem, 3.5vw, 2.8rem);
            font-weight: 700;
            color: white;
        }

        .slide-body {
            flex: 1;
            display: flex;
            gap: 50px;
            min-height: 0;
            align-items: center;
        }

        .slide-body.vertical {
            flex-direction: column;
            justify-content: center;
            gap: 30px;
        }

        .slide-text {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .slide-text p {
            font-size: 1.4rem;
            line-height: 1.7;
            color: rgba(255,255,255,0.9);
            margin-bottom: 20px;
        }

        .slide-visual {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 0;
        }

        /* Feature List - Horizontal */
        .feature-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .feature-list li {
            font-size: 1.35rem;
            line-height: 1.6;
            color: rgba(255,255,255,0.9);
            padding-left: 40px;
            position: relative;
        }

        .feature-list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 10px;
            width: 14px;
            height: 14px;
            border-radius: 4px;
            background: var(--gradient-main);
        }

        .feature-list li:nth-child(2)::before { background: var(--coral); }
        .feature-list li:nth-child(3)::before { background: var(--mint); }
        .feature-list li:nth-child(4)::before { background: var(--yellow); }
        .feature-list li:nth-child(5)::before { background: var(--blue); }
        .feature-list li:nth-child(6)::before { background: var(--pink); }

        /* Horizontal Feature List */
        .feature-list.horizontal {
            flex-direction: row;
            flex-wrap: wrap;
            gap: 20px 40px;
        }

        .feature-list.horizontal li {
            flex: 1 1 calc(50% - 40px);
            min-width: 300px;
        }

        /* Cards Grid - Always horizontal */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
        }

        .cards-grid.cols-3 {
            grid-template-columns: repeat(3, 1fr);
        }

        .cards-grid.cols-5 {
            grid-template-columns: repeat(5, 1fr);
        }

        .cards-grid.cols-6 {
            grid-template-columns: repeat(6, 1fr);
        }

        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.08);
            border-color: var(--primary);
        }

        .card-icon {
            font-size: 2.8rem;
            margin-bottom: 12px;
        }

        .card h4 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: white;
        }

        .card p {
            font-size: 1.05rem;
            color: rgba(255,255,255,0.7);
            line-height: 1.5;
        }

        /* Stats Row */
        .stats-row {
            display: flex;
            gap: 30px;
            justify-content: center;
            width: 100%;
        }

        .stat-item {
            text-align: center;
            padding: 35px 50px;
            background: rgba(255,255,255,0.05);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            flex: 1;
            max-width: 220px;
        }

        .stat-number {
            font-size: 4rem;
            font-weight: 800;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.8);
            font-weight: 500;
        }

        /* Screenshot Container */
        .screenshot-container {
            background: rgba(0,0,0,0.4);
            border-radius: 16px;
            padding: 12px;
            box-shadow: var(--shadow);
            max-width: 480px;
            width: 100%;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .screenshot-container:hover {
            transform: scale(1.02);
        }

        .screenshot-header {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .screenshot-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff5f57;
        }
        .screenshot-dot:nth-child(2) { background: #febc2e; }
        .screenshot-dot:nth-child(3) { background: #28c840; }

        .screenshot-container img {
            width: 100%;
            border-radius: 8px;
            display: block;
        }

        .screenshot-label {
            text-align: center;
            margin-top: 12px;
            font-size: 1rem;
            color: var(--mint);
            font-weight: 500;
        }

        /* Comparison Table */
        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1.2rem;
        }

        .comparison-table th,
        .comparison-table td {
            padding: 20px 30px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .comparison-table th {
            background: rgba(102, 126, 234, 0.2);
            font-weight: 600;
            color: white;
            font-size: 1.25rem;
        }

        .comparison-table th:first-child { border-radius: 12px 0 0 0; }
        .comparison-table th:last-child { border-radius: 0 12px 0 0; }

        .comparison-table td {
            color: rgba(255,255,255,0.85);
        }

        .check { color: var(--green); font-weight: 700; }
        .cross { color: var(--coral); }

        /* Pyramid - Horizontal */
        .pyramid-horizontal {
            display: flex;
            gap: 15px;
            width: 100%;
            align-items: flex-end;
            justify-content: center;
            height: 300px;
        }

        .pyramid-bar {
            flex: 1;
            max-width: 180px;
            background: var(--gradient-main);
            border-radius: 16px 16px 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 20px 15px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .pyramid-bar:hover {
            transform: translateY(-10px);
        }

        .pyramid-bar:nth-child(1) { height: 100%; background: var(--gradient-main); }
        .pyramid-bar:nth-child(2) { height: 85%; background: rgba(102, 126, 234, 0.8); }
        .pyramid-bar:nth-child(3) { height: 70%; background: rgba(102, 126, 234, 0.6); }
        .pyramid-bar:nth-child(4) { height: 55%; background: rgba(102, 126, 234, 0.4); }
        .pyramid-bar:nth-child(5) { height: 40%; background: rgba(102, 126, 234, 0.25); }

        .pyramid-bar .icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .pyramid-bar .label {
            font-size: 0.95rem;
            font-weight: 500;
            line-height: 1.3;
        }

        /* Arguments Grid - Horizontal */
        .args-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .arg-card {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 25px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        .arg-card:hover {
            background: rgba(255,255,255,0.08);
            transform: translateX(5px);
        }

        .arg-num {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            background: var(--gradient-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .arg-card p {
            font-size: 1.2rem;
            line-height: 1.4;
            color: rgba(255,255,255,0.9);
        }

        /* Modules Grid */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
        }

        .module-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            padding: 22px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .module-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .module-num {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--mint);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .module-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .module-card h4 {
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            margin-bottom: 6px;
        }

        .module-card p {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.6);
        }

        /* Tools Grid */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
        }

        .tool-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .tool-card:hover {
            transform: scale(1.03);
            border-color: var(--mint);
        }

        .tool-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .tool-card h4 {
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            margin-bottom: 5px;
        }

        .tool-card p {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.6);
        }

        /* Two Columns */
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            width: 100%;
        }

        .column h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--mint);
        }

        .column h3.coral { color: var(--coral); }

        /* Plan List */
        .plan-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .plan-list li {
            font-size: 1.4rem;
            padding: 18px 25px;
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            border-left: 4px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }

        .plan-list li.active {
            background: rgba(102, 126, 234, 0.15);
            border-left-color: var(--primary);
            color: white;
        }

        .plan-list li.done {
            color: rgba(255,255,255,0.5);
            border-left-color: var(--green);
        }

        /* Portrait Section */
        .portrait-section {
            display: flex;
            gap: 50px;
            align-items: center;
            width: 100%;
        }

        .portrait-avatar {
            width: 180px;
            height: 180px;
            border-radius: 30px;
            background: var(--gradient-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            flex-shrink: 0;
        }

        .portrait-info {
            flex: 1;
        }

        .portrait-info h3 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: white;
        }

        /* Finish Slide */
        .slide-finish {
            background: var(--gradient-main);
            text-align: center;
            justify-content: center;
            align-items: center;
        }

        .slide-finish h2 {
            font-size: clamp(3rem, 5vw, 4.5rem);
            font-weight: 800;
            margin-bottom: 30px;
        }

        .slide-finish .key-message {
            font-size: 1.5rem;
            max-width: 900px;
            line-height: 1.6;
            opacity: 0.95;
            margin-bottom: 40px;
        }

        .slide-finish .badge {
            display: inline-block;
            padding: 18px 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.3rem;
            backdrop-filter: blur(10px);
        }

        /* Highlight */
        .highlight { color: var(--mint); font-weight: 600; }
        .highlight-coral { color: var(--coral); font-weight: 600; }
        .highlight-yellow { color: var(--yellow); font-weight: 600; }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 10px 20px;
            background: var(--gradient-main);
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
        }

        .badge.coral { background: var(--gradient-coral); }

        /* Lesson Structure - Timeline */
        .lesson-timeline {
            display: flex;
            gap: 15px;
            width: 100%;
            align-items: stretch;
        }

        .timeline-step {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 25px 20px;
            text-align: center;
            position: relative;
        }

        .timeline-step::after {
            content: '→';
            position: absolute;
            right: -20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.5rem;
            color: var(--primary);
        }

        .timeline-step:last-child::after {
            display: none;
        }

        .timeline-num {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--gradient-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0 auto 12px;
        }

        .timeline-step h4 {
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            margin-bottom: 8px;
        }

        .timeline-step p {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.7);
        }

        /* Results Grid */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            width: 100%;
        }

        .result-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            padding: 25px 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .result-card:hover {
            transform: translateY(-5px);
            border-color: var(--mint);
        }

        .result-card .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .result-card h4 {
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            margin-bottom: 8px;
        }

        .result-card p {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.7);
            line-height: 1.4;
        }

        /* Navigation */
        .nav-controls {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0,0,0,0.7);
            padding: 12px 25px;
            border-radius: 50px;
            backdrop-filter: blur(20px);
            z-index: 100;
        }

        .nav-btn {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: var(--primary);
            transform: scale(1.1);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .slide-counter {
            font-size: 1rem;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            min-width: 80px;
            text-align: center;
        }

        .progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 4px;
            background: var(--gradient-main);
            transition: width 0.3s ease;
            z-index: 100;
        }

        .fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 12px;
            background: rgba(0,0,0,0.5);
            color: white;
            cursor: pointer;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .fullscreen-btn:hover {
            background: var(--primary);
            transform: scale(1.1);
        }

        .keyboard-hint {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.5);
            z-index: 100;
        }

        .keyboard-hint kbd {
            display: inline-block;
            padding: 5px 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            font-family: inherit;
            margin: 0 3px;

        .modal {

            display: flex;
            align-items: center;

            opacity: 0;

            transition: all 0.3s ease;

            max-width: 90%;
            max-height: 90%;
            position: relative;
        }

            max-width: 100%;
            max-height: 85vh;
            border-radius: 16px;
            box-shadow: var(--shadow);

            text-align: center;
            margin-top: 20px;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .modal-close {
            position: absolute;
            top: -50px;
            right: 0;
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            color: white;
            cursor: pointer;
            font-size: 1.6rem;
            transition: all 0.3s ease;

        let currentSlideIndex = 0;
        const totalSlides = slides.length;

        function generateSlides() {
            const wrapper = document.getElementById('slidesWrapper');
            
            slides.forEach((slide, index) => {
                const slideEl = document.createElement('div');
                slideEl.className = `slide slide-${slide.type}${slide.variant ? ' ' + slide.variant : ''}`;
                slideEl.dataset.index = index;
                
                if (index === 0) slideEl.classList.add('active');
                
                if (slide.type === 'cover') {
                    slideEl.innerHTML = `
                        <div class="logo">${slide.logo}</div>
                        <h1>${slide.title}</h1>
                        <p class="subtitle">${slide.subtitle}</p>
                    `;
                } else if (slide.type === 'separator') {
                    slideEl.innerHTML = `<h2>${slide.title}</h2>`;
                } else if (slide.type === 'content') {
                    slideEl.innerHTML = `
                        <div class="slide-header">
                            <div class="slide-icon">${slide.icon}</div>
                            <h2>${slide.title}</h2>
                        </div>
                        ${slide.body}
                    `;
                } else if (slide.type === 'finish') {
                    slideEl.innerHTML = `
                        <h2>${slide.title}</h2>
                        <p style="font-size: 1.5rem; margin: 30px 0; opacity: 0.9;">${slide.message}</p>
                        <p class="key-message">${slide.keyMessage}</p>
                        <div class="badge">${slide.badge}</div>
                    `;
                }
                
                wrapper.appendChild(slideEl);
            });
            
            document.getElementById('totalSlides').textContent = totalSlides;
        }

        function goToSlide(index) {
            if (index < 0 || index >= totalSlides) return;
            
            const allSlides = document.querySelectorAll('.slide');
            const prevSlide = allSlides[currentSlideIndex];
            const nextSlide = allSlides[index];
            
            if (index > currentSlideIndex) {
                prevSlide.classList.add('prev');
            }
            
            prevSlide.classList.remove('active');
            nextSlide.classList.remove('prev');
            nextSlide.classList.add('active');
            
            currentSlideIndex = index;
            updateUI();
        }

        function nextSlide() { goToSlide(currentSlideIndex + 1); }
        function prevSlide() { goToSlide(currentSlideIndex - 1); }

        function updateUI() {
            document.getElementById('currentSlide').textContent = currentSlideIndex + 1;
            document.getElementById('prevBtn').disabled = currentSlideIndex === 0;
            document.getElementById('nextBtn').disabled = currentSlideIndex === totalSlides - 1;
            document.getElementById('progressBar').style.width = ((currentSlideIndex + 1) / totalSlides * 100) + '%';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        function openModal(tool) {
            const modal = document.getElementById('screenshotModal');
            const img = document.getElementById('modalImage');
            const title = document.getElementById('modalTitle');
            
            // no screenshot survived for these tools, so the modal stays shut
            if (screenshots[tool] && screenshots[tool].src) {
                img.src = screenshots[tool].src;
                title.textContent = screenshots[tool].title;
                modal.classList.add('active');
            }
        }

        function closeModal() {
            document.getElementById('screenshotModal').classList.remove('active');
        }

        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); nextSlide(); break;
                case 'ArrowLeft': case 'PageUp': e.preventDefault(); prevSlide(); break;
                case 'Home': e.preventDefault(); goToSlide(0); break;
                case 'End': e.preventDefault(); goToSlide(totalSlides - 1); break;
                case 'f': case 'F': toggleFullscreen(); break;
                case 'Escape': closeModal(); break;
            }
        });

        generateSlides();
        updateUI();
    </script>
