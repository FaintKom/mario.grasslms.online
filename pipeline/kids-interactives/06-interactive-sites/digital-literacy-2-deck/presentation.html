<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Literacy 2.0 — Algonova | Презентация</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --coral: #FF6B6B;
            --coral-dark: #ee5a5a;
            --mint: #4ECDC4;
            --mint-dark: #3dbdb5;
            --yellow: #FFE66D;
            --blue: #74B9FF;
            --pink: #FD79A8;
            --green: #00B894;
            --dark: #1a1a2e;
            --darker: #0f0f1a;
            --light: #F8F9FA;
            --gray: #636E72;
            --gradient-main: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-coral: linear-gradient(135deg, #FF6B6B 0%, #ee5a5a 100%);
            --gradient-mint: linear-gradient(135deg, #4ECDC4 0%, #38f9d7 100%);
            --gradient-dark: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            --shadow: 0 25px 80px rgba(0,0,0,0.4);
            --glow: 0 0 60px rgba(102, 126, 234, 0.3);
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--gradient-dark);
            color: white;
        }

        /* Presentation Container */
        .presentation {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Slides Wrapper */
        .slides-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Individual Slide */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 80px;
            opacity: 0;
            visibility: hidden;
            transform: translateX(100px);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }

        .slide.prev {
            transform: translateX(-100px);
        }

        /* Slide Types */
        .slide-cover {
            background: var(--gradient-dark);
            text-align: center;
        }

        .slide-cover::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 70% 70%, rgba(118, 75, 162, 0.1) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-20px, -20px) rotate(5deg); }
        }

        .slide-cover .logo {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--mint);
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .slide-cover h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #a8edea 50%, #fed6e3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
            line-height: 1.2;
        }

        .slide-cover .subtitle {
            font-size: 1.4rem;
            font-weight: 400;
            opacity: 0.8;
            position: relative;
            z-index: 1;
        }

        /* Separator Slides */
        .slide-separator {
            background: var(--gradient-main);
            text-align: center;
        }

        .slide-separator h2 {
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 700;
            max-width: 900px;
        }

        .slide-separator.coral { background: var(--gradient-coral); }
        .slide-separator.mint { background: var(--gradient-mint); color: var(--dark); }

        /* Content Slides */
        .slide-content {
            background: var(--darker);
            align-items: flex-start;
        }

        .slide-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient-main);
        }

        .slide-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 50px;
            width: 100%;
        }

        .slide-icon {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            background: var(--gradient-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: var(--glow);
            flex-shrink: 0;
        }

        .slide-content h2 {
            font-size: clamp(1.8rem, 3vw, 2.5rem);
            font-weight: 700;
            color: white;
        }

        .slide-body {
            display: flex;
            gap: 60px;
            width: 100%;
            flex: 1;
            align-items: center;
        }

        .slide-text {
            flex: 1;
        }

        .slide-text p {
            font-size: 1.15rem;
            line-height: 1.8;
            color: rgba(255,255,255,0.85);
            margin-bottom: 20px;
        }

        .slide-text strong {
            color: var(--mint);
            font-weight: 600;
        }

        .slide-visual {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Lists */
        .feature-list {
            list-style: none;
        }

        .feature-list li {
            font-size: 1.15rem;
            line-height: 1.8;
            color: rgba(255,255,255,0.85);
            padding-left: 35px;
            position: relative;
            margin-bottom: 15px;
        }

        .feature-list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 10px;
            width: 12px;
            height: 12px;
            border-radius: 4px;
            background: var(--gradient-main);
        }

        .feature-list li:nth-child(2)::before { background: var(--coral); }
        .feature-list li:nth-child(3)::before { background: var(--mint); }
        .feature-list li:nth-child(4)::before { background: var(--yellow); }
        .feature-list li:nth-child(5)::before { background: var(--blue); }
        .feature-list li:nth-child(6)::before { background: var(--pink); }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
        }

        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.08);
            border-color: var(--primary);
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .card h4 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: white;
        }

        .card p {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.7);
            line-height: 1.6;
        }

        /* Stats */
        .stats-row {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .stat-item {
            text-align: center;
            padding: 30px 40px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            min-width: 180px;
        }

        .stat-number {
            font-size: 3.5rem;
            font-weight: 800;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 1rem;
            color: rgba(255,255,255,0.7);
            font-weight: 500;
        }

        /* Screenshot Container */
        .screenshot-container {
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 15px;
            box-shadow: var(--shadow);
            max-width: 500px;
            width: 100%;
        }

        .screenshot-header {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .screenshot-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff5f57;
        }
        .screenshot-dot:nth-child(2) { background: #febc2e; }
        .screenshot-dot:nth-child(3) { background: #28c840; }

        .screenshot-container img {
            width: 100%;
            border-radius: 8px;
            display: block;
        }

        .screenshot-label {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.6);
            font-weight: 500;
        }

        /* Comparison Table */
        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1rem;
        }

        .comparison-table th,
        .comparison-table td {
            padding: 18px 25px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .comparison-table th {
            background: rgba(102, 126, 234, 0.2);
            font-weight: 600;
            color: white;
        }

        .comparison-table th:first-child {
            border-radius: 12px 0 0 0;
        }

        .comparison-table th:last-child {
            border-radius: 0 12px 0 0;
        }

        .comparison-table td {
            color: rgba(255,255,255,0.8);
        }

        .comparison-table tr:hover td {
            background: rgba(255,255,255,0.03);
        }

        .check {
            color: var(--green);
            font-weight: 700;
        }

        .cross {
            color: var(--coral);
        }

        /* Pyramid */
        .pyramid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 700px;
        }

        .pyramid-level {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 18px 30px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .pyramid-level:nth-child(1) {
            background: var(--gradient-main);
            width: 100%;
        }
        .pyramid-level:nth-child(2) {
            background: rgba(102, 126, 234, 0.7);
            width: 85%;
        }
        .pyramid-level:nth-child(3) {
            background: rgba(102, 126, 234, 0.5);
            width: 70%;
        }
        .pyramid-level:nth-child(4) {
            background: rgba(102, 126, 234, 0.35);
            width: 55%;
        }
        .pyramid-level:nth-child(5) {
            background: rgba(102, 126, 234, 0.2);
            width: 40%;
        }

        .pyramid-level:hover {
            transform: scale(1.02);
        }

        /* Arguments Grid */
        .args-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .arg-card {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            padding: 25px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        .arg-card:hover {
            background: rgba(255,255,255,0.08);
            transform: translateX(5px);
        }

        .arg-num {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: var(--gradient-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .arg-card p {
            font-size: 1.1rem;
            line-height: 1.5;
            color: rgba(255,255,255,0.85);
        }

        /* Module Cards */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
        }

        .module-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .module-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .module-num {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .module-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        .module-card h4 {
            font-size: 1rem;
            font-weight: 600;
            color: white;
            margin-bottom: 8px;
        }

        .module-card p {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.6);
        }

        /* Tools Grid */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            width: 100%;
        }

        .tool-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .tool-card:hover {
            transform: scale(1.03);
            border-color: var(--mint);
        }

        .tool-card.has-screenshot {
            cursor: pointer;
        }

        .tool-card.has-screenshot::after {
            content: '👁️ Превью';
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 0.7rem;
            color: var(--mint);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .tool-card.has-screenshot:hover::after {
            opacity: 1;
        }

        .tool-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .tool-card h4 {
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            margin-bottom: 8px;
        }

        .tool-card p {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.6);
        }

        /* Finish Slide */
        .slide-finish {
            background: var(--gradient-main);
            text-align: center;
        }

        .slide-finish h2 {
            font-size: clamp(2.5rem, 4vw, 4rem);
            font-weight: 800;
            margin-bottom: 30px;
        }

        .slide-finish .key-message {
            font-size: 1.3rem;
            max-width: 800px;
            line-height: 1.7;
            opacity: 0.95;
            margin-bottom: 40px;
        }

        .slide-finish .badge {
            display: inline-block;
            padding: 15px 35px;
            background: rgba(255,255,255,0.2);
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            backdrop-filter: blur(10px);
        }

        /* Navigation */
        .nav-controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0,0,0,0.6);
            padding: 12px 25px;
            border-radius: 50px;
            backdrop-filter: blur(20px);
            z-index: 100;
        }

        .nav-btn {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: var(--primary);
            transform: scale(1.1);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .nav-btn:disabled:hover {
            background: rgba(255,255,255,0.1);
            transform: none;
        }

        .slide-counter {
            font-size: 0.9rem;
            font-weight: 600;
            color: rgba(255,255,255,0.8);
            min-width: 80px;
            text-align: center;
        }

        /* Progress Bar */
        .progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 4px;
            background: var(--gradient-main);
            transition: width 0.3s ease;
            z-index: 100;
        }

        /* Fullscreen Button */
        .fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 12px;
            background: rgba(0,0,0,0.5);
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .fullscreen-btn:hover {
            background: var(--primary);
            transform: scale(1.1);
        }

        /* Keyboard Hints */
        .keyboard-hint {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
            z-index: 100;
        }

        .keyboard-hint kbd {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            font-family: 'Space Mono', monospace;
            margin: 0 3px;
        }

        /* Screenshot Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        .modal-title {
            text-align: center;
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .modal-close {
            position: absolute;
            top: -50px;
            right: 0;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            color: white;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: var(--coral);
        }

        /* Highlight text */
        .highlight {
            color: var(--mint);
            font-weight: 600;
        }

        .highlight-coral {
            color: var(--coral);
            font-weight: 600;
        }

        .highlight-yellow {
            color: var(--yellow);
            font-weight: 600;
        }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 8px 16px;
            background: var(--gradient-main);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Two Column Layout */
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            width: 100%;
        }

        .column h3 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--mint);
        }

        /* Plan List */
        .plan-list {
            list-style: none;
        }

        .plan-list li {
            font-size: 1.2rem;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .plan-list li.active {
            color: var(--mint);
            font-weight: 600;
        }

        .plan-list li.done {
            color: rgba(255,255,255,0.5);
        }

        .plan-list li.done::before {
            content: '✓';
            color: var(--green);
        }

        /* Portrait Card */
        .portrait-section {
            display: flex;
            gap: 50px;
            align-items: flex-start;
            width: 100%;
        }

        .portrait-avatar {
            width: 200px;
            height: 200px;
            border-radius: 30px;
            background: var(--gradient-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6rem;
            flex-shrink: 0;
        }

        .portrait-info {
            flex: 1;
        }

        .portrait-info h3 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: white;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .slide {
                padding: 40px 50px;
            }

            .modules-grid,
            .tools-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .slide {
                padding: 30px;
            }

            .slide-body {
                flex-direction: column;
            }

            .two-columns {
                grid-template-columns: 1fr;
            }

            .modules-grid,
            .tools-grid,
            .cards-grid {
                grid-template-columns: 1fr;
            }

            .keyboard-hint {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="presentation">
        <div class="slides-wrapper" id="slidesWrapper">
            <!-- Slides will be generated by JavaScript -->
        </div>
    </div>

    <!-- Navigation -->
    <div class="nav-controls">
        <button class="nav-btn" id="prevBtn" onclick="prevSlide()">←</button>
        <span class="slide-counter"><span id="currentSlide">1</span> / <span id="totalSlides">51</span></span>
        <button class="nav-btn" id="nextBtn" onclick="nextSlide()">→</button>
    </div>

    <!-- Progress Bar -->

        // State
        let currentSlide = 0;
        const totalSlides = PRESENTATION_DATA.slides.length;

        // Generate slides
        function generateSlides() {
            const wrapper = document.getElementById('slidesWrapper');
            
            PRESENTATION_DATA.slides.forEach((slide, index) => {
                const slideEl = document.createElement('div');
                slideEl.className = `slide slide-${slide.type}${slide.variant ? ' ' + slide.variant : ''}`;
                slideEl.dataset.index = index;
                
                if (index === 0) slideEl.classList.add('active');
                
                slideEl.innerHTML = getSlideContent(slide);
                wrapper.appendChild(slideEl);
            });
            
            document.getElementById('totalSlides').textContent = totalSlides;
        }

        function getSlideContent(slide) {
            switch(slide.type) {
                case 'cover':
                    return `
                        <div class="logo">${slide.content.logo}</div>
                        <h1>${slide.content.title}</h1>
                        <p class="subtitle">${slide.content.subtitle}</p>
                    `;
                case 'separator':
                    return `<h2>${slide.content.title}</h2>`;
                case 'content':
                    return `
                        <div class="slide-header">
                            <div class="slide-icon">${slide.content.icon}</div>
                            <h2>${slide.content.title}</h2>
                        </div>
                        <div class="slide-content-inner">
                            ${slide.content.body}
                        </div>
                    `;
                case 'finish':
                    return `
                        <h2>${slide.content.title}</h2>
                        <p style="font-size: 1.3rem; margin: 30px 0; opacity: 0.9;">${slide.content.message.replace(/\n/g, '<br>')}</p>
                        <p class="key-message">${slide.content.keyMessage}</p>
                        <div class="badge">${slide.content.badge}</div>
                    `;
                default:
                    return '';
            }
        }

        // Navigation
        function goToSlide(index) {
            if (index < 0 || index >= totalSlides) return;
            
            const slides = document.querySelectorAll('.slide');
            const prevSlide = slides[currentSlide];
            const nextSlide = slides[index];
            
            if (index > currentSlide) {
                prevSlide.classList.add('prev');
            }
            
            prevSlide.classList.remove('active');
            nextSlide.classList.remove('prev');
            nextSlide.classList.add('active');
            
            currentSlide = index;
            updateUI();
        }

        function nextSlide() {
            goToSlide(currentSlide + 1);
        }

        function prevSlide() {
            goToSlide(currentSlide - 1);
        }

        function updateUI() {
            document.getElementById('currentSlide').textContent = currentSlide + 1;
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').disabled = currentSlide === totalSlides - 1;
            
            const progress = ((currentSlide + 1) / totalSlides) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        // Fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        // Modal
        function openModal(tool) {
            const modal = document.getElementById('screenshotModal');
            const img = document.getElementById('modalImage');
            const title = document.getElementById('modalTitle');
            
            // no screenshot survived for these tools, so the modal stays shut
            if (screenshots[tool] && screenshots[tool].src) {
                img.src = screenshots[tool].src;
                title.textContent = screenshots[tool].title;
                modal.classList.add('active');
            }
        }

        function closeModal() {
            document.getElementById('screenshotModal').classList.remove('active');
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowRight':
                case ' ':
                case 'PageDown':
                    e.preventDefault();
                    nextSlide();
                    break;
                case 'ArrowLeft':
                case 'PageUp':
                    e.preventDefault();
                    prevSlide();
                    break;
                case 'Home':
                    e.preventDefault();
                    goToSlide(0);
                    break;
                case 'End':
                    e.preventDefault();
                    goToSlide(totalSlides - 1);
                    break;
                case 'f':
                case 'F':
                    toggleFullscreen();
                    break;
                case 'Escape':
                    closeModal();
                    break;
            }
        });

        // Initialize
        generateSlides();
        updateUI();
    </script>
