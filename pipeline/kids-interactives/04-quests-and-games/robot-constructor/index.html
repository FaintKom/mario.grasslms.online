<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;700&display=swap">

<style>
/* Built from _shared/grasslms.css — edit that file, then run _shared/build.py */
/* ==========================================================================
   GrassLMS · Lively v2 — shared layer for standalone kid-facing activities
   Tokens lifted from lms2.9/frontend/src/app/globals.css (v2.0.0, 2026-08-02)
   and DESIGN_SPEC.md. Light only, exactly as the spec says.
   Never a raw hex inside a component — always a token.

   Load order in a page: link this file first, then the page's own style block
   with only what that one activity genuinely needs on top. Run _shared/build.py
   to fold this file into each page as a self-contained block.

   Note for future edits: nothing in this file may contain a literal closing
   style tag, not even inside a CSS comment. The build inlines this text into a
   style element, and an HTML parser ends that element at the first such tag it
   sees — comments do not protect it. A stray one dumps the whole stylesheet
   onto the page as visible text.
   ========================================================================== */

:root {
  --green-25:  #f4fbef;
  --green-50:  #ecf9e7;
  --green-100: #d4f1c4;
  --green-200: #b6e69e;
  --green-300: #8fd770;
  --green-400: #34a06a;
  --green-500: #17915e;
  --green-600: #0a8754;
  --green-700: #07683f;
  --green-800: #054d2f;
  --green-900: #0a3d24;

  --sun-50:  #fffbe5;
  --sun-100: #fff2b3;
  --sun-300: #ffe066;
  --sun-400: #ffd84d;
  --sun-500: #f5b800;
  --sun-700: #7a5500;

  --clay-50:  #fdefe7;
  --clay-100: #fbd8c7;
  --clay-300: #f6b394;
  --clay-500: #e2552f;
  --clay-600: #c1401d;
  --clay-700: #9e300f;

  --lagoon-50:  #e4f1f4;
  --lagoon-200: #b9d9e0;
  --lagoon-400: #3aa0b5;
  --lagoon-600: #12798f;
  --lagoon-800: #0a4652;

  --ink-50:  #f3f5ef;
  --ink-100: #e3e8dd;
  --ink-200: #c4cdbe;
  --ink-300: #93a08d;
  --ink-400: #6a7568;
  --ink-500: #485444;
  --ink-700: #232b22;
  --ink-900: #0d150d;

  --paper:   #fbfcf7;
  --paper-2: #ffffff;

  /* ---- SEMANTIC — components read these, never the ramps above -------- */
  --color-bg:            var(--paper);
  --color-surface:       var(--paper-2);
  --color-surface-2:     var(--ink-50);

  --color-text:          var(--ink-900);
  --color-text-muted:    var(--ink-500);
  --color-text-subtle:   var(--ink-400);
  --color-text-inverse:  #ffffff;

  --color-border:        var(--ink-100);
  --color-border-strong: var(--ink-200);
  --color-border-focus:  var(--green-500);

  --color-primary:       var(--green-600);
  --color-primary-hover: var(--green-700);
  --color-primary-soft:  var(--green-100);
  --color-primary-fg:    #ffffff;

  --color-reward:      var(--sun-400);
  --color-reward-soft: var(--sun-100);
  --color-reward-fg:   var(--sun-700);

  --color-success:      var(--green-600);
  --color-success-soft: var(--green-50);
  --color-success-fg:   var(--green-800);

  --color-danger:      var(--clay-500);
  --color-danger-soft: var(--clay-50);
  --color-danger-fg:   var(--clay-700);

  --color-info:      var(--lagoon-600);
  --color-info-soft: var(--lagoon-50);
  --color-info-fg:   var(--lagoon-800);

  /* ---- ELEVATION — the pop is a sharp solid offset, never a blur ------ */
  --shadow-xs: 0 1px 2px rgba(13, 21, 13, .05);
  --shadow-sm: 0 2px 6px -1px rgba(13, 21, 13, .07);
  --shadow-md: 0 8px 24px -8px rgba(13, 21, 13, .14);
  --shadow-lg: 0 18px 50px -20px rgba(13, 21, 13, .20);
  --ring-focus: 0 0 0 4px var(--green-100);

  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  --radius-pill: 999px;

  --s-1: 4px;  --s-2: 8px;  --s-3: 12px;  --s-4: 16px;  --s-5: 20px;
  --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px; --s-16: 64px;

  --control-sm: 36px;
  --control-md: 44px;   /* minimum touch target — a child's finger */
  --control-lg: 52px;

  --font-sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  --t-2xs: 11px; --t-xs: 12px; --t-sm: 13px; --t-base: 15px; --t-md: 17px;
  --t-lg: 20px;  --t-xl: 24px; --t-2xl: 32px; --t-3xl: 44px; --t-4xl: 60px;

  --tracking-display: -.035em;
  --tracking-heading: -.025em;
  --tracking-eyebrow: .12em;
  --leading-body: 1.65;

  /* Page gutters, as tokens: the activities that pin themselves to the
     viewport subtract --page-pad, so the two can never drift apart. */
  --page-top: 16px;
  --page-bottom: 20px;
  --page-pad: 36px;

  --motion-fast: 120ms;
  --motion-base: 200ms;
  --motion-ease: cubic-bezier(.2, .8, .3, 1);
}

/* ---- BASE -------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--t-base);
  line-height: var(--leading-body);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  margin: 0;
  font-weight: 800;
  letter-spacing: var(--tracking-heading);
  line-height: 1.15;
  text-wrap: balance;
  color: var(--color-text);          /* headings are never green */
}
h1 { font-size: clamp(var(--t-2xl), 5vw, var(--t-3xl)); letter-spacing: var(--tracking-display); }
h2 { font-size: clamp(var(--t-xl), 3.4vw, var(--t-2xl)); }
h3 { font-size: var(--t-lg); font-weight: 700; }
h4 { font-size: var(--t-md); font-weight: 700; }
p  { margin: 0; }

a { color: var(--color-info); text-decoration-thickness: 1px; text-underline-offset: 2px; }

/* The one typographic flourish: a sun marker on a single word of a heading.
   Never a UI background — the spec is explicit about that.

   The colour is pinned, not inherited. The background is always the same
   yellow, so the ink has to be always the same dark: on a night page the
   heading colour is near-white, and white on sun-300 cannot be read. */
.mark {
  background: var(--sun-300);
  color: var(--ink-900);
  padding: 0 var(--s-2);
  border-radius: var(--s-2);
  transform: rotate(-1deg);
  display: inline-block;
  font-style: normal;
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  text-transform: uppercase;
  letter-spacing: var(--tracking-eyebrow);
  font-weight: 500;
  color: var(--color-text-subtle);
}

.lede  { font-size: var(--t-md); color: var(--color-text-muted); max-width: 62ch; }
.muted { color: var(--color-text-muted); }
.mono  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---- LAYOUT ------------------------------------------------------------ */
.wrap { max-width: 960px; margin: 0 auto; padding: 0 clamp(var(--s-4), 4vw, var(--s-8)); }
.wrap--narrow { max-width: 680px; }
.wrap--wide   { max-width: 1180px; }
.stack { display: flex; flex-direction: column; gap: var(--s-4); }
.stack--tight { gap: var(--s-2); }
.stack--loose { gap: var(--s-8); }
.row { display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap; }
.row--between { justify-content: space-between; }
.center { display: grid; place-items: center; }

/* ---- BUTTONS — signature shadow-pop physics ---------------------------- */
.btn {
  --pop: var(--green-700);
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s-2);
  min-height: var(--control-md);
  padding: var(--s-3) var(--s-5);
  border: 0;
  border-radius: var(--radius-md);
  background: var(--color-primary);
  color: var(--color-primary-fg);
  font-family: inherit;
  font-size: var(--t-sm);
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 4px 0 0 var(--pop);
  transition:
    transform var(--motion-fast) var(--motion-ease),
    box-shadow var(--motion-fast) var(--motion-ease),
    background-color var(--motion-fast) var(--motion-ease);
}
.btn:hover:not(:disabled)  { transform: translateY(2px); box-shadow: 0 2px 0 0 var(--pop); background: var(--color-primary-hover); }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 0 var(--pop); }
.btn:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none !important; }

.btn--secondary { --pop: var(--ink-100); background: var(--color-surface); color: var(--color-text); }
.btn--secondary:hover:not(:disabled) { background: var(--ink-50); }
.btn--danger { --pop: var(--clay-700); background: var(--color-danger); }
.btn--danger:hover:not(:disabled) { background: var(--clay-600); }
.btn--sun { --pop: var(--sun-500); background: var(--sun-400); color: var(--ink-900); }
.btn--sun:hover:not(:disabled) { background: var(--sun-300); }
.btn--ink { --pop: var(--ink-900); background: var(--ink-700); }
.btn--ink:hover:not(:disabled) { background: var(--ink-900); }

.btn--ghost { box-shadow: none; background: transparent; color: var(--ink-700); }
.btn--ghost:hover:not(:disabled)  { background: var(--ink-50); transform: none; box-shadow: none; }
.btn--ghost:active:not(:disabled) { transform: none; box-shadow: none; }

.btn--sm { min-height: var(--control-sm); padding: var(--s-2) var(--s-4); font-size: var(--t-xs); border-radius: var(--radius-sm); }
.btn--lg { min-height: var(--control-lg); padding: var(--s-4) var(--s-6); font-size: var(--t-base); border-radius: var(--radius-lg); }
.btn--icon  { padding: 0; width: var(--control-md); height: var(--control-md); }
.btn--block { width: 100%; }

/* ---- SURFACES ---------------------------------------------------------- */
.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--s-5);
  box-shadow: var(--shadow-sm);
}
.card--flat { box-shadow: none; }
.panel { background: var(--color-surface-2); border-radius: var(--radius-md); padding: var(--s-4); }

/* ---- CHIPS ------------------------------------------------------------- */
.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--s-1);
  padding: var(--s-1) var(--s-3);
  border-radius: var(--radius-pill);
  background: var(--color-surface-2);
  color: var(--color-text-muted);
  font-size: var(--t-xs);
  font-weight: 600;
  white-space: nowrap;
}
.chip--reward  { background: var(--color-reward-soft);  color: var(--color-reward-fg); }
.chip--success { background: var(--color-success-soft); color: var(--color-success-fg); }
.chip--danger  { background: var(--color-danger-soft);  color: var(--color-danger-fg); }
.chip--info    { background: var(--color-info-soft);    color: var(--color-info-fg); }

/* ---- INPUTS ------------------------------------------------------------ */
.input, .select, .textarea {
  width: 100%;
  min-height: var(--control-md);
  padding: var(--s-3) var(--s-4);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  color: var(--color-text);
  font-family: inherit;
  font-size: var(--t-base);
}
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--color-border-focus);
  box-shadow: var(--ring-focus);
}
.label { display: block; font-size: var(--t-sm); font-weight: 600; margin-bottom: var(--s-2); }

/* ---- PROGRESS ---------------------------------------------------------- */
.progress { height: 10px; border-radius: var(--radius-pill); background: var(--ink-100); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--color-primary); border-radius: inherit; transition: width var(--motion-base) var(--motion-ease); }

.steps { display: flex; gap: var(--s-2); }
.steps > i { flex: 1; height: 6px; border-radius: var(--radius-pill); background: var(--ink-100); }
.steps > i.is-done    { background: var(--color-primary); }
.steps > i.is-current { background: var(--sun-400); }

/* ---- ACTIVITY PRIMITIVES — what every game here shares ----------------- */
.hud {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--s-4); flex-wrap: wrap;
  padding: var(--s-3) var(--s-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
}
.hud__score { font-family: var(--font-mono); font-size: var(--t-lg); font-weight: 700; font-variant-numeric: tabular-nums; }

.lives { display: inline-flex; gap: var(--s-1); }
.lives > i { width: 10px; height: 10px; border-radius: var(--radius-pill); background: var(--color-primary); }
.lives > i.is-spent { background: var(--ink-200); }

/* Draggable token and its target, sized for a finger per the tablet rule. */
.token {
  display: inline-flex; align-items: center; gap: var(--s-2);
  min-height: var(--control-md);
  padding: var(--s-2) var(--s-4);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  border: 1px solid var(--color-border-strong);
  box-shadow: var(--shadow-xs);
  cursor: grab;
  touch-action: none;
  user-select: none;
  font-weight: 600;
}
.token:active { cursor: grabbing; }
.token.is-dragging { opacity: .5; }

.dropzone {
  min-height: var(--control-lg);
  padding: var(--s-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius-md);
  background: var(--color-surface-2);
  transition: border-color var(--motion-fast) var(--motion-ease), background var(--motion-fast) var(--motion-ease);
}
.dropzone.is-over { border-color: var(--color-primary); background: var(--color-primary-soft); }

/* Verdict — colour is never the only signal; pair it with a mark or a word. */
.is-correct { border-color: var(--color-success) !important; background: var(--color-success-soft) !important; }
.is-wrong   { border-color: var(--color-danger)  !important; background: var(--color-danger-soft)  !important; }

.feedback { display: flex; gap: var(--s-3); padding: var(--s-4); border-radius: var(--radius-md); font-weight: 600; }
.feedback--ok   { background: var(--color-success-soft); color: var(--color-success-fg); }
.feedback--no   { background: var(--color-danger-soft);  color: var(--color-danger-fg); }
.feedback--hint { background: var(--color-info-soft);    color: var(--color-info-fg); font-weight: 500; }

/* ---- OPTION — the tap target for any multiple-choice answer ------------ */
.option {
  display: flex; align-items: center; gap: var(--s-3);
  width: 100%;
  min-height: 64px;                 /* the tablet rule, written down */
  padding: var(--s-3) var(--s-4);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  color: var(--color-text);
  font: inherit;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  transition: border-color var(--motion-fast) var(--motion-ease), background var(--motion-fast) var(--motion-ease);
}
.option:hover:not(:disabled) { border-color: var(--color-border-focus); }
.option:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }
.option.is-selected { border-color: var(--color-primary); background: var(--color-primary-soft); }
.option:disabled { cursor: default; }

/* ---- MODAL ------------------------------------------------------------- */
.scrim {
  position: fixed; inset: 0; z-index: 50;
  display: grid; place-items: center;
  padding: var(--s-4);
  background: rgba(13, 21, 13, .45);
}
.modal {
  width: min(480px, 100%);
  background: var(--color-surface);
  border-radius: var(--radius-xl);
  padding: var(--s-6);
  box-shadow: var(--shadow-lg);
  text-align: center;
}

/* ---- LANGUAGE SWITCH — two languages, English first -------------------- */
.langs { display: inline-flex; gap: var(--s-1); padding: var(--s-1); background: var(--color-surface-2); border-radius: var(--radius-pill); }
.langs button {
  min-height: var(--control-sm);
  padding: 0 var(--s-4);
  border: 0; border-radius: var(--radius-pill);
  background: transparent;
  color: var(--color-text-muted);
  font: inherit; font-size: var(--t-xs); font-weight: 700;
  cursor: pointer;
}
.langs button[aria-pressed="true"] { background: var(--color-surface); color: var(--color-text); box-shadow: var(--shadow-xs); }
.langs button:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }

/* ---- A11Y -------------------------------------------------------------- */
.visually-hidden {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    transition-duration: .001ms !important;
  }
  .btn:hover, .btn:active { transform: none; }
}

/* ---- NIGHT ------------------------------------------------------------- */
/* Not a dark mode. The spec is light-only and stays that way; this is a
   palette for pages whose subject is genuinely dark — the space scenes, where
   painting a starfield onto warm paper would fight the picture. Put
   data-night on <html> or on one section. Only the semantic aliases move; the
   ramps and every component below them are untouched, so a button keeps the
   same physics and a card keeps the same radius. */
[data-night] {
  --color-bg:            #070d12;
  --color-surface:       #0e1720;
  --color-surface-2:     #16222e;

  --color-text:          #eef4f1;
  --color-text-muted:    #b3c2c9;
  --color-text-subtle:   #7f929c;
  --color-text-inverse:  #070d12;

  --color-border:        #23323f;
  --color-border-strong: #35485a;
  --color-border-focus:  var(--green-300);

  --color-primary:       var(--green-400);
  --color-primary-hover: var(--green-300);
  --color-primary-soft:  #14342a;
  --color-primary-fg:    #041109;

  --color-reward:      var(--sun-300);
  --color-reward-soft: #3a3111;
  --color-reward-fg:   var(--sun-300);

  --color-success:      var(--green-300);
  --color-success-soft: #12301f;
  --color-success-fg:   var(--green-300);

  --color-danger:      var(--clay-300);
  --color-danger-soft: #3a1d13;
  --color-danger-fg:   var(--clay-300);

  --color-info:      var(--lagoon-400);
  --color-info-soft: #0d2b33;
  --color-info-fg:   var(--lagoon-200);

  --ring-focus: 0 0 0 4px #14342a;
}

/* The pop shadow needs a colour that reads against a dark ground. */
[data-night] .btn { --pop: #041109; }

/* These two variants name ramp colours directly rather than semantic aliases,
   so the night palette cannot reach them: a ghost button would be near-black
   ink on a near-black page, and a secondary button would flash a white panel
   under white text on hover. */
[data-night] .btn--ghost { color: var(--color-text-muted); }
[data-night] .btn--ghost:hover:not(:disabled) { background: rgba(255, 255, 255, .08); }
[data-night] .btn--secondary { --pop: #23323f; }
[data-night] .btn--secondary:hover:not(:disabled) { background: var(--color-surface-2); }

/* ---- SHORT SCREENS ------------------------------------------------------ */
/* A 1366x768 laptop leaves roughly 660px once the browser has taken its share,
   and every activity here is meant to land whole on one screen. Below 760px of
   viewport the heading block and the card padding give up some of their air so
   the working part stays above the fold. Nothing moves, nothing hides — the
   same layout, breathing a little less. */
@media (max-height: 760px) {
  :root { --page-top: 12px; --page-bottom: 14px; --page-pad: 26px; }
  h1 { font-size: var(--t-xl); }
  h2 { font-size: var(--t-lg); }
  .lede { font-size: var(--t-sm); }
  .stack { gap: var(--s-3); }
  .stack--loose { gap: var(--s-3); }
  .stack--tight { gap: var(--s-1); }
  .card { padding: var(--s-4); }
  .hud { padding: var(--s-2) var(--s-3); }
  body { padding-bottom: var(--s-4); }
}

/* A netbook, a projector, a browser with three toolbars open. Same layout
   again, one notch tighter. */
@media (max-height: 700px) {
  :root { --page-top: 10px; --page-bottom: 10px; --page-pad: 20px; }
  h1 { font-size: var(--t-lg); }
  h2 { font-size: var(--t-md); }
  .lede { font-size: var(--t-xs); }
  .card { padding: var(--s-3); }
  .stack, .stack--loose { gap: var(--s-2); }
  .hud { padding: var(--s-1) var(--s-3); }
}
</style>
<!-- grasslms:end -->
<style>
  /* One screen on open: a tighter heading block, and the page held to the
     height of the viewport so the working area can take what is left. */
  body { padding: var(--page-top) 0 var(--page-bottom); }
  .wrap { height: calc(100svh - var(--page-pad)); }
  h1 { font-size: clamp(var(--t-xl), 3.2vw, var(--t-2xl)); }
  .lede { font-size: var(--t-sm); max-width: 78ch; }
  .stack--loose { gap: var(--s-4); }


  .bench { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: var(--s-5); align-items: start; }
  @media (max-width: 860px) { .bench { grid-template-columns: 1fr; } }

  canvas {
    width: 100%; height: auto; display: block;
    max-height: min(58svh, 520px); object-fit: contain;
    border: 1px solid var(--color-border); border-radius: var(--radius-lg);
    background: var(--color-surface);
  }

  .slots { display: grid; gap: var(--s-3); }
  .slot { display: grid; gap: var(--s-2); }
  .slot__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-2); }
  .slot__name { font-size: var(--t-xs); font-weight: 700; }
  .slot__count { font-family: var(--font-mono); font-size: var(--t-2xs); color: var(--color-text-subtle); }
  .slot__pick { display: flex; align-items: center; gap: var(--s-2); }
  .slot__pick .btn { flex: none; }
  .slot__value {
    flex: 1; text-align: center;
    padding: var(--s-2) var(--s-3);
    border: 1px solid var(--color-border-strong); border-radius: var(--radius-md);
    background: var(--color-surface); font-size: var(--t-sm); font-weight: 600;
  }

  .swatches { display: flex; flex-wrap: wrap; gap: var(--s-2); }
  .swatches button {
    width: 34px; height: 34px; border-radius: var(--radius-sm);
    border: 2px solid transparent; cursor: pointer; padding: 0;
  }
  .swatches button[aria-pressed="true"] { border-color: var(--ink-900); }

  @media (max-height: 760px) { canvas { max-height: min(34svh, 270px); } .slots { gap: var(--s-2); } .slot { gap: var(--s-1); } }

  /* The last notch, for a screen with barely 660px of room. */
  @media (max-height: 700px) {
    canvas { max-height: min(30svh, 230px); }
    .slots { max-height: 44svh; overflow: auto; }
  }
</style>
</head>
<body>

<div class="wrap wrap--wide stack stack--loose">

  <header class="stack stack--tight">
    <div class="row row--between">
      <p class="eyebrow" data-t="eyebrow">Ages 7–10 · design choices</p>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="es" aria-pressed="false">ES</button>
      </div>
    </div>
    <h1><span data-t="title1">Sixteen thousand</span> <em class="mark" data-t="title2">robots</em></h1>
    <p class="lede" data-t="intro">Six parts, each with a handful of choices. Swap any of them and the robot redraws. When you like what you see, take it with you.</p>
  </header>

  <div class="bench">
    <div class="stack stack--tight">
      <canvas id="cv" width="760" height="640" role="img" aria-label="Your robot"></canvas>
      <div class="row">
        <button class="btn" id="dl" data-t="download">Save the picture</button>
        <button class="btn btn--secondary" id="rand" data-t="surprise">Surprise me</button>
        <button class="btn btn--ghost" id="reset" data-t="reset">Start again</button>
      </div>
    </div>

    <div class="card stack">
      <div class="stack stack--tight">
        <p class="eyebrow" data-t="colourLabel">Colour</p>
        <div class="swatches" id="colours"></div>
      </div>
      <div class="slots" id="slots"></div>
    </div>
  </div>

</div>

<script>
(function () {
  "use strict";

  const PALETTE = ["#0a8754", "#e2552f", "#f5b800", "#12798f", "#7c5cbf", "#485444"];

  /* Part list carried over from the original builder, one for one. */
  const PARTS = {
    head:    ["circle", "square", "triangle", "hexagon"],
    body:    ["rectangle", "round", "hexagon", "trapezoid"],
    eyes:    ["round", "star", "heart", "visor", "angry", "sleepy", "square", "happy"],
    arms:    ["normal", "strong", "claws", "tentacles", "mechanical"],
    legs:    ["normal", "wheels", "springs", "rocket", "spider"],
    antenna: ["single", "double", "satellite", "lightning", "none"]
  };
  const ORDER = ["head", "body", "eyes", "arms", "legs", "antenna"];

  const T = {
    en: {
      eyebrow: "Ages 7–10 · design choices",
      title1: "Sixteen thousand", title2: "robots",
      intro: "Six parts, each with a handful of choices. Swap any of them and the robot redraws. When you like what you see, take it with you.",
      colourLabel: "Colour", download: "Save the picture", surprise: "Surprise me", reset: "Start again",
      prev: "previous", next: "next",
      slots: { head: "Head", body: "Body", eyes: "Eyes", arms: "Arms", legs: "Legs", antenna: "Antenna" },
      names: {
        circle: "Round", square: "Square", triangle: "Triangle", hexagon: "Six-sided",
        rectangle: "Boxy", round: "Rounded", trapezoid: "Wedge",
        star: "Stars", heart: "Hearts", visor: "Visor", angry: "Cross", sleepy: "Sleepy", happy: "Smiling",
        normal: "Plain", strong: "Strong", claws: "Claws", tentacles: "Tentacles", mechanical: "Jointed",
        wheels: "Wheels", springs: "Springs", rocket: "Rockets", spider: "Spider",
        single: "One", double: "Two", satellite: "Dish", lightning: "Bolt", none: "None"
      }
    },
    es: {
      eyebrow: "7–10 años · decisiones de diseño",
      title1: "Dieciséis mil", title2: "robots",
      intro: "Seis piezas, cada una con unas cuantas opciones. Cambia cualquiera y el robot se vuelve a dibujar. Cuando te guste, llévatelo.",
      colourLabel: "Color", download: "Guardar la imagen", surprise: "Sorpréndeme", reset: "Empezar de nuevo",
      prev: "anterior", next: "siguiente",
      slots: { head: "Cabeza", body: "Cuerpo", eyes: "Ojos", arms: "Brazos", legs: "Piernas", antenna: "Antena" },
      names: {
        circle: "Redonda", square: "Cuadrada", triangle: "Triángulo", hexagon: "Hexágono",
        rectangle: "Rectangular", round: "Redondeado", trapezoid: "Trapecio",
        star: "Estrellas", heart: "Corazones", visor: "Visor", angry: "Enfadados", sleepy: "Dormidos", happy: "Sonrientes",
        normal: "Normales", strong: "Fuertes", claws: "Pinzas", tentacles: "Tentáculos", mechanical: "Articulados",
        wheels: "Ruedas", springs: "Muelles", rocket: "Cohetes", spider: "Araña",
        single: "Una", double: "Dos", satellite: "Parabólica", lightning: "Rayo", none: "Ninguna"
      }
    }
  };

  var lang = "en";
  var colour = PALETTE[0];
  var pick = { head: 0, body: 0, eyes: 0, arms: 0, legs: 0, antenna: 0 };

  const $ = function (id) { return document.getElementById(id); };
  const t = function () { return T[lang]; };
  const cv = $("cv"), ctx = cv.getContext("2d");
  const val = function (k) { return PARTS[k][pick[k]]; };

  function shade(hex, amount) {
    const n = parseInt(hex.slice(1), 16);
    const cl = function (v) { return Math.max(0, Math.min(255, v)); };
    return "rgb(" + cl((n >> 16) + amount) + "," + cl(((n >> 8) & 255) + amount) + "," + cl((n & 255) + amount) + ")";
  }

  function poly(cx, cy, r, sides, rot) {
    ctx.beginPath();
    for (var i = 0; i < sides; i++) {
      const a = rot + (i * 2 * Math.PI) / sides;
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function draw() {
    const dark = shade(colour, -40), light = shade(colour, 60);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.lineWidth = 5;
    ctx.lineJoin = "round";
    ctx.strokeStyle = dark;

    const cx = cv.width / 2;
    const bt = 300, bb = 470;

    /* antenna, drawn behind the head */
    const ant = val("antenna");
    if (ant !== "none") {
      ctx.strokeStyle = dark; ctx.fillStyle = colour;
      if (ant === "single" || ant === "double" || ant === "lightning") {
        const stems = ant === "double" ? [-28, 28] : [0];
        stems.forEach(function (dx) {
          ctx.beginPath(); ctx.moveTo(cx + dx, 150); ctx.lineTo(cx + dx, 84); ctx.stroke();
          if (ant === "lightning") {
            ctx.beginPath();
            ctx.moveTo(cx + dx - 16, 84); ctx.lineTo(cx + dx + 4, 60);
            ctx.lineTo(cx + dx - 4, 60); ctx.lineTo(cx + dx + 16, 34);
            ctx.strokeStyle = "#f5b800"; ctx.lineWidth = 7; ctx.stroke();
            ctx.lineWidth = 5; ctx.strokeStyle = dark;
          } else {
            ctx.beginPath(); ctx.arc(cx + dx, 74, 14, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
          }
        });
      } else {
        ctx.beginPath(); ctx.moveTo(cx, 150); ctx.lineTo(cx, 96); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(cx, 84, 44, 20, 0, 0, Math.PI * 2);
        ctx.fillStyle = light; ctx.fill(); ctx.stroke();
      }
    }

    /* head */
    ctx.fillStyle = colour; ctx.strokeStyle = dark;
    const head = val("head");
    if (head === "circle") { ctx.beginPath(); ctx.arc(cx, 206, 84, 0, Math.PI * 2); }
    else if (head === "square") { ctx.beginPath(); ctx.rect(cx - 80, 128, 160, 156); }
    else if (head === "triangle") { poly(cx, 212, 96, 3, -Math.PI / 2); }
    else { poly(cx, 206, 90, 6, Math.PI / 6); }
    ctx.fill(); ctx.stroke();

    /* eyes */
    const eyes = val("eyes"), ey = 200;
    if (eyes === "visor") {
      ctx.beginPath(); ctx.roundRect(cx - 62, ey - 20, 124, 40, 18);
      ctx.fillStyle = shade(colour, -70); ctx.fill(); ctx.stroke();
      ctx.fillStyle = light;
      ctx.beginPath(); ctx.roundRect(cx - 50, ey - 12, 40, 12, 6); ctx.fill();
    } else {
      [cx - 32, cx + 32].forEach(function (x, i) {
        ctx.fillStyle = "#ffffff"; ctx.strokeStyle = dark;
        if (eyes === "square") { ctx.beginPath(); ctx.rect(x - 20, ey - 20, 40, 40); }
        else if (eyes === "star") { poly(x, ey, 22, 5, -Math.PI / 2); }
        else if (eyes === "heart") {
          ctx.beginPath();
          ctx.moveTo(x, ey + 18);
          ctx.bezierCurveTo(x - 30, ey - 4, x - 14, ey - 26, x, ey - 10);
          ctx.bezierCurveTo(x + 14, ey - 26, x + 30, ey - 4, x, ey + 18);
          ctx.closePath();
        } else { ctx.beginPath(); ctx.arc(x, ey, 20, 0, Math.PI * 2); }
        ctx.fill(); ctx.stroke();

        if (eyes !== "star" && eyes !== "heart") {
          ctx.fillStyle = "#0d150d";
          ctx.beginPath(); ctx.arc(x, ey + (eyes === "sleepy" ? 6 : 0), 8, 0, Math.PI * 2); ctx.fill();
        }
        if (eyes === "angry") {
          ctx.lineWidth = 7;
          ctx.beginPath();
          ctx.moveTo(x + (i ? 22 : -22), ey - 32); ctx.lineTo(x + (i ? -6 : 6), ey - 20);
          ctx.stroke(); ctx.lineWidth = 5;
        }
        if (eyes === "sleepy") {
          ctx.beginPath(); ctx.moveTo(x - 20, ey - 6); ctx.lineTo(x + 20, ey - 6); ctx.stroke();
        }
      });
      if (eyes === "happy") {
        ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(cx, 244, 30, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
        ctx.lineWidth = 5;
      }
    }

    /* body */
    ctx.fillStyle = colour; ctx.strokeStyle = dark;
    const body = val("body");
    if (body === "rectangle") { ctx.beginPath(); ctx.rect(cx - 96, bt, 192, bb - bt); }
    else if (body === "round") { ctx.beginPath(); ctx.roundRect(cx - 96, bt, 192, bb - bt, 60); }
    else if (body === "hexagon") { poly(cx, (bt + bb) / 2, 108, 6, Math.PI / 2); }
    else {
      ctx.beginPath();
      ctx.moveTo(cx - 70, bt); ctx.lineTo(cx + 70, bt);
      ctx.lineTo(cx + 104, bb); ctx.lineTo(cx - 104, bb); ctx.closePath();
    }
    ctx.fill(); ctx.stroke();

    /* arms */
    const arms = val("arms");
    [-1, 1].forEach(function (s) {
      const sx = cx + s * 100, sy = 340;
      ctx.strokeStyle = dark; ctx.fillStyle = colour;
      if (arms === "tentacles") {
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.bezierCurveTo(sx + s * 70, sy + 20, sx + s * 40, sy + 90, sx + s * 90, sy + 120);
        ctx.lineWidth = 14; ctx.stroke(); ctx.lineWidth = 5;
      } else if (arms === "mechanical") {
        ctx.lineWidth = 12;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + s * 62, sy + 34); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(sx + s * 62, sy + 34); ctx.lineTo(sx + s * 62, sy + 108); ctx.stroke();
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(sx + s * 62, sy + 34, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      } else {
        const w = arms === "strong" ? 30 : 16;
        ctx.beginPath(); ctx.roundRect(s < 0 ? sx - w : sx, sy, w, 120, 10);
        ctx.fill(); ctx.stroke();
        if (arms === "claws") {
          ctx.lineWidth = 10;
          ctx.beginPath();
          ctx.moveTo(sx + s * 4, sy + 120); ctx.lineTo(sx + s * 34, sy + 156);
          ctx.moveTo(sx + s * 4, sy + 120); ctx.lineTo(sx - s * 20, sy + 156);
          ctx.stroke(); ctx.lineWidth = 5;
        }
      }
    });

    /* legs */
    const legs = val("legs");
    ctx.fillStyle = colour; ctx.strokeStyle = dark;
    if (legs === "spider") {
      [-1, 1].forEach(function (s) {
        [0, 1, 2].forEach(function (k) {
          ctx.beginPath();
          ctx.moveTo(cx + s * 40, bb - 10);
          ctx.quadraticCurveTo(cx + s * (110 + k * 26), bb + 30 + k * 10, cx + s * (80 + k * 44), bb + 118);
          ctx.lineWidth = 8; ctx.stroke(); ctx.lineWidth = 5;
        });
      });
    } else {
      [-1, 1].forEach(function (s) {
        const lx = cx + s * 46;
        if (legs === "wheels") {
          ctx.beginPath(); ctx.arc(lx, bb + 54, 44, 0, Math.PI * 2);
          ctx.fillStyle = shade(colour, -60); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.arc(lx, bb + 54, 16, 0, Math.PI * 2);
          ctx.fillStyle = light; ctx.fill(); ctx.stroke();
        } else if (legs === "springs") {
          ctx.beginPath();
          for (var i = 0; i <= 24; i++) {
            const y = bb + i * 4;
            const x = lx + (i % 2 === 0 ? -18 : 18);
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.lineWidth = 7; ctx.stroke(); ctx.lineWidth = 5;
        } else if (legs === "rocket") {
          ctx.beginPath();
          ctx.moveTo(lx - 26, bb); ctx.lineTo(lx + 26, bb);
          ctx.lineTo(lx + 14, bb + 84); ctx.lineTo(lx - 14, bb + 84); ctx.closePath();
          ctx.fillStyle = colour; ctx.fill(); ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(lx - 14, bb + 84); ctx.lineTo(lx, bb + 130); ctx.lineTo(lx + 14, bb + 84);
          ctx.closePath(); ctx.fillStyle = "#f5b800"; ctx.fill();
        } else {
          ctx.beginPath(); ctx.roundRect(lx - 20, bb, 40, 96, 10);
          ctx.fillStyle = colour; ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.roundRect(lx - 34, bb + 84, 68, 24, 10);
          ctx.fillStyle = shade(colour, -60); ctx.fill(); ctx.stroke();
        }
      });
    }
  }

  function render() {
    const d = t();
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach(function (el) {
      const v = d[el.dataset.t];
      if (typeof v === "string") el.textContent = v;
    });

    const cb = $("colours");
    cb.innerHTML = "";
    PALETTE.forEach(function (c) {
      const b = document.createElement("button");
      b.type = "button"; b.style.background = c;
      b.setAttribute("aria-pressed", String(c === colour));
      b.setAttribute("aria-label", c);
      b.onclick = function () { colour = c; render(); };
      cb.appendChild(b);
    });

    const sb = $("slots");
    sb.innerHTML = "";
    ORDER.forEach(function (k) {
      const wrap = document.createElement("div");
      wrap.className = "slot";

      const head = document.createElement("div");
      head.className = "slot__head";
      const nm = document.createElement("span");
      nm.className = "slot__name"; nm.textContent = d.slots[k];
      const ct = document.createElement("span");
      ct.className = "slot__count";
      ct.textContent = (pick[k] + 1) + "/" + PARTS[k].length;
      head.append(nm, ct);

      const row = document.createElement("div");
      row.className = "slot__pick";
      const back = document.createElement("button");
      back.type = "button"; back.className = "btn btn--secondary btn--sm";
      back.textContent = "◀"; back.setAttribute("aria-label", d.slots[k] + ", " + d.prev);
      back.onclick = function () { pick[k] = (pick[k] - 1 + PARTS[k].length) % PARTS[k].length; render(); };

      const cur = document.createElement("span");
      cur.className = "slot__value";
      cur.textContent = d.names[val(k)] || val(k);

      const fwd = document.createElement("button");
      fwd.type = "button"; fwd.className = "btn btn--secondary btn--sm";
      fwd.textContent = "▶"; fwd.setAttribute("aria-label", d.slots[k] + ", " + d.next);
      fwd.onclick = function () { pick[k] = (pick[k] + 1) % PARTS[k].length; render(); };

      row.append(back, cur, fwd);
      wrap.append(head, row);
      sb.appendChild(wrap);
    });

    draw();
  }

  $("rand").onclick = function () {
    ORDER.forEach(function (k) { pick[k] = Math.floor(Math.random() * PARTS[k].length); });
    colour = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    render();
  };
  $("reset").onclick = function () {
    ORDER.forEach(function (k) { pick[k] = 0; });
    colour = PALETTE[0]; render();
  };
  $("dl").onclick = function () {
    const a = document.createElement("a");
    a.download = "my-robot.png";
    a.href = cv.toDataURL("image/png");
    document.body.appendChild(a); a.click(); a.remove();
  };

  document.querySelectorAll(".langs button").forEach(function (b) {
    b.onclick = function () {
      lang = b.dataset.lang;
      document.querySelectorAll(".langs button").forEach(function (x) {
        x.setAttribute("aria-pressed", String(x === b));
      });
      render();
    };
  });

  render();
})();
</script>
</body>
</html>
