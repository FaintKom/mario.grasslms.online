<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 1 · Would you click?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Lesson shell — shared engine styles.
   GENERATED :root must match design-system/design-tokens.json — the SCORM build asserts it. */
:root {
  --bg:#0E1116; --panel:#151B24; --panel-glass:rgba(21,27,36,.72); --card:#151B24;
  --txt:#EAF2F9; --dim:#8A93A0;
  --blue:#35B6FF; --lime:#C6F221; --green:#3DDC84; --red:#FF3B4A;
  --line:rgba(53,182,255,.18); --line2:rgba(53,182,255,.28);
  --sans:'Archivo','IBM Plex Sans',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
* { box-sizing: border-box; }
body { margin: 0; font: 400 17.5px/1.6 var(--body); color: var(--txt); -webkit-font-smoothing: antialiased;
       background: var(--bg); }
a { color: var(--blue); }

/* top bar */
.bar { position: sticky; top: 0; z-index: 20; background: rgba(14,17,22,.92); backdrop-filter: blur(8px);
       border-bottom: 1px solid var(--line); padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
.bar .title { font: 700 16px var(--sans); }
.bar-home { font: 500 13px var(--mono); color: var(--dim); text-decoration: none; white-space: nowrap; }
.bar-home:hover, .bar-home:focus-visible { color: var(--blue); outline: none; }
.bar .prog { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.bar .track { width: 160px; height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; }
.bar .fill { height: 100%; width: 0; background: var(--green); box-shadow: 0 0 10px var(--green); border-radius: 3px; transition: width .4s; }
.bar .pct { font: 500 12px var(--mono); color: var(--dim); min-width: 34px; text-align: right; }
.bar .quizscore { margin-left: auto; font: 600 12.5px var(--mono); color: var(--dim);
                  padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line2); }
.bar .quizscore.pass { color: var(--green); border-color: rgba(61,220,132,.4); }
.bar .quizscore + .prog { margin-left: 0; }

/* Labeled menu button — opens the steps drawer. The visible "Steps" label
   makes the control's purpose unambiguous. */
.bar .menu-btn { display: flex; align-items: center; gap: 8px; flex: none; height: 34px; padding: 0 13px;
                 border-radius: 9px; border: 1px solid var(--line2); background: rgba(53,182,255,.06);
                 color: var(--blue); font: 600 13.5px var(--sans); cursor: pointer; transition: .15s; }
.bar .menu-btn:hover, .bar .menu-btn[aria-expanded="true"] { background: rgba(53,182,255,.14); border-color: var(--blue); }
.bar .menu-btn .ic { font: 400 16px var(--mono); line-height: 1; }

/* Steps menu = off-canvas drawer at every size. */
.backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(6,9,13,.55);
            -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
            opacity: 0; visibility: hidden; transition: opacity .25s; }
.backdrop.open { opacity: 1; visibility: visible; }
body.no-scroll { overflow: hidden; }

.rail-head { display: flex; align-items: center; justify-content: space-between;
             margin: 0 0 8px; padding: 0 4px 12px; border-bottom: 1px solid var(--line); }
.rail-head .rh-t { font: 700 12px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.rail-close { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line2);
              background: transparent; color: var(--dim); font: 400 18px var(--mono); line-height: 1; cursor: pointer;
              display: flex; align-items: center; justify-content: center; transition: .15s; }
.rail-close:hover, .rail-close:focus-visible { color: var(--blue); border-color: var(--blue); background: rgba(53,182,255,.1); outline: none; }
.rail-links { margin-top: auto; padding-top: 18px; border-top: 1px solid var(--line); }
.rail-links a { display: block; padding: 9px 12px; border-radius: 8px; font: 500 13.5px var(--mono);
                text-decoration: none; color: var(--dim); }
.rail-links a:hover, .rail-links a:focus-visible { background: rgba(53,182,255,.12); color: var(--blue); outline: none; }

.wrap { max-width: 960px; margin: 0 auto; }

/* Narrow phones: let the top bar wrap so the title never collides with the progress meter. */
@media (max-width: 600px) {
  .bar { flex-wrap: wrap; padding: 10px 16px; gap: 6px 12px; }
  .bar .title { flex: 1 1 100%; order: 3; font-size: 15px; }
  .bar .prog { margin-left: auto; flex: 0 0 auto; order: 2; }
  .bar .track { width: clamp(90px, 26vw, 160px); }
}

/* step rail — off-canvas drawer */
.rail { position: fixed; top: 0; left: 0; z-index: 50; width: min(300px, 86vw); height: 100%;
        display: flex; flex-direction: column; overflow-y: auto; padding: 16px 14px;
        background: var(--panel); border-right: 1px solid var(--line2); box-shadow: 10px 0 44px rgba(0,0,0,.5);
        transform: translateX(-100%); transition: transform .28s cubic-bezier(.2,1,.4,1); }
.rail.open { transform: none; }
.step { display: flex; gap: 11px; align-items: flex-start; padding: 11px 12px; border-radius: 12px; cursor: pointer; margin-bottom: 3px; transition: .15s; }
.step:hover { background: rgba(53,182,255,.08); }
.step.active { background: rgba(53,182,255,.14); box-shadow: inset 0 0 0 1px var(--line2), 0 0 18px rgba(53,182,255,.12); }
.step.active .s-t { color: var(--blue); }
.s-n { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.18); flex: none;
       display: flex; align-items: center; justify-content: center; font: 600 12px var(--mono); color: var(--dim); }
.step.active .s-n { border-color: var(--blue); color: var(--blue); box-shadow: 0 0 10px rgba(53,182,255,.4); }
.step.done .s-n { background: var(--green); border-color: var(--green); color: var(--bg); box-shadow: 0 0 10px rgba(61,220,132,.4); }
.s-t { font-weight: 600; font-size: 14.5px; }
.s-d { font-size: 12px; color: var(--dim); margin-top: 1px; }
/* locked step in the rail (a gated step ahead that isn't finished yet) */
.step.locked { opacity: .42; cursor: not-allowed; }
.step.locked:hover { background: none; }

/* main */
.main { padding: 34px 40px 90px; min-width: 0; }
.panel { display: none; }
.panel.on { display: block; animation: fade .35s cubic-bezier(.2,1,.4,1); }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.step-eyebrow { font: 500 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--blue); margin-bottom: 6px; }
/* Fluid type: scales with the viewport, clamped to sane min/max. */
h1 { font: 800 clamp(28px, 7.5vw, 42px)/1.06 var(--sans); letter-spacing: -.02em; margin: 0 0 12px; }
h2 { font: 700 clamp(20px, 5vw, 26px) var(--sans); letter-spacing: -.01em; margin: 0 0 10px; }
.lead { font-size: clamp(16px, 4vw, 19px); line-height: 1.55; color: var(--dim); max-width: 680px; }

.objs { margin: 22px 0; padding: 0; list-style: none; max-width: 640px; }
.objs li { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15.5px; }
.objs .ic { width: 26px; height: 26px; border-radius: 7px; background: rgba(53,182,255,.14); color: var(--blue);
            display: flex; align-items: center; justify-content: center; flex: none; font: 700 13px var(--mono); box-shadow: 0 0 10px rgba(53,182,255,.2); }
.objs b { font-weight: 600; }
.meta-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0 4px; }
.chip { font: 500 12px var(--mono); padding: 5px 11px; border-radius: 999px; background: rgba(53,182,255,.12); color: var(--blue); border: 1px solid var(--line2); }
.chip.g { background: rgba(61,220,132,.1); color: var(--green); border-color: rgba(61,220,132,.35); }

/* embedded interactive frame */
.frame { margin: 22px 0 8px; border-radius: 18px; overflow: hidden; border: 1px solid var(--line2);
         background: #0E1116; box-shadow: 0 0 0 1px rgba(53,182,255,.05), 0 18px 50px rgba(0,0,0,.4); }
/* Video step fits the viewport so the Back/Next buttons stay visible. */
.frame.video iframe { height: min(72vw, 760px, calc(100dvh - 280px)); }
.frame.tall iframe { height: min(760px, 82vh); }
iframe { width: 100%; border: 0; display: block; }
.frame-hint { font: 500 12px var(--mono); color: var(--dim); margin: 2px 0 0; }

.placeholder { margin: 22px 0; border: 1px dashed var(--line2); border-radius: 16px; padding: 28px 26px; background: rgba(53,182,255,.04); max-width: 680px; }
.placeholder b { color: var(--blue); }
/* Film embed: true 16:9, capped so the player + step controls fit above the fold (PR #23). */
.film16x9 { position: relative; width: 100%; max-width: 820px; aspect-ratio: 16 / 9; max-height: 66vh; margin: 4px auto 0;
            border-radius: 16px; overflow: hidden;
            border: 1px solid var(--line2); box-shadow: 0 0 0 1px rgba(53,182,255,.05), 0 18px 50px rgba(0,0,0,.4); background: #0E1116; }
.film16x9 iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

/* longread */
.reading { max-width: 680px; color: #C9D4DD; }
.reading p { margin: 0 0 1.1em; }
.reading h3 { font: 600 20px var(--sans); color: var(--txt); margin: 1.6em 0 .4em; }
.reading strong { font-weight: 600; color: var(--txt); }
.reading code { font: 500 14px var(--mono); background: rgba(53,182,255,.12); color: var(--blue); padding: 1px 6px; border-radius: 6px; }
.reading em { font-style: italic; color: var(--txt); }
.reading .viz { margin: 26px 0; padding: 16px 16px 12px; border: 1px solid var(--line2); border-radius: 16px;
                background: linear-gradient(180deg, rgba(53,182,255,.05), rgba(21,27,36,.5)); box-shadow: 0 10px 34px rgba(0,0,0,.3); }
.reading .viz svg { display: block; width: 100%; height: auto; }
.reading .viz figcaption { margin-top: 10px; font: 500 12.5px var(--mono); color: var(--dim); text-align: center; letter-spacing: .01em; }
.reading blockquote.line { margin: 26px 0; padding: 14px 22px; border: 0; border-left: 3px solid var(--lime);
                background: rgba(198,242,33,.06); border-radius: 0 12px 12px 0; }
.reading blockquote.line p { margin: 0; font: 600 clamp(17px,4.5vw,21px)/1.4 var(--sans); color: var(--txt); }
.reading blockquote.line cite { display: block; margin-top: 8px; font: 500 12px var(--mono); font-style: normal; color: var(--lime); letter-spacing: .04em; }

.callout { margin: 20px 0; padding: 16px 20px; border-radius: 14px; background: rgba(61,220,132,.07);
           border: 1px solid rgba(61,220,132,.3); border-left: 4px solid var(--green); max-width: 680px; }
.callout b { color: var(--green); }
.recs { margin: 18px 0; padding: 0; list-style: none; max-width: 680px; }
.recs li { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 15.5px; }
.recs .when { font: 700 12px var(--mono); letter-spacing: .05em; color: var(--lime); flex: none; width: 78px; padding-top: 2px; }

/* nav buttons */
.nav { display: flex; align-items: center; gap: 14px; margin-top: 34px; }
.btn { font: 600 16px var(--body); padding: 13px 26px; border-radius: 12px; cursor: pointer;
       border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.03); color: var(--txt); transition: .15s; }
.btn:hover:not(:disabled) { border-color: var(--blue); background: rgba(53,182,255,.1); }
.btn.primary { background: var(--blue); color: var(--bg); border-color: var(--blue); margin-left: auto; box-shadow: 0 0 16px rgba(53,182,255,.35); }
.btn.primary:hover:not(:disabled) { background: var(--lime); border-color: var(--lime); box-shadow: 0 0 18px rgba(198,242,33,.45); }
.btn:disabled { opacity: .35; cursor: default; }
.btn.done { background: var(--green); border-color: var(--green); color: var(--bg); box-shadow: 0 0 16px rgba(61,220,132,.4); }
.btn.done:hover:not(:disabled) { background: var(--green); border-color: var(--green); }
/* gate: note shown when Next is locked until the step is finished.
   Sits BETWEEN Back and Next — flex:1 lets it centre in the gap and wrap. */
.gate-note { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 8px;
             text-align: center; font: 500 14px var(--mono); color: var(--dim); letter-spacing: .02em; }
.gate-note .lk { color: var(--blue); }
.gate-note.met { color: var(--green); } .gate-note.met .lk { color: var(--green); }

/* Mobile reclaim — placed after the base rules so it wins. */
@media (max-width: 820px) {
  .main { padding: 20px 20px 70px; }
  .nav { margin-top: 18px; gap: 10px; }
  .gate-note { font-size: 12px; gap: 6px; }
  .frame { margin-top: 14px; }
  .frame.video iframe { height: min(72vw, calc(100dvh - 300px)); }
}

/* Reduced motion: gate ALL shell-owned motion (design-system rule). */
@media (prefers-reduced-motion: reduce) {
  .rail, .backdrop, .btn, .fill, .step, .menu-btn, .rail-close { transition: none; }
  .panel.on { animation: none; }
}

</style>

<div class="wrap">

</div>

<script>window.PRERENDERED_READING = {"Four tells, every time": "You get dozens of messages a day. Most are fine. The dangerous ones work because they look like the fine ones, and because they land when you're busy.\n\nFilters catch most phishing. The messages that reach you are the ones that slipped past them, so the last control is you. Four tells cover it. Running through them takes under ten seconds, and any single one is enough to stop.\n\n**1. Unexpected + urgent.** Real work is rarely both. A message you didn't expect, pushing you to act *right now*: account closing, invoice overdue, boss needs gift cards before a meeting. The pressure is manufactured. It's there so you skip thinking. Urgency is the attacker's favourite tool because it works on smart, busy people. The fix costs three seconds. Pause. Nothing legitimate breaks because you checked first.\n\n**2. Sender mismatch.** The display name says your bank, your IT team, your CEO. The real address says something else. Tap or hover on the sender and read it. Look-alike domains are the classic move: `yourc0mpany.com`, `yourcompany-support.net`. One character off is all it takes. One glance catches it.\n\n**3. It asks for the crown jewels.** Passwords, MFA codes, payment changes, gift cards. Legitimate systems don't ask you to \"confirm your password\" by email. Your IT team never needs it. They have admin access. Anyone asking for an MFA code is asking to *be you*. This tell alone ends the conversation.\n\n**4. Unexpected link or attachment.** Before you click, hover. The destination shows in the corner. On a phone, long-press the link to preview it. If a \"shared document\" points somewhere other than your document platform, that's the whole story. Attachments you weren't expecting, especially ones that want you to \"enable content,\" are the standard malware route. ISO 27002 puts user awareness at the centre of malware defence (§8.7), because this is where the automated controls run out.\n\nOne tell is reason enough to stop and report it with your **Report Phishing** button. You don't need a second. Reporting a false alarm costs security thirty seconds. Missing a real phish costs weeks.\n\nAnd if you already clicked? Report anyway, now. Speed is what separates an incident from a disaster."};</script>
<script>
/* Unit 1 — Would you click? Content module: data + bespoke prose renderers.
   The shell engine (shell/shell.js) boots from this object on DOMContentLoaded. */
(function () {
'use strict';
const SRC = 'content/interactives/';

function introHTML() {
  return `<div class="step-eyebrow">Unit 1 · Security &amp; Privacy Essentials</div>
    <h1>Would you click?</h1>
    <p class="lead">Phishing gets through the filters when it looks ordinary and lands when you're busy. The last check is you, and it takes under ten seconds. This short unit gives you four of them, plus the one safe thing to do every time.</p>
    <div class="meta-row"><span class="chip">~10 min</span><span class="chip">self-paced</span><span class="chip g">ISO 27002 §8.7 · §5.17 · §6.3 · §6.8</span></div>
    <ul class="objs">
      <li><span class="ic">1</span><div><b>Spot four tells</b> in any suspicious message: unexpected + urgent, sender mismatch, credential ask, link mismatch.</div></li>
      <li><span class="ic">2</span><div><b>Know the rule:</b> one tell is enough. Stop and report, no need to wait for a second sign.</div></li>
      <li><span class="ic">3</span><div><b>Do the safe move:</b> report, don't just delete.</div></li>
    </ul>`;
}

function commitHTML() {
  return `<h2>One habit to keep</h2>
    <p class="lead">"Next time a message is unexpected AND urgent, I'll pause and verify before I click."</p>
    <div class="callout"><b>Quiet question, just for you:</b> which message this week came closest to fooling you? You don't have to answer here, just notice it.</div>
    <p style="max-width:680px">That's Unit 1. Next up: the 30-second habit that stops most account takeovers, passwords and MFA.</p>`;
}

window.LESSON = {
  id: 'u1',
  title: 'Would you click?',
  steps: [
    { n:1, t:"Start here", d:"What this unit is", kind:'prose', render: introHTML },
    { n:2, t:"Watch", d:"Would you click? · 2 min", kind:'embed', fit:'video', src:SRC+"v1-would-you-click/index.html",
      gate:"watch", gateHint:"Watch to the end to continue." },
    { n:3, t:"The four tells", d:"Read · 2 min", kind:'reading',
      src:'content/01-security-privacy-essentials.md', section:'Four tells, every time' },
    { n:4, t:"Check your eye", d:"9 questions", kind:'embed', fit:'tall', src:SRC+"v1-questions.html",
      hint:"Pick an answer on each card to see why.",
      gate:"questions", gateHint:"Get at least 7 of 9 right to continue." },
    { n:5, t:"Practice", d:"Your inbox · flag the tells", kind:'embed', fit:'tall', src:SRC+"u1-inbox-simulator.html",
      hint:"Open all three, flag what's off, then Check.",
      gate:"practice", gateHint:"Flag every tell with no false alarms, then Check. A clean sweep unlocks the next step." },
    { n:6, t:"Commit", d:"One habit to keep", kind:'prose', render: commitHTML },
  ],
};
})();

</script>
<script>
/* Lesson shell engine.
 *
 * A unit module sets `window.LESSON = { id, title, steps }` (data only) — this
 * script boots on DOMContentLoaded, so script order can never break the page.
 *
 * Step: { n, t, d, kind, ...props, gate?, gateHint? }
 *   prose:   { render: () => html | Promise<html> }  — bespoke HTML; may call
 *            LESSON.markGate(id) for visit-completes-it steps.
 *   reading: { src, section, viz? }  — fetch md (or use window.PRERENDERED_READING
 *            injected by the SCORM build), cut the "### Longread — {section}"
 *            block, render with marked, inject viz figures for [[viz:name]].
 *   embed:   { src, fit:'tall'|'video'|'film16x9', hint? } — iframe activity.
 *
 * Gates: a step with gate:'id' disables Next until its iframe posts
 * { type:'lesson-progress', id } (legacy '{unit}-progress' also accepted).
 * Storage (per unit): {id}-gates, {id}-seen (JSON arrays), {id}-done ('1').
 */
(function () {
'use strict';

function boot() {
  const LESSON = window.LESSON;
  if (!LESSON || !Array.isArray(LESSON.steps)) {
    console.error('shell.js: window.LESSON missing, unit module not loaded?');
    return;
  }
  const STEPS = LESSON.steps;
  const ID = LESSON.id;

  const store = {
    read(key, fallback) { try { return JSON.parse(localStorage.getItem(ID + '-' + key)) ?? fallback; } catch (e) { return fallback; } },
    write(key, val) { try { localStorage.setItem(ID + '-' + key, JSON.stringify(val)); } catch (e) {} },
    flag(key) { try { return localStorage.getItem(ID + '-' + key) === '1'; } catch (e) { return false; } },
    setFlag(key) { try { localStorage.setItem(ID + '-' + key, '1'); } catch (e) {} },
  };

  // Completions persist so a reload doesn't force a re-watch; `seen` persists
  // too so progress on non-gated steps survives a reload.
  const gates = new Set(store.read('gates', []));
  const seen = new Set(store.read('seen', [0]));
  const saveGates = () => store.write('gates', [...gates]);
  const saveSeen = () => store.write('seen', [...seen]);

  let cur = 0;
  const rail = document.getElementById('rail');
  const main = document.getElementById('main');
  const menuBtn = document.getElementById('menuBtn');
  const backdrop = document.getElementById('backdrop');

  // Exposed so prose renderers can mark visit-completes-it gates (u2 Watch).
  LESSON.markGate = (id) => { if (!gates.has(id)) { gates.add(id); saveGates(); refreshGateUI(); } };

  // Reachable: every gated step before i must be finished.
  const reachable = (i) => { for (let j = 0; j < i; j++) { const g = STEPS[j].gate; if (g && !gates.has(g)) return false; } return true; };
  const gateLocked = (i) => { const g = STEPS[i].gate; return !!g && !gates.has(g); };

  /* ---------- drawer (off-canvas steps menu) ---------- */
  function setRail(open) {
    if (open === rail.classList.contains('open')) return;
    rail.classList.toggle('open', open);
    backdrop.classList.toggle('open', open);
    backdrop.hidden = !open;
    document.body.classList.toggle('no-scroll', open);
    menuBtn.setAttribute('aria-expanded', String(open));
    if (open) { const c = rail.querySelector('.rail-close'); if (c) c.focus(); }
    else { menuBtn.focus(); }
  }
  menuBtn.addEventListener('click', () => setRail(!rail.classList.contains('open')));
  backdrop.addEventListener('click', () => setRail(false));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setRail(false); });

  function buildRail() {
    rail.innerHTML = '';
    const head = document.createElement('div');
    head.className = 'rail-head';
    head.innerHTML = `<span class="rh-t">Steps</span><button class="rail-close" type="button" aria-label="Close menu">&times;</button>`;
    head.querySelector('.rail-close').onclick = () => setRail(false);
    rail.appendChild(head);
    STEPS.forEach((s, i) => {
      const locked = i > cur && !reachable(i);
      const el = document.createElement('div');
      el.className = 'step' + (i === cur ? ' active' : '') + (seen.has(i) && i !== cur ? ' done' : '') + (locked ? ' locked' : '');
      const badge = locked ? '🔒' : (seen.has(i) && i < cur ? '✓' : s.n);
      el.innerHTML = `<span class="s-n">${badge}</span><div><div class="s-t">${s.t}</div><div class="s-d">${s.d}</div></div>`;
      el.onclick = () => go(i);
      rail.appendChild(el);
    });
    const links = document.createElement('div');
    links.className = 'rail-links';
    links.innerHTML = `<a href="index.html">← Course map</a><a href="../../../">← Portfolio</a>`;
    rail.appendChild(links);
  }

  /* ---------- step-kind renderers ---------- */
  const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  const renderers = {
    prose: (s) => s.render(),

    async reading(s) {
      let md = (window.PRERENDERED_READING || {})[s.section];
      if (md == null) {
        try {
          const raw = await fetch(s.src).then(r => r.text());
          const clean = raw.replace(/\r\n/g, '\n'); // tolerate CRLF saves
          const m = clean.match(new RegExp('### Longread — ' + esc(s.section) + '\\n([\\s\\S]*?)\\n### Items'));
          md = m && m[1];
        } catch (e) { md = null; }
      }
      if (md == null) return `<h2>${s.section}</h2><p>The reading couldn't load. Refresh the page to try again.</p>`;
      let body = window.marked.parse(md.trim());
      if (s.viz) body = body.replace(/<p>\s*\[\[viz:(\w+)\]\]\s*<\/p>/g, (_, n) => s.viz[n] || '');
      return `<h2>${s.section}</h2><div class="reading">${body}</div>`;
    },

    embed(s) {
      if (s.fit === 'film16x9') {
        return `<div class="film16x9"><iframe src="${s.src}" title="${s.t}" loading="lazy" allowfullscreen></iframe></div>`
          + (s.hint ? `<p class="frame-hint">${s.hint}</p>` : '');
      }
      return `<div class="frame ${s.fit}"><iframe src="${s.src}" loading="lazy" allow="autoplay; fullscreen" allowfullscreen></iframe></div>`
        + (s.hint ? `<p class="frame-hint">${s.hint}</p>` : '');
    },
  };

  /* ---------- render ---------- */
  async function render() {
    const s = STEPS[cur];
    main.innerHTML = '<div class="panel on" id="panel"></div>';
    const panel = document.getElementById('panel');
    let html = await renderers[s.kind](s);
    const last = cur === STEPS.length - 1;
    const locked = gateLocked(cur);
    html += `<div class="nav">
      <button class="btn" id="back" ${cur === 0 ? 'disabled' : ''}>← Back</button>`;
    if (s.gate && s.gateHint) {
      const met = gates.has(s.gate);
      html += `<div class="gate-note${met ? ' met' : ''}" id="gatenote"><span class="lk">${met ? '✓' : '🔒'}</span><span>${met ? 'Done. You can continue.' : s.gateHint}</span></div>`;
    }
    html += `<button class="btn primary ${last ? 'done' : ''}" id="next" ${locked ? 'disabled' : ''}>${last ? 'Finish ✓' : 'Next →'}</button>
    </div>`;
    panel.innerHTML = html;

    // Tall frames grow to their content so the PAGE scrolls, not the iframe.
    // Same-origin, so we can measure the embedded document directly.
    if (s.kind === 'embed' && s.fit === 'tall') {
      const fr = panel.querySelector('iframe');
      fr.addEventListener('load', () => {
        try {
          const doc = fr.contentDocument;
          // Measure body, not documentElement: <html> stretches to the iframe's
          // own height, so documentElement.scrollHeight pins to the current frame
          // height and never shrinks to fit short content (left a dead gap below).
          const fit = () => { fr.style.height = Math.max(420, doc.body.scrollHeight) + 'px'; };
          fit();
          new ResizeObserver(fit).observe(doc.documentElement);
        } catch (e) {}
      });
    }
    document.getElementById('back').onclick = () => go(cur - 1);
    document.getElementById('next').onclick = () => {
      if (gateLocked(cur)) return;
      if (cur === STEPS.length - 1) { store.setFlag('done'); window.location.href = 'index.html'; }
      else go(cur + 1);
    };
    updateProgress();
  }

  // A gate completed: update Next + note + rail WITHOUT re-rendering the panel
  // (a re-render would reload the iframe and lose its state).
  function refreshGateUI() {
    const s = STEPS[cur];
    const nextBtn = document.getElementById('next');
    if (nextBtn && cur !== STEPS.length - 1) nextBtn.disabled = gateLocked(cur);
    const note = document.getElementById('gatenote');
    if (note && s.gate && gates.has(s.gate)) {
      note.className = 'gate-note met';
      note.innerHTML = `<span class="lk">✓</span><span>Done. You can continue.</span>`;
    }
    buildRail();
    updateProgress();
  }

  /* ---------- messages from embedded activities ---------- */
  window.addEventListener('message', (e) => {
    // Only trust our own embeds — a stray frame must not flip gates.
    const frames = [...document.querySelectorAll('#panel iframe')].map(f => f.contentWindow);
    if (!frames.includes(e.source)) return;
    const d = e.data || {};
    const isProgress = d.type === 'lesson-progress' || d.type === ID + '-progress';
    const isScore = d.type === 'lesson-quiz-score' || d.type === ID + '-quiz-score';
    if (isProgress && d.id && STEPS.some(s => s.gate === d.id) && !gates.has(d.id)) {
      gates.add(d.id); saveGates(); refreshGateUI();
    }
    if (isScore) {
      const el = document.getElementById('quizScore');
      el.hidden = false;
      el.className = 'quizscore' + (d.passed ? ' pass' : '');
      el.textContent = d.passed ? `${d.correct} / ${d.total} ✓ passed`
                                : `${d.correct} / ${d.total} correct · ${d.pass} to pass`;
    }
  });

  /* ---------- progress: derived from steps, nothing hardcoded ---------- */
  function updateProgress() {
    let done = 0;
    STEPS.forEach((s, i) => { if (s.gate ? gates.has(s.gate) : seen.has(i)) done++; });
    const pct = Math.round((done / STEPS.length) * 100);
    document.getElementById('fill').style.width = pct + '%';
    document.getElementById('pct').textContent = pct + '%';
  }

  function go(i) {
    if (i < 0 || i >= STEPS.length) return;
    if (i > cur && !reachable(i)) return; // gated: finish the current activity first
    setRail(false);
    document.getElementById('quizScore').hidden = true; // score chip is quiz-step-only
    cur = i; seen.add(i); saveSeen();
    if (cur === STEPS.length - 1) store.setFlag('done'); // reaching Finish = lesson done (map reads this)
    buildRail(); render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.querySelector('.bar .title').textContent = LESSON.title;
  buildRail();
  render();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();

</script>
</body>
</html>
