<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotting a phishing email, questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0E1116; --panel:rgba(21,27,36,.72); --txt:#EAF2F9; --dim:#8A93A0;
    --blue:#35B6FF; --lime:#C6F221; --green:#3DDC84; --red:#FF3B4A;
    --sans:'Archivo','IBM Plex Sans',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  /* Plain dark background — dot grid removed (feedback item 6). */
  body { background: var(--bg); color: var(--txt); font: 400 16px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 30px 20px 36px; }
  h1 { font: 700 clamp(24px, 6.5vw, 34px)/1.1 var(--sans); letter-spacing: -.01em; margin-bottom: 8px; }
  .lead { color: var(--dim); font-size: 15px; margin-bottom: 8px; max-width: 620px; }
  .score { position: sticky; top: 0; z-index: 10; font: 600 13px var(--mono); color: var(--dim);
    margin: 0 -20px 26px; padding: 14px 20px 12px; background: rgba(14,17,22,.85); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid rgba(53,182,255,.15); }
  .score b { color: var(--lime); }

  .card { border: 1px solid rgba(53,182,255,.25); border-radius: 18px; background: var(--panel);
    box-shadow: 0 0 0 1px rgba(53,182,255,.05), 0 14px 40px rgba(0,0,0,.35); padding: 20px 22px; margin-bottom: 20px; }
  .eyebrow { font: 500 13px var(--body); color: var(--dim); margin-bottom: 10px; }

  /* mail-styled scenario — rendered as a realistic Gmail message so the skill
     transfers to what real mail actually looks like (feedback item 21). Only
     this block goes light; everything else in the card stays dark-neon. */
  .mail { border: 1px solid #dadce0; border-radius: 8px; overflow: hidden; margin-bottom: 16px; background: #fff; }
  .mail-subj { font: 500 19px/1.35 'Google Sans', Roboto, Arial, sans-serif; color: #202124; padding: 16px 20px 2px; }
  .mail-h { display: flex; gap: 12px; align-items: flex-start; padding: 6px 20px 14px; border-bottom: 1px solid #f1f3f4; }
  .mail-h .av { width: 36px; height: 36px; border-radius: 50%; flex: none; display: flex; align-items: center;
    justify-content: center; color: #fff; font: 500 15px 'Google Sans', Roboto, Arial, sans-serif; }
  .mail-meta { flex: 1; min-width: 0; padding-top: 2px; }
  .mail-fromrow { font-size: 14px; color: #202124; line-height: 1.4; }
  .mail-name { font-weight: 700; }
  .mail-addr { font: 12.5px Roboto, Arial, sans-serif; color: #5f6368; margin-left: 4px; }
  .mail-to { font: 12px Roboto, Arial, sans-serif; color: #5f6368; margin-top: 2px; }
  .mail-time { font: 12px Roboto, Arial, sans-serif; color: #5f6368; white-space: nowrap; flex: none; padding-top: 4px; }
  .mail-body { padding: 14px 20px 20px; font: 14px/1.6 Roboto, Arial, sans-serif; color: #202124; background: #fff; }
  .mail-body .mono { font: 500 13px var(--mono); color: #1a73e8; }
  .mail-link { color: #1a73e8; font-weight: 500; }
  .attach-chip { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 7px 12px 7px 8px;
    background: #f1f3f4; border-radius: 8px; font: 12.5px Roboto, Arial, sans-serif; color: #202124; }
  .attach-chip svg { flex: none; }
  .redch { color: #d93025; font-weight: 700; }
  .qtext { font-size: 17px; font-weight: 600; margin-bottom: 16px; }

  .opts { display: flex; flex-direction: column; gap: 9px; }
  .opt { text-align: left; font: 500 14.5px var(--body); color: var(--txt); background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.12); border-radius: 11px; padding: 12px 15px; cursor: pointer; transition: .15s; }
  .opt:hover:not(:disabled) { border-color: var(--blue); background: rgba(53,182,255,.08); }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--green); background: rgba(61,220,132,.12); box-shadow: 0 0 14px rgba(61,220,132,.25); color: #fff; }
  .opt.wrong { border-color: var(--red); background: rgba(255,59,74,.1); box-shadow: 0 0 14px rgba(255,59,74,.22); }
  .opt .mark { float: right; font-weight: 700; }

  .fb { margin-top: 14px; border-left: 3px solid var(--blue); padding: 10px 14px; border-radius: 0 10px 10px 0;
    background: rgba(53,182,255,.06); font-size: 14px; line-height: 1.55; display: none; }
  .fb.show { display: block; animation: pop .4s cubic-bezier(.2,1.2,.4,1); }
  .fb.ok { border-left-color: var(--green); background: rgba(61,220,132,.08); }
  .fb.no { border-left-color: var(--red); background: rgba(255,59,74,.07); }
  .fb .ref { display: block; margin-top: 6px; font: 400 12.5px var(--body); color: var(--dim); }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<!-- Standalone escape hatch, hidden while embedded in the Unit 1 lesson frame. -->
<a id="standalone-home" href="../../../../../" target="_top" hidden
   style="position:fixed;top:12px;left:12px;z-index:9999;font:500 12px ui-monospace,monospace;
          padding:7px 12px;border-radius:6px;background:rgba(20,24,31,.92);color:var(--dim,#8A93A0);
          text-decoration:none;border:1px solid rgba(255,255,255,.14)">← Portfolio</a>
<script>if (window.self === window.top) document.getElementById('standalone-home').hidden = false;</script>

<div class="wrap">
  <h1 id="title">Six questions on the four tells</h1>
  <p class="lead" id="lead">Choose an answer on each card to see why it is right or wrong.</p>
  <div id="deck"></div>
  <p class="lead" id="sum" role="status" hidden></p>
  <button id="retry" style="display:none;margin-top:6px;font-size:13px;font-weight:600;color:#fff;background:rgba(53,182,255,.15);border:1px solid #35B6FF;border-radius:10px;padding:9px 16px;cursor:pointer">Try again</button>
</div>

<script>
const C = { blue:'#35B6FF', red:'#FF3B4A', green:'#3DDC84', lime:'#C6F221', dim:'#8A93A0' };
// mail scenario: {from, subj, body(html)} · or plain {q} question
// part:'probe' items open the unit, before the film (?part=probe): a gut call,
// not scored. Everything else is the check after the lesson.
// Trust / Report cards always list Trust first, so position never gives the answer away.
const ALL = [
  { id:'u1-probe-1', part:'probe', tag:'cold probe · Trust / Report',
    mail:{ from:'Comms Team &lt;newsletter@yourcompany.com&gt;', subj:'March town hall — recording and slides', time:'Mon 08:47',
      body:'Hi all, the recording from Tuesday\'s town hall is now on the intranet. Slides attached.' },
    opts:[
      { t:'Trust', ok:true, fb:"The sender is one you were expecting, the address is your company's own, and nothing hurries you or asks for anything. Most of your mail looks like this one." },
      { t:'Report', ok:false, fb:"Being careful is good, but this one is clean: a known sender at your real internal address, asking for nothing. If everything like it got reported, the real warnings would get lost." },
    ], ref:'27002 §6.3' },

  { id:'u1-probe-2', part:'probe', tag:'cold probe · Trust / Report',
    mail:{ from:'IT Support &lt;it-helpdesk@yourcompany-security.net&gt;', subj:'ACTION REQUIRED: password expires in 2 hours', time:'Mon 08:58',
      body:'Your network password expires today at 17:00. To avoid losing access, confirm your current password here: <span class="mono">[Verify now]</span>' },
    opts:[
      { t:'Trust', ok:false, fb:"This message catches most people, and it was built to. It sets a two-hour deadline you never heard about and comes from a domain that almost matches yours. It also asks for your password, and any one of those is reason to stop." },
      { t:'Report', ok:true, fb:"It shows three tells at once: a deadline out of nowhere, a look-alike domain that isn't your company's, and a request to confirm your password. IT never asks for that by email." },
    ], ref:'27002 §8.7, §5.17' },

  { id:'u1-probe-3', part:'probe', tag:'cold probe · Trust / Report',
    mail:{ from:'Accounts &lt;billing@supplier-invoices.com&gt;', subj:'Overdue invoice #48213 — final notice', time:'Mon 09:14',
      body:'Please find attached the outstanding invoice. Settle within 24 hours to avoid escalation. <span class="mono">[invoice_48213.zip]</span>' },
    opts:[
      { t:'Trust', ok:false, fb:"You weren't expecting this invoice, and supplier-invoices.com isn't a supplier you know. A surprise invoice with a 24-hour deadline and a zip file attached fits the usual pattern for malware." },
      { t:'Report', ok:true, fb:"The invoice is unexpected and urgent and arrives as a zip file from a domain you don't recognise. That is how malware usually gets in. If it might be genuine, check with finance through a channel you choose yourself." },
    ], ref:'27002 §8.7' },

  { id:'u1-check-1', tag:'check · spotting a tell',
    q:"A message you weren't expecting gives you two hours to act. Which tell is that?",
    opts:[
      { t:'Look-alike sender domain', ok:false, fb:"The question doesn't mention the sender's address at all. What it describes is timing: a surprise message that pushes you to hurry." },
      { t:'Unexpected and urgent', ok:true, fb:"Pressure out of nowhere is there to make you skip thinking, and nothing legitimate breaks when you take a minute to check." },
      { t:'Asks for secrets', ok:false, fb:"Nothing has been asked for yet. A deadline on a message you didn't expect is the first tell, unexpected and urgent." },
      { t:'Link mismatch', ok:false, fb:"There is no link in this message yet. The surprise and the two-hour deadline are what give it away." },
    ], ref:'27002 §8.7' },

  { id:'u1-check-2', tag:'check · the rule',
    q:"How many tells does a message need before you stop and check it?",
    opts:[
      { t:'At least two, to be sure', ok:false, fb:"Waiting for a second tell gives the first one time to work on you. One is already enough to stop and check." },
      { t:'All four, to be certain', ok:false, fb:"Asking for all four sets the bar so high that a message with one clear tell would get through." },
      { t:'Only once IT confirms it', ok:false, fb:"Stopping to check doesn't need IT. One tell is enough to pause and check the message through another channel." },
      { t:"A single tell is enough", ok:true, fb:"Any one tell is reason to stop and check the message through another channel. Report it when the tells point to phishing or the check doesn't confirm the sender." },
    ], ref:'27002 §8.7, §6.8' },

  { id:'u1-check-3', tag:'check · asks for secrets',
    q:"An email signed \"IT Support\" asks you to confirm your current password. What should you make of that?",
    opts:[
      { t:"A tell in itself, since IT never needs it", ok:true, fb:"IT has admin access and never needs your password. A request for it by email is reason to stop even when everything else looks clean." },
      { t:"It is routine, so confirm it", ok:false, fb:"No legitimate system asks you to confirm your password by email. IT resets passwords when it needs to and has no reason to collect them." },
      { t:'Fine as long as the sender domain matches', ok:false, fb:"A request for your credentials by email is a tell in itself, whether the domain matches or not." },
      { t:'Reply to ask whether it\'s real', ok:false, fb:"A reply only asks the sender to vouch for themselves. Check through a channel you choose instead." },
    ], ref:'27002 §5.17, §8.7' },

  { id:'u1-check-4', tag:'check · the safe move',
    q:"Why is it better to report a phishing email than to delete it?",
    opts:[
      { t:"Deleting it removes the threat", ok:false, fb:"The same phish usually lands in other inboxes as well. Deleting your copy does nothing for the colleagues who might still click it." },
      { t:'It punishes the person who sent it', ok:false, fb:"Reporting has nothing to do with punishing the sender. It gives the security team a live sample they can use to protect everyone else." },
      { t:'Security can warn everyone who got it', ok:true, fb:"A report lets security warn everyone else who received the same message before they click it, while deleting protects only your own inbox." },
      { t:'Deleting would break the reply chain', ok:false, fb:"Deleting leaves the reply chain as it was. Reporting matters because security can then warn the next person who gets the message." },
    ], ref:'27002 §6.8, §8.7' },

  { id:'u1-perf-1', tag:'harder · payment fraud',
    mail:{ from:'Mark Ellis (CFO) &lt;m.ellis@yourcompany-finance.com&gt;', subj:'Supplier payment — needs to go today', time:'Mon 09:32',
      body:'I\'m on a flight and offline until tonight. Northwind changed banks, so pay their open invoice to the new account before 15:00 or we miss the payment run. Details attached. No need to loop in Accounts Payable, I\'ll sign it off when I land. <span class="mono">[northwind_new_bank_details.pdf]</span>' },
    opts:[
      { t:'Trust', ok:false, fb:"The name is right and the message reads like a note from a busy finance lead. The address, yourcompany-finance.com, isn't your company's. It also asks you to move money today without the people who would normally check it." },
      { t:'Report', ok:true, fb:"A look-alike domain, a same-day deadline, new bank details and a push to leave out Accounts Payable together make up the usual pattern of payment fraud by email. \"Offline until tonight\" is there so you can't check with him. Confirm any change of bank details by calling the supplier on a number you already have, never one from the email or its attachment." },
    ], ref:'27002 §6.3, §6.8' },

  { id:'u1-perf-2', tag:'harder · plausible notification',
    mail:{ from:'SharePoint &lt;no-reply@sharepointonline.com&gt;', subj:'Priya Nair shared "Q3-planning.xlsx" with you', time:'Mon 09:45',
      body:'<span style="color:#1a73e8;text-decoration:underline">Open document</span><span class="mono" style="display:block;margin-top:10px;font-size:12px;color:#5f6368">Hover shows: <span style="color:#d93025">http://docs-share-view.ru/a8f2</span></span>' },
    opts:[
      { t:'Trust', ok:false, fb:"Everything looks routine apart from the link. Hovering shows docs-share-view.ru, which is not your document platform. If you are unsure, ask the colleague in chat instead of replying to the email." },
      { t:'Report', ok:true, fb:"The link is the only visible tell: the sender looks plausible and sharing files is normal, but hovering shows an unknown domain instead of your document platform." },
    ], ref:'27002 §8.7' },
];

const PART = new URLSearchParams(location.search).get('part') === 'probe' ? 'probe' : 'check';
const ITEMS = ALL.filter(i => (i.part || 'check') === PART);
const deck = document.getElementById('deck');
const PASS = 5;                          // proceed at 5 of 6 correct, no need to ace it
let answered = 0, correct = 0, passed = false;

if (PART === 'probe') {
  document.getElementById('title').textContent = 'Three messages from a Monday morning';
  document.getElementById('lead').textContent = 'Read each message and decide on your first impression whether you would trust it or report it. Nothing is scored here, and the film that follows explains each case.';
}

// Probe: unscored. Answering all three unlocks the film and sums up the gut call.
function probeDone() {
  const sum = document.getElementById('sum');
  sum.hidden = false;
  sum.textContent = `You judged ${correct} of ${ITEMS.length} correctly. The film that comes next walks through the four tells behind each of these messages.`;
  try { window.parent && window.parent.postMessage({ type: 'u1-progress', id: 'probe' }, '*'); } catch (e) {}
}

function updateScore() {
  if (PART === 'probe') { if (answered === ITEMS.length) probeDone(); return; }
  // The score lives in the lesson shell's sticky bar (this iframe doesn't
  // scroll), mirrored via postMessage. No in-page score row.
  try { window.parent && window.parent.postMessage({ type: 'u1-quiz-score', answered, correct, total: ITEMS.length, pass: PASS, passed }, '*'); } catch (e) {}
  // Retry only matters as a rescue: all answered, still short of the bar.
  document.getElementById('retry').style.display =
    (answered === ITEMS.length && !passed) ? 'inline-block' : 'none';
}

function markPassed() {
  passed = true;
  // Tell the SCORM shell this step is cleared.
  try { window.parent && window.parent.postMessage({ type: 'u1-progress', id: 'questions' }, '*'); } catch (e) {}
}

// --- Gmail-look rendering helpers for mail-styled items (feedback item 21) ---
// `from` strings carry literal &lt;/&gt; entities around the address. Split on
// the entity-escaped brackets only, so any markup inside the address survives.
// Nothing in the address is highlighted before the answer: spotting it is the task.
function parseFrom(raw) {
  const m = raw.match(/^(.*?)&lt;(.*)&gt;\s*$/);
  return m ? { name: m[1].trim(), addr: m[2].trim() } : { name: raw.trim(), addr: '' };
}
const AVATAR_COLORS = ['#1a73e8', '#d93025', '#188038', '#f9ab00', '#9334e6', '#12b5cb', '#e8710a'];
function avatarColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function avatarInitial(name) {
  const letters = name.replace(/[^A-Za-z]/g, '');
  return (letters[0] || '?').toUpperCase();
}
const ATTACH_ICON = '<svg width="16" height="16" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="#8f9296"/><path d="M14 2v6h6z" fill="#c7c9cc"/></svg>';
// Existing bodies mark placeholders with a `.mono` span. Filename-looking
// ones (probe-3's zip) become a Gmail-style attachment chip; the rest (link
// call-to-actions like "[Verify now]") become believable blue link text.
// Data itself is untouched, this only reshapes the rendered HTML.
function renderMailBody(html) {
  html = html.replace(/<span class="mono">\[([^\]]+\.(?:zip|pdf|docx?|xlsx?|pptx?))\]<\/span>/gi,
    (m, fname) => `<br><span class="attach-chip">${ATTACH_ICON}${fname}</span>`);
  html = html.replace(/<span class="mono">\[([^\]]+)\]<\/span>/g,
    (m, text) => `<span class="mail-link">${text}</span>`);
  return html;
}
function renderMailScenario(mail) {
  const { name, addr } = parseFrom(mail.from);
  const initial = avatarInitial(name);
  const addrHtml = addr ? ` <span class="mail-addr">&lt;${addr}&gt;</span>` : '';
  return `<div class="mail">` +
    `<div class="mail-subj">${mail.subj}</div>` +
    `<div class="mail-h">` +
      `<div class="av" style="background:${avatarColor(name)}">${initial}</div>` +
      `<div class="mail-meta">` +
        `<div class="mail-fromrow"><span class="mail-name">${name}</span>${addrHtml}</div>` +
        `<div class="mail-to">to me</div>` +
      `</div>` +
      `<div class="mail-time">${mail.time}</div>` +
    `</div>` +
    `<div class="mail-body">${renderMailBody(mail.body)}</div>` +
  `</div>`;
}

function buildDeck() {
  deck.innerHTML = '';
  ITEMS.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    const scenario = item.mail
      ? renderMailScenario(item.mail)
      : `<div class="qtext">${item.q}</div>`;
    card.innerHTML = `<div class="eyebrow">Question ${idx + 1} of ${ITEMS.length}</div>${scenario}<div class="opts"></div><div class="fb" role="status"></div>`;
    const optsBox = card.querySelector('.opts');
    const fb = card.querySelector('.fb');
    item.opts.forEach(o => {
      const b = document.createElement('button');
      b.className = 'opt';
      b.innerHTML = o.t;
      b.onclick = () => {
        if (card.dataset.done) return;
        card.dataset.done = '1'; answered++;
        if (o.ok) correct++;
        optsBox.querySelectorAll('.opt').forEach(x => x.disabled = true);
        b.classList.add(o.ok ? 'correct' : 'wrong');
        const mk = document.createElement('span'); mk.className = 'mark'; mk.textContent = o.ok ? '✓' : '✕';
        mk.style.color = o.ok ? C.green : C.red; b.appendChild(mk);
        if (!o.ok) optsBox.querySelectorAll('.opt').forEach((x, i) => { if (item.opts[i].ok) x.classList.add('correct'); });
        fb.className = 'fb show ' + (o.ok ? 'ok' : 'no');
        fb.innerHTML = o.fb + `<span class="ref">ISO ${item.ref}</span>`;
        if (PART === 'check' && !passed && correct >= PASS) markPassed();   // unlock as soon as the bar is met
        updateScore();
      };
      optsBox.appendChild(b);
    });
    deck.appendChild(card);
  });
}

// Rescue path: fell short across all six → wipe answers and try again (passed can't be true here).
// The lesson shell grows this frame to its content, so the page that scrolls is
// the parent: bring the top of the frame back into view there.
function retry() {
  answered = 0; correct = 0; buildDeck(); updateScore();
  window.scrollTo(0, 0);
  // The lesson bar is sticky, so leave room for it above the frame.
  try { if (window.frameElement) { window.frameElement.scrollIntoView({ block: 'start' }); window.parent.scrollBy(0, -90); } } catch (e) {}
}
document.getElementById('retry').onclick = retry;

buildDeck();
updateScore();
</script>
</body>
</html>
