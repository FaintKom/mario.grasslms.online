<script type="text/babel">
// @ds-adherence-ignore -- omelette starter scaffold (raw elements/hex/px by design)

/* BEGIN USAGE */
// animations.jsx — timeline engine. Exports (on window): Stage, Sprite,
//   TextSprite, ImageSprite, RectSprite, VideoSprite, PlaybackBar,
//   useTime, useTimeline, useSprite, Easing, interpolate, animate, clamp.
//
//   <Stage width={1280} height={720} duration={10} background="#f6f4ef">
//     <Sprite start={0} end={3}>
//       <TextSprite text="Hello" x={100} y={300} size={72} color="#111" />
//     </Sprite>
//     <Sprite start={2} end={8}>
//       <ImageSprite src="hero.png" x={200} y={120} width={640} height={360} kenBurns />
//     </Sprite>
//   </Stage>
//
// Stage({width,height,duration,background,fps,loop,autoplay}) — auto-scales to
//   viewport; scrubber + play/pause + ←/→ seek + space + 0-reset; persists
//   playhead. The canvas is an <svg><foreignObject>, export-ready: Share →
//   Export → Video (or the PlaybackBar's download button) renders it to .mp4.
//   Screenshot tools DOM-rerender (not pixel-capture) and unwrap this wrapper
//   so captures should work — but if one comes back black, that's a capture
//   artifact, not a render bug; trust the live preview.
// Sprite({start,end,keepMounted}) — mounts children only while playhead is in
//   [start,end]. Children read {localTime, progress, duration} via useSprite().
// useTime() → seconds; useTimeline() → {time,duration,playing,setTime,setPlaying}.
// TextSprite({text,x,y,size,color,font,weight,align,entryDur,exitDur}) — fades/scales in+out.
// ImageSprite({src,x,y,width,height,fit,radius,kenBurns,placeholder}) — same, with optional ken-burns.
// RectSprite({x,y,width,height,color,radius}) — solid box with entry/exit.
// VideoSprite({src,start,end,speed,style}) — looped <video> clip synced to the
//   timeline; its audio is mixed into the exported video.
// Easing.{linear,easeIn/Out/InOut Quad/Cubic/Quart/Quint/Expo/Back, …}
// interpolate([t0,t1,…],[v0,v1,…],ease?) → (t)=>v  — piecewise tween.
// animate({from,to,start,end,ease}) → (t)=>v  — single tween.
//
// Build scenes by composing Sprites inside Stage. Absolutely-position elements.
//
// In a .dc.html project, put your scene in a sibling my-scene.jsx (reading
// {Stage, Sprite, useTime, Easing, …} from window is safe) and mount BOTH:
//   <x-import component-from-global-scope="MyScene"
//             from="./animations.jsx ./my-scene.jsx"></x-import>
// The two files in from= load in order, so my-scene.jsx can use the globals
// animations.jsx set.
/* END USAGE */
// ─────────────────────────────────────────────────────────────────────────────

// ── Easing functions (hand-rolled, Popmotion-style) ─────────────────────────
// All easings take t ∈ [0,1] and return eased t ∈ [0,1] (may overshoot for back/elastic).
const Easing = {
  linear: (t) => t,

  // Quad
  easeInQuad:    (t) => t * t,
  easeOutQuad:   (t) => t * (2 - t),
  easeInOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),

  // Cubic
  easeInCubic:    (t) => t * t * t,
  easeOutCubic:   (t) => (--t) * t * t + 1,
  easeInOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),

  // Quart
  easeInQuart:    (t) => t * t * t * t,
  easeOutQuart:   (t) => 1 - (--t) * t * t * t,
  easeInOutQuart: (t) => (t < 0.5 ? 8 * t * t * t * t : 1 - 8 * (--t) * t * t * t),

  // Expo
  easeInExpo:  (t) => (t === 0 ? 0 : Math.pow(2, 10 * (t - 1))),
  easeOutExpo: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  easeInOutExpo: (t) => {
    if (t === 0) return 0;
    if (t === 1) return 1;
    if (t < 0.5) return 0.5 * Math.pow(2, 20 * t - 10);
    return 1 - 0.5 * Math.pow(2, -20 * t + 10);
  },

  // Sine
  easeInSine:    (t) => 1 - Math.cos((t * Math.PI) / 2),
  easeOutSine:   (t) => Math.sin((t * Math.PI) / 2),
  easeInOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,

  // Back (overshoot)
  easeOutBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  },
  easeInBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return c3 * t * t * t - c1 * t * t;
  },
  easeInOutBack: (t) => {
    const c1 = 1.70158, c2 = c1 * 1.525;
    return t < 0.5
      ? (Math.pow(2 * t, 2) * ((c2 + 1) * 2 * t - c2)) / 2
      : (Math.pow(2 * t - 2, 2) * ((c2 + 1) * (t * 2 - 2) + c2) + 2) / 2;
  },

  // Elastic
  easeOutElastic: (t) => {
    const c4 = (2 * Math.PI) / 3;
    if (t === 0) return 0;
    if (t === 1) return 1;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
  },
};

// ── Core interpolation helpers ──────────────────────────────────────────────

// Clamp a value to [min, max]
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

// interpolate([0, 0.5, 1], [0, 100, 50], ease?) -> fn(t)
// Popmotion-style: linearly maps t across input keyframes to output values,
// with optional easing per segment (single fn or array of fns).
function interpolate(input, output, ease = Easing.linear) {
  return (t) => {
    if (t <= input[0]) return output[0];
    if (t >= input[input.length - 1]) return output[output.length - 1];
    for (let i = 0; i < input.length - 1; i++) {
      if (t >= input[i] && t <= input[i + 1]) {
        const span = input[i + 1] - input[i];
        const local = span === 0 ? 0 : (t - input[i]) / span;
        const easeFn = Array.isArray(ease) ? (ease[i] || Easing.linear) : ease;
        const eased = easeFn(local);
        return output[i] + (output[i + 1] - output[i]) * eased;
      }
    }
    return output[output.length - 1];
  };
}

// animate({from, to, start, end, ease})(t) — simpler single-segment tween.
// Returns `from` before `start`, `to` after `end`.
function animate({ from = 0, to = 1, start = 0, end = 1, ease = Easing.easeInOutCubic }) {
  return (t) => {
    if (t <= start) return from;
    if (t >= end) return to;
    const local = (t - start) / (end - start);
    return from + (to - from) * ease(local);
  };
}

// ── Timeline context ────────────────────────────────────────────────────────

const TimelineContext = React.createContext({ time: 0, duration: 10, playing: false });

const useTime = () => React.useContext(TimelineContext).time;
const useTimeline = () => React.useContext(TimelineContext);

// ── Sprite ──────────────────────────────────────────────────────────────────
// Renders children only when the playhead is inside [start, end]. Provides
// a sub-context with `localTime` (seconds since start) and `progress` (0..1).
//
//   <Sprite start={2} end={5}>
//     {({ localTime, progress }) => <Thing x={progress * 100} />}
//   </Sprite>
//
// Or as a plain wrapper — children can call useSprite() themselves.

const SpriteContext = React.createContext({ localTime: 0, progress: 0, duration: 0 });
const useSprite = () => React.useContext(SpriteContext);

function Sprite({ start = 0, end = Infinity, children, keepMounted = false }) {
  const { time } = useTimeline();
  const visible = time >= start && time <= end;
  if (!visible && !keepMounted) return null;

  const duration = end - start;
  const localTime = Math.max(0, time - start);
  const progress = duration > 0 && isFinite(duration)
    ? clamp(localTime / duration, 0, 1)
    : 0;

  const value = { localTime, progress, duration, visible };

  return (
    <SpriteContext.Provider value={value}>
      {typeof children === 'function' ? children(value) : children}
    </SpriteContext.Provider>
  );
}

// ── Sample sprite components ────────────────────────────────────────────────

// TextSprite: fades/slides text in on entry, holds, then fades out on exit.
// Props: text, x, y, size, color, font, entryDur, exitDur, align
function TextSprite({
  text,
  x = 0, y = 0,
  size = 48,
  color = '#111',
  font = 'Inter, system-ui, sans-serif',
  weight = 600,
  entryDur = 0.45,
  exitDur = 0.35,
  entryEase = Easing.easeOutBack,
  exitEase = Easing.easeInCubic,
  align = 'left',
  letterSpacing = '-0.01em',
}) {
  const { localTime, duration } = useSprite();
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let ty = 0;

  if (localTime < entryDur) {
    const t = entryEase(clamp(localTime / entryDur, 0, 1));
    opacity = t;
    ty = (1 - t) * 16;
  } else if (localTime > exitStart) {
    const t = exitEase(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    ty = -t * 8;
  }

  const translateX = align === 'center' ? '-50%' : align === 'right' ? '-100%' : '0';

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      transform: `translate(${translateX}, ${ty}px)`,
      opacity,
      fontFamily: font,
      fontSize: size,
      fontWeight: weight,
      color,
      letterSpacing,
      whiteSpace: 'pre',
      lineHeight: 1.1,
      willChange: 'transform, opacity',
    }}>
      {text}
    </div>
  );
}

// ImageSprite: scales + fades in; optional Ken Burns drift during hold.
function ImageSprite({
  src,
  x = 0, y = 0,
  width = 400, height = 300,
  entryDur = 0.6,
  exitDur = 0.4,
  kenBurns = false,
  kenBurnsScale = 1.08,
  radius = 12,
  fit = 'cover',
  placeholder = null, // {label: string} for striped placeholder
}) {
  const { localTime, duration } = useSprite();
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let scale = 1;

  if (localTime < entryDur) {
    const t = Easing.easeOutCubic(clamp(localTime / entryDur, 0, 1));
    opacity = t;
    scale = 0.96 + 0.04 * t;
  } else if (localTime > exitStart) {
    const t = Easing.easeInCubic(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    scale = (kenBurns ? kenBurnsScale : 1) + 0.02 * t;
  } else if (kenBurns) {
    const holdSpan = exitStart - entryDur;
    const holdT = holdSpan > 0 ? (localTime - entryDur) / holdSpan : 0;
    scale = 1 + (kenBurnsScale - 1) * holdT;
  }

  const content = placeholder ? (
    <div style={{
      width: '100%', height: '100%',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: 'repeating-linear-gradient(135deg, #e9e6df 0 10px, #dcd8cf 10px 20px)',
      color: '#6b6458',
      fontFamily: 'JetBrains Mono, ui-monospace, monospace',
      fontSize: 13,
      letterSpacing: '0.04em',
      textTransform: 'uppercase',
    }}>
      {placeholder.label || 'image'}
    </div>
  ) : (
    <img src={src} alt="" style={{ width: '100%', height: '100%', objectFit: fit, display: 'block' }} />
  );

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      width, height,
      opacity,
      transform: `scale(${scale})`,
      transformOrigin: 'center',
      borderRadius: radius,
      overflow: 'hidden',
      willChange: 'transform, opacity',
    }}>
      {content}
    </div>
  );
}

// RectSprite: simple rectangle that animates position/size/color via props.
// Useful demo primitive — takes a `render` fn for per-frame customization.
function RectSprite({
  x = 0, y = 0,
  width = 100, height = 100,
  color = '#111',
  radius = 8,
  entryDur = 0.4,
  exitDur = 0.3,
  render, // optional: (ctx) => style overrides
}) {
  const spriteCtx = useSprite();
  const { localTime, duration } = spriteCtx;
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let scale = 1;

  if (localTime < entryDur) {
    const t = Easing.easeOutBack(clamp(localTime / entryDur, 0, 1));
    opacity = clamp(localTime / entryDur, 0, 1);
    scale = 0.4 + 0.6 * t;
  } else if (localTime > exitStart) {
    const t = Easing.easeInQuad(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    scale = 1 - 0.15 * t;
  }

  const overrides = render ? render(spriteCtx) : {};

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      width, height,
      background: color,
      borderRadius: radius,
      opacity,
      transform: `scale(${scale})`,
      transformOrigin: 'center',
      willChange: 'transform, opacity',
      ...overrides,
    }} />
  );
}


// ── Font inlining ───────────────────────────────────────────────────────────
// Copy every @font-face rule from the page into a <style> inside the svg's
// foreignObject, with font URLs rewritten to data: URLs. Makes the svg
// self-describing so serializing it alone (video export fast path) still
// renders with the right fonts. Sets data-om-fonts-inlined on the svg when
// done so the exporter can wait for it.

function useInlineFontsInto(svgRef) {
  React.useEffect(() => {
    const svg = svgRef.current;
    const host = svg && svg.querySelector('foreignObject > div');
    if (!svg || !host) return;
    let cancelled = false;
    (async () => {
      const rules = [];
      for (const ss of document.styleSheets) {
        let cssRules;
        try { cssRules = ss.cssRules; } catch {
          // Cross-origin sheet without crossorigin attr (e.g. the standard
          // fonts.googleapis.com <link>) — fetch the CSS text directly and
          // regex-extract the @font-face blocks.
          if (ss.href) {
            try {
              const txt = await fetch(ss.href).then(r => { if (!r.ok) throw 0; return r.text(); });
              for (const ff of (txt.match(/@font-face\s*{[^}]*}/g) || []))
                rules.push({ css: ff, base: ss.href });
            } catch {}
          }
          continue;
        }
        if (!cssRules) continue;
        for (const r of cssRules) {
          if (r.type === CSSRule.FONT_FACE_RULE) {
            rules.push({ css: r.cssText, base: ss.href || location.href });
          }
        }
      }
      const toDataURL = (url) => fetch(url)
        .then(r => { if (!r.ok) throw 0; return r.blob(); })
        .then(b => new Promise(res => {
          const fr = new FileReader();
          fr.onload = () => res(fr.result);
          fr.onerror = () => res(url);
          fr.readAsDataURL(b);
        }))
        .catch(() => url);
      const parts = await Promise.all(rules.map(async ({ css, base }) => {
        const re = /url\((['"]?)([^'")]+)\1\)/g;
        let out = css, m;
        while ((m = re.exec(css))) {
          const u = m[2];
          if (u.startsWith('data:')) continue;
          let abs; try { abs = new URL(u, base).href; } catch { continue; }
          out = out.split(m[0]).join(`url("${await toDataURL(abs)}")`);
        }
        return out;
      }));
      if (cancelled || !parts.length) {
        svg.setAttribute('data-om-fonts-inlined', 'true');
        return;
      }
      const style = document.createElement('style');
      style.textContent = parts.join('\n');
      host.insertBefore(style, host.firstChild);
      svg.setAttribute('data-om-fonts-inlined', 'true');
    })();
    return () => { cancelled = true; };
  }, []);
}


function Stage({
  width = 1280,
  height = 720,
  duration = 10,
  background = '#f6f4ef',
  fps = 60,
  loop = true,
  autoplay = true,
  persistKey = 'animstage',
  children,
}) {
  // Props arrive as strings when Stage is mounted via <x-import> (DC
  // projects) — coerce so style={{width}} gets a number React can px-ify.
  width = +width || 1280; height = +height || 720;
  duration = +duration || 10; fps = +fps || 60;
  if (typeof loop === 'string') loop = loop !== 'false';
  if (typeof autoplay === 'string') autoplay = autoplay !== 'false';

  const [time, setTime] = React.useState(() => {
    try {
      const v = parseFloat(localStorage.getItem(persistKey + ':t') || '0');
      return isFinite(v) ? clamp(v, 0, duration) : 0;
    } catch { return 0; }
  });
  const [playing, setPlaying] = React.useState(autoplay);
  const [scale, setScale] = React.useState(1);
  const [rate, setRate] = React.useState(1);       // playback speed — drives clock, audio, subs together
  const [subsOn, setSubsOn] = React.useState(true);
  const rateRef = React.useRef(1); rateRef.current = rate;  // read in the rAF loop without restarting it

  const stageRef = React.useRef(null);
  const canvasRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const lastTsRef = React.useRef(null);

  // Persist playhead
  React.useEffect(() => {
    try { localStorage.setItem(persistKey + ':t', String(time)); } catch {}
  }, [time, persistKey]);

  // Auto-scale to fit viewport
  React.useEffect(() => {
    if (!stageRef.current) return;
    const el = stageRef.current;
    const measure = () => {
      const barH = 44; // playback bar height
      const s = Math.min(
        el.clientWidth / width,
        (el.clientHeight - barH) / height
      );
      setScale(Math.max(0.05, s));
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    window.addEventListener('resize', measure);
    return () => {
      ro.disconnect();
      window.removeEventListener('resize', measure);
    };
  }, [width, height]);

  // Animation loop
  React.useEffect(() => {
    if (!playing) {
      lastTsRef.current = null;
      return;
    }
    const step = (ts) => {
      if (lastTsRef.current == null) lastTsRef.current = ts;
      const dt = (ts - lastTsRef.current) / 1000;
      lastTsRef.current = ts;
      // The voiceover is the master clock while it is actually playing: follow
      // audio.currentTime so its own pauses play out and there is no seek-jitter
      // from two clocks fighting (rAF vs audio). Fall back to integrating dt only
      // when there is no audio, or it is paused/buffering. audio.playbackRate
      // already carries the speed setting, so this stays correct at any rate.
      const a = document.getElementById('vo');
      const audioClock = a && !a.paused && !a.ended && a.readyState >= 2;
      setTime((t) => {
        let next = audioClock ? a.currentTime : t + dt * rateRef.current;
        if (next >= duration) {
          if (loop) { if (audioClock) { try { a.currentTime = 0; } catch (e) {} } next = audioClock ? 0 : next % duration; }
          else { next = duration; setPlaying(false); }
        }
        return next;
      });
      rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      lastTsRef.current = null;
    };
  }, [playing, duration, loop]);

  // Keyboard (video-player conventions):
  //   space / k → play-pause (restarts when finished)
  //   ← →       → 5s   (shift = 1s fine step)
  //   j / l     → 10s
  //   m         → mute   ·   0 / Home → start
  React.useEffect(() => {
    const onKey = (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'Space' || e.code === 'KeyK') {
        e.preventDefault();
        toggleRef.current();
      } else if (e.code === 'ArrowLeft') {
        setTime(t => clamp(t - (e.shiftKey ? 1 : 5), 0, duration));
      } else if (e.code === 'ArrowRight') {
        setTime(t => clamp(t + (e.shiftKey ? 1 : 5), 0, duration));
      } else if (e.code === 'KeyJ') {
        setTime(t => clamp(t - 10, 0, duration));
      } else if (e.code === 'KeyL') {
        setTime(t => clamp(t + 10, 0, duration));
      } else if (e.code === 'KeyM') {
        setMuted(m => !m);
      } else if (e.code === 'KeyC') {
        setSubsOn(s => !s);
      } else if (e.code === 'KeyF') {
        toggleFullscreen();
      } else if (e.key === '0' || e.code === 'Home') {
        setTime(0);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [duration]);

  // Video-export protocol: the exporter dispatches this event per frame;
  // pause + sync the playhead so the capture sees exactly that timestamp.
  React.useEffect(() => {
    const el = canvasRef.current;
    if (!el) return;
    const onSeek = (e) => {
      setPlaying(false);
      setTime(clamp(e.detail.time, 0, duration));
    };
    el.addEventListener('data-om-seek-to-time-frame', onSeek);
    return () => el.removeEventListener('data-om-seek-to-time-frame', onSeek);
  }, [duration]);

  // Inline @font-face rules into the svg's foreignObject so the svg is
  // self-describing — serializing it alone (for video export) then renders
  // with the right fonts. Sets data-om-fonts-inlined once done.
  useInlineFontsInto(canvasRef);

  // Programmatic timeline holds pause playback without it being a user pause,
  // so the big Play overlay must stay hidden while holding.
  const [holding, setHolding] = React.useState(false);

  // Mute the VO track (kept in Stage so overlay + bar share one source of truth).
  const [muted, setMuted] = React.useState(false);
  React.useEffect(() => {
    const a = document.getElementById('vo');
    if (a) a.muted = muted;
  }, [muted]);

  // "Toggle play" that also restarts a finished, non-looping clip. Reads the
  // live playhead through a ref so the keyboard handler never goes stale.
  const timeRef = React.useRef(0); timeRef.current = time;
  const handleToggle = React.useCallback(() => {
    if (!loop && timeRef.current >= duration - 0.05) { setTime(0); setPlaying(true); }
    else setPlaying(p => !p);
  }, [loop, duration]);
  const toggleRef = React.useRef(handleToggle); toggleRef.current = handleToggle;

  // Finished + paused at the very end (nothing left to resume) → show Replay.
  const ended = !loop && !playing && time >= duration - 0.05;

  const ctxValue = React.useMemo(
    () => ({ time, duration, playing, setTime, setPlaying, setHolding, rate, subsOn }),
    [time, duration, playing, rate, subsOn]
  );

  return (
    <div
      ref={stageRef}
      style={{
        position: 'absolute', inset: 0,
        display: 'flex', flexDirection: 'column',
        alignItems: 'center',
        background: '#0a0a0a',
        fontFamily: 'Inter, system-ui, sans-serif',
      }}
    >
      {/* Canvas area — vertically centered in remaining space.
          Standard video UX: while PLAYING, a click anywhere on the stage
          pauses (the big Resume overlay then makes the state obvious, so a
          learner who clicked the email graphic understands what happened).
          While paused, the overlay below is the click target for resume. */}
      <div
        onClick={playing ? handleToggle : undefined}
        style={{
          flex: 1,
          width: '100%',
          position: 'relative',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          overflow: 'hidden',
          minHeight: 0,
          cursor: playing ? 'pointer' : 'default',
        }}>
        <svg
          ref={canvasRef}
          width={width} height={height}
          data-om-exportable-video-with-duration-secs={duration}
          style={{
            transform: `scale(${scale})`,
            transformOrigin: 'center',
            flexShrink: 0,
            boxShadow: '0 20px 60px rgba(0,0,0,0.4)',
            display: 'block',
          }}
        >
          <foreignObject x="0" y="0" width="100%" height="100%">
            <div
              xmlns="http://www.w3.org/1999/xhtml"
              style={{
                width, height,
                background,
                position: 'relative',
                overflow: 'hidden',
              }}
            >
              <TimelineContext.Provider value={ctxValue}>
                {children}
              </TimelineContext.Provider>
            </div>
          </foreignObject>
        </svg>

        {/* Big play / replay affordance — only while paused by the user (not
            during an automatic scene hold). This is the dedicated overlay
            play button: it IS clickable (unlike scene content) so the learner
            can resume/replay from here. Marked as chrome so it never lands in
            a video export (export logic keys off data-omelette-chrome, not
            pointer-events — see the playback bar below for precedent). */}
        {!playing && !holding && (
          <div data-omelette-chrome onClick={handleToggle} style={{
            position: 'absolute', inset: 0,
            display: 'flex', flexDirection: 'column', gap: 14,
            alignItems: 'center', justifyContent: 'center',
            cursor: 'pointer',
            background: ended ? 'rgba(14,17,22,0.55)' : 'rgba(14,17,22,0.25)',
            transition: 'background 160ms',
          }}>
            <div style={{
              width: 88, height: 88, borderRadius: '50%',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              background: 'rgba(53,182,255,0.16)',
              border: '1.5px solid rgba(53,182,255,0.65)',
              boxShadow: '0 0 34px rgba(53,182,255,0.4)',
              color: '#EAF2F9',
            }}>
              {ended ? (
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
                  <path d="M4 12a8 8 0 1 1 2.3 5.6" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"/>
                  <path d="M4 5v4h4" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              ) : (
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" style={{ marginLeft: 4 }}>
                  <path d="M6 4l14 8-14 8V4z" fill="currentColor"/>
                </svg>
              )}
            </div>
            <div style={{
              fontFamily: "'IBM Plex Mono', ui-monospace, monospace",
              fontSize: 12, letterSpacing: '0.14em', textTransform: 'uppercase',
              color: 'rgba(234,242,249,0.82)',
            }}>
              {ended ? 'Replay' : (time > 0.05 ? 'Resume' : 'Play')}
            </div>
          </div>
        )}
      </div>

      {/* Playback bar — stacked below canvas, never overlapping */}
      <PlaybackBar
        time={time}
        duration={duration}
        playing={playing}
        muted={muted}
        onMute={() => setMuted(m => !m)}
        onPlayPause={handleToggle}
        onReset={() => { setTime(0); }}
        onSeek={(t) => setTime(t)}
        rate={rate}
        onCycleRate={() => setRate(r => { const R=[0.5,0.75,1,1.25,1.5,2]; return R[(R.indexOf(r)+1)%R.length] ?? 1; })}
        hasSubs={!!(TIMING.subs && (TIMING.subs.en || Object.values(TIMING.subs)[0] || []).length)}
        subsOn={subsOn}
        onToggleSubs={() => setSubsOn(s => !s)}
      />
    </div>
  );
}

// ── Playback bar ────────────────────────────────────────────────────────────
// Play/pause, return-to-begin, scrub track, time display.
// Uses fixed-width time fields so layout doesn't thrash.

// Author-only controls (e.g. the video export/download button) are hidden from
// learners by default. Append ?author=1 to the URL to reveal them.
function isAuthorMode() {
  try { return new URLSearchParams(location.search).get('author') === '1'; } catch (e) { return false; }
}

function PlaybackBar({ time, duration, playing, muted, onMute, onPlayPause, onReset, onSeek, rate, onCycleRate, hasSubs, subsOn, onToggleSubs }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const [hoverX, setHoverX] = React.useState(null); // px offset for the time bubble
  const [fullscreen, setFullscreen] = React.useState(false);

  React.useEffect(() => {
    const onFs = () => setFullscreen(!!document.fullscreenElement);
    document.addEventListener('fullscreenchange', onFs);
    return () => document.removeEventListener('fullscreenchange', onFs);
  }, []);

  const timeFromEvent = React.useCallback((e) => {
    const rect = trackRef.current.getBoundingClientRect();
    const x = clamp((e.clientX - rect.left) / rect.width, 0, 1);
    return x * duration;
  }, [duration]);

  const onTrackMove = (e) => {
    if (!trackRef.current) return;
    const rect = trackRef.current.getBoundingClientRect();
    setHoverX(clamp(e.clientX - rect.left, 0, rect.width));
    if (dragging) onSeek(timeFromEvent(e));
  };

  const onTrackLeave = () => {
    setHoverX(null);
  };

  const onTrackDown = (e) => {
    setDragging(true);
    onSeek(timeFromEvent(e));
  };

  React.useEffect(() => {
    if (!dragging) return;
    const onUp = () => setDragging(false);
    const onMove = (e) => {
      if (!trackRef.current) return;
      const t = timeFromEvent(e);
      onSeek(t);
    };
    window.addEventListener('mouseup', onUp);
    window.addEventListener('mousemove', onMove);
    return () => {
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('mousemove', onMove);
    };
  }, [dragging, timeFromEvent, onSeek]);

  const pct = duration > 0 ? (time / duration) * 100 : 0;
  // Learner-facing clock: plain m:ss, no centiseconds.
  const fmt = (t) => {
    const total = Math.max(0, Math.round(t));
    const m = Math.floor(total / 60);
    const s = total % 60;
    return `${m}:${String(s).padStart(2, '0')}`;
  };

  const mono = 'JetBrains Mono, ui-monospace, SFMono-Regular, monospace';
  const hoverT = hoverX != null && trackRef.current
    ? (hoverX / trackRef.current.getBoundingClientRect().width) * duration
    : null;

  return (
    <div data-omelette-chrome style={{
      display: 'flex', alignItems: 'center', gap: 'clamp(6px, 2vw, 12px)',
      padding: '8px clamp(10px, 3vw, 16px)',
      background: 'rgba(20,20,20,0.92)',
      borderTop: '1px solid rgba(255,255,255,0.08)',
      width: '100%',
      maxWidth: 680,
      alignSelf: 'center',

      borderRadius: 8,
      color: '#f6f4ef',
      fontFamily: 'Inter, system-ui, sans-serif',
      userSelect: 'none',
      flexShrink: 0,
    }}>
      <IconButton onClick={onReset} title="Return to start (0)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 2v10M12 2L5 7l7 5V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
        </svg>
      </IconButton>
      <IconButton onClick={onPlayPause} title="Play/pause (space)">
        {playing ? (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="3" y="2" width="3" height="10" fill="currentColor"/>
            <rect x="8" y="2" width="3" height="10" fill="currentColor"/>
          </svg>
        ) : (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3 2l9 5-9 5V2z" fill="currentColor"/>
          </svg>
        )}
      </IconButton>

      {/* Current time: fixed width so it doesn't thrash */}
      <div style={{
        fontFamily: mono,
        fontSize: 12,
        fontVariantNumeric: 'tabular-nums',
        width: 40, textAlign: 'right',
        color: '#f6f4ef',
      }}>
        {fmt(time)}
      </div>

      {/* Scrub track — tall hit area, thicker rail, hover time bubble */}
      <div
        ref={trackRef}
        onMouseMove={onTrackMove}
        onMouseLeave={onTrackLeave}
        onMouseDown={onTrackDown}
        style={{
          flex: 1,
          height: 26,
          position: 'relative',
          cursor: 'pointer',
          display: 'flex', alignItems: 'center',
        }}
      >
        <div style={{
          position: 'absolute',
          left: 0, right: 0, height: 6,
          background: 'rgba(255,255,255,0.14)',
          borderRadius: 3,
        }}/>
        <div style={{
          position: 'absolute',
          left: 0, width: `${pct}%`, height: 6,
          background: '#35B6FF',
          boxShadow: '0 0 10px rgba(53,182,255,0.55)',
          borderRadius: 3,
        }}/>
        <div style={{
          position: 'absolute',
          left: `${pct}%`, top: '50%',
          width: dragging ? 16 : 13, height: dragging ? 16 : 13,
          marginLeft: dragging ? -8 : -6.5, marginTop: dragging ? -8 : -6.5,
          background: '#fff',
          borderRadius: '50%',
          boxShadow: '0 0 0 4px rgba(53,182,255,0.25), 0 2px 4px rgba(0,0,0,0.4)',
          transition: 'width 90ms, height 90ms, margin 90ms',
        }}/>
        {hoverT != null && !dragging && (
          <div style={{
            position: 'absolute',
            left: hoverX, bottom: 22, transform: 'translateX(-50%)',
            pointerEvents: 'none',
            fontFamily: mono, fontSize: 11, fontVariantNumeric: 'tabular-nums',
            color: '#EAF2F9', background: 'rgba(14,17,22,0.95)',
            border: '1px solid rgba(53,182,255,0.4)',
            padding: '3px 7px', borderRadius: 6, whiteSpace: 'nowrap',
          }}>
            {fmt(hoverT)}
          </div>
        )}
      </div>

      {/* Duration: fixed width */}
      <div style={{
        fontFamily: mono,
        fontSize: 12,
        fontVariantNumeric: 'tabular-nums',
        width: 40, textAlign: 'left',
        color: 'rgba(246,244,239,0.55)',
      }}>
        {fmt(duration)}
      </div>

      {/* Playback speed — one button cycling 0.5×…2×; drives clock, audio and subtitles together */}
      <button onClick={onCycleRate} title="Playback speed"
        style={{ height: 28, minWidth: 40, padding: '0 7px',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          background: rate !== 1 ? 'rgba(53,182,255,0.18)' : 'rgba(255,255,255,0.04)',
          border: '1px solid ' + (rate !== 1 ? 'rgba(53,182,255,0.5)' : 'rgba(255,255,255,0.1)'),
          borderRadius: 6, color: '#f6f4ef', cursor: 'pointer',
          fontFamily: mono, fontSize: 11, fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}>
        {rate}×
      </button>

      {/* Subtitles on/off — only when the timing.json carries cues */}
      {hasSubs && (
        <button onClick={onToggleSubs} title={subsOn ? 'Subtitles off (c)' : 'Subtitles on (c)'}
          style={{ height: 28, minWidth: 30, padding: '0 6px',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            background: subsOn ? 'rgba(53,182,255,0.18)' : 'rgba(255,255,255,0.04)',
            border: '1px solid ' + (subsOn ? 'rgba(53,182,255,0.5)' : 'rgba(255,255,255,0.1)'),
            borderRadius: 6, color: '#f6f4ef', cursor: 'pointer',
            fontFamily: mono, fontSize: 10, fontWeight: 700, letterSpacing: '0.06em' }}>
          CC
        </button>
      )}

      {/* Mute the voiceover */}
      <IconButton onClick={onMute} title={muted ? 'Unmute (m)' : 'Mute (m)'}>
        {muted ? (
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2 6v4h2.5L8 13V3L4.5 6H2z" fill="currentColor"/>
            <path d="M11 6l3 3M14 6l-3 3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
          </svg>
        ) : (
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2 6v4h2.5L8 13V3L4.5 6H2z" fill="currentColor"/>
            <path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.8a6 6 0 0 1 0 8.4" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
          </svg>
        )}
      </IconButton>

      {/* Fullscreen */}
      <IconButton onClick={toggleFullscreen} title={fullscreen ? 'Exit fullscreen (f)' : 'Fullscreen (f)'}>
        {fullscreen ? (
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
            <path d="M6 2v4H2M14 6h-4V2M2 10h4v4M10 14v-4h4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        ) : (
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
            <path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
      </IconButton>

      {typeof VideoEncoder !== 'undefined' && isAuthorMode() && (
        <IconButton
          title="Export video (author mode)"
          onClick={() => window.parent.postMessage({ type: 'omelette:request-video-export' }, '*')}
        >
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M7 2v7m0 0L4 6m3 3l3-3M2 12h10" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </IconButton>
      )}
    </div>
  );
}

// Fullscreen the whole player. Targets the document element so both the
// canvas and the playback bar go fullscreen together. Inside an iframe this
// needs allow="fullscreen" on the host <iframe>.
function toggleFullscreen() {
  try {
    if (document.fullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      const p = req && req.call(el);
      if (p && p.catch) p.catch(() => {});
    }
  } catch (e) {}
}

function IconButton({ children, onClick, title }) {
  const [hover, setHover] = React.useState(false);
  return (
    <button
      onClick={onClick}
      title={title}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        width: 28, height: 28,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        background: hover ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.04)',
        border: '1px solid rgba(255,255,255,0.1)',
        borderRadius: 6,
        color: '#f6f4ef',
        cursor: 'pointer',
        padding: 0,
        transition: 'background 120ms',
      }}
    >
      {children}
    </button>
  );
}


// ── VideoSprite ─────────────────────────────────────────────────────────────
// Renders a <video> that loops within [start,end] of its source at `speed`,
// kept in sync with the Stage's playhead. Carries the
// data-om-exportable-video-play-* attrs so video export can mix its audio.
//
//   <VideoSprite src="clip.mp4" start={2} end={5} speed={1}
//     style={{ width: 640, height: 360 }} />

function VideoSprite({ src, start = 0, end, speed = 1, style, ...rest }) {
  start = +start || 0; speed = +speed || 1;
  if (end != null) end = +end || undefined;
  const t = useTime();
  const ref = React.useRef(null);
  const span = Math.max(0.001, ((end ?? start + 1) - start));
  React.useEffect(() => {
    const v = ref.current;
    if (!v || v.readyState < 1) return;
    const target = start + ((t * speed) % span);
    if (Math.abs(v.currentTime - target) > 0.05) v.currentTime = target;
  }, [t, start, span, speed]);
  return (
    <video
      ref={ref}
      src={src}
      muted playsInline preload="auto"
      data-om-exportable-video-play-start={start}
      data-om-exportable-video-play-end={end ?? start + span}
      data-om-exportable-video-play-speed={speed}
      style={{ display: 'block', objectFit: 'cover', ...style }}
      {...rest}
    />
  );
}


Object.assign(window, {
  Easing, interpolate, animate, clamp,
  TimelineContext, useTime, useTimeline,
  Sprite, SpriteContext, useSprite,
  TextSprite, ImageSprite, RectSprite, VideoSprite,
  Stage, PlaybackBar,
});


</script>
<script type="text/babel">// Video 1 — "Would you click?" · neon cyber version · 16:9 · free pacing (~140 s)
// Motion language: spring overshoot, velocity smear, blur-in staggers, 3D flips,
// counter roll-ups, cursor trails, ambient parallax background, per-scene camera push.
const {Stage, Sprite, useSprite, useTimeline} = window;

const C={bg:'#0E1116',blue:'#35B6FF',lime:'#C6F221',green:'#3DDC84',red:'#FF3B4A',grey:'#8A93A0',panel:'rgba(21,27,36,.72)',txt:'#EAF2F9',dim:'#8A93A0'};
const SANS="'Archivo','IBM Plex Sans',system-ui,sans-serif";
const MONO="'IBM Plex Mono',ui-monospace,monospace";
const cl=t=>t<=0?0:t>=1?1:t;
const ez=t=>{t=cl(t);return 1-Math.pow(1-t,3)};
const ezE=t=>{t=cl(t);return t>=1?1:1-Math.pow(2,-10*t)};
const ezB=t=>{t=cl(t);const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};

/* prefers-reduced-motion — read once, tracked live in case it changes mid-session. */
function usePrefersReducedMotion(){
  const query='(prefers-reduced-motion: reduce)';
  const [reduced,setReduced]=React.useState(()=>{
    try{ return window.matchMedia(query).matches; }catch(e){ return false; }
  });
  React.useEffect(()=>{
    let mq; try{ mq=window.matchMedia(query); }catch(e){ return; }
    const onChange=()=>setReduced(mq.matches);
    if(mq.addEventListener) mq.addEventListener('change',onChange); else mq.addListener(onChange);
    return ()=>{ if(mq.removeEventListener) mq.removeEventListener('change',onChange); else mq.removeListener(onChange); };
  },[]);
  return reduced;
}
/* Reading pause: once the playhead reaches `at`, pause and show a visible
   10s countdown near the letter, then auto-resume — a fixed, legible reading
   window instead of a silent freeze the learner has no way to escape. The
   previous version just called setPlaying(false) with no on-screen sign why
   playback stopped, and — worse — since it flagged itself "done" only at the
   moment it fired, pressing play again from a persisted/scrubbed position at
   or after `at` re-armed nothing: the same effect saw playing go true with
   time still >= at and immediately paused it again, so the learner could
   never get playback moving (this was the "can't pause/resume at all" bug).
   Here the 0.6s catch window (mirroring Hold below) means the guard only
   ever fires once, right at the natural crossing; a big forward scrub past
   `at` no longer re-traps playback. Pressing play/space during the countdown
   cancels it and resumes immediately. Re-arms if the learner scrubs back
   before `at`. The countdown itself runs on the wall clock (setInterval),
   not tl.time, since it has to keep counting while the timeline is paused —
   this is player chrome, not scene content, so it's exempt from the
   pure-function-of-time rule (like the playback bar). */
function ReadingPause({at,dur=10,x=1040,y=300}){
  const tl=useTimeline();
  // `phase` must be real React state, not a ref: this component's own render
  // output depends on it (the countdown UI mounts/unmounts with it). A ref
  // mutation plus tl.setHolding()/tl.setPlaying() doesn't necessarily
  // re-render *this* component — the timeline context value is memoized on
  // [time, duration, playing, rate, subsOn], so a holding-only change doesn't
  // change that memoized object and this component can be skipped entirely,
  // leaving the countdown UI stuck on screen after it had already canceled
  // internally. State fixes that: setPhase always schedules a re-render.
  const [phase,setPhase]=React.useState('armed'); // armed → counting → done
  const timerRef=React.useRef(null);
  const deadlineRef=React.useRef(0);
  const [remaining,setRemaining]=React.useState(dur);

  const clearTimer=()=>{ if(timerRef.current){ clearInterval(timerRef.current); timerRef.current=null; } };

  // A single if/else-if chain so exactly one branch fires per commit — this
  // matters: the "enter counting" and "cancel early" checks used to live in
  // two separate effects and both ran on the very same commit that flipped
  // tl.playing to true (the click that arms the countdown also looks, to a
  // second independent effect, like a click that should cancel it), so the
  // countdown immediately canceled itself the instant it started. Chaining
  // them as mutually exclusive branches means only the "enter" branch can
  // match on that first commit; "cancel" only matches on a later, genuinely
  // separate playing-become-true transition while still 'counting'.
  React.useEffect(()=>{
    if(phase==='armed'&&tl.playing&&tl.time>=at&&tl.time<at+0.6){
      deadlineRef.current=Date.now()+dur*1000;
      setRemaining(dur);
      tl.setHolding(true); // hide the big Play/Resume overlay — the countdown is the affordance now
      tl.setPlaying(false);
      setPhase('counting');
      timerRef.current=setInterval(()=>{
        const left=Math.max(0,(deadlineRef.current-Date.now())/1000);
        setRemaining(left);
        if(left<=0){
          clearTimer();
          tl.setHolding(false);
          tl.setPlaying(true);
          setPhase('done');
        }
      },100);
    } else if(phase==='counting'&&tl.playing){
      // Manual resume (Play button or Space) during the countdown — cancel early.
      tl.setHolding(false);
      clearTimer();
      setPhase('done');
    } else if(phase!=='armed'&&tl.time<at-0.4){
      tl.setHolding(false);
      clearTimer();
      setRemaining(dur);
      setPhase('armed');
    }
  },[tl.time,tl.playing,at,dur,phase]);

  React.useEffect(()=>clearTimer,[]);

  if(phase!=='counting') return null;
  return <ReadingCountdown seconds={remaining} total={dur} x={x} y={y}/>;
}
/* Small, unobtrusive countdown near the letter — a thin blue ring + number.
   Under prefers-reduced-motion: a static digit, no animated ring. */
function ReadingCountdown({seconds,total,x,y}){
  const reduced=usePrefersReducedMotion();
  const n=Math.max(0,Math.ceil(seconds-0.001));
  const numeral=<div style={{fontFamily:MONO,fontSize:20,fontWeight:700,color:C.blue,fontVariantNumeric:'tabular-nums'}}>{n}</div>;
  if(reduced){
    return <div style={{position:'absolute',left:x,top:y,transform:'translate(-50%,-50%)',padding:'6px 13px',borderRadius:10,border:`1.5px solid ${C.blue}55`,background:'rgba(14,17,22,0.55)'}}>{numeral}</div>;
  }
  const r=24,circ=2*Math.PI*r,p=total>0?cl(seconds/total):0;
  return <div style={{position:'absolute',left:x,top:y,width:60,height:60,transform:'translate(-50%,-50%)'}}>
    <svg width="60" height="60" viewBox="0 0 60 60">
      <circle cx="30" cy="30" r={r} fill="none" stroke={`${C.blue}2a`} strokeWidth="3"/>
      <circle cx="30" cy="30" r={r} fill="none" stroke={C.blue} strokeWidth="3" strokeLinecap="round"
        strokeDasharray={circ} strokeDashoffset={circ*(1-p)} transform="rotate(-90 30 30)"
        style={{filter:`drop-shadow(0 0 6px ${C.blue}88)`}}/>
    </svg>
    <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}>{numeral}</div>
  </div>;
}
/* Hold — freeze the playhead (and, via AudioSync, the VO) for `dur` seconds
   when playback first reaches `at`. Placed inside the VO's natural silence
   gaps so the narration is never cut mid-word; gives scenes room to breathe
   and lets the viewer look / think. Fire-and-forget timeout (no effect
   cleanup) so pausing doesn't cancel the resume. Re-arms if the user scrubs
   back before the hold point. */
function Hold({at,dur}){
  const {time,playing,setPlaying,setHolding}=useTimeline();
  const st=React.useRef('armed'); // armed → held → done
  React.useEffect(()=>{
    if(st.current==='armed'&&playing&&time>=at&&time<at+0.6){
      st.current='held';
      setHolding(true);
      setPlaying(false);
      setTimeout(()=>{ st.current='done'; setHolding(false); setPlaying(true); }, dur*1000);
    } else if(st.current==='done'&&time<at-0.4){
      st.current='armed';
    }
  });
  return null;
}
/* Tell the SCORM shell the video has been watched once the playhead reaches
   the end. Fires once; re-arms only if the learner scrubs back to the start. */
function WatchComplete(){
  const {time,duration}=useTimeline();
  const done=React.useRef(false);
  React.useEffect(()=>{
    if(!done.current&&duration>0&&time>=duration-0.4){
      done.current=true;
      try{ window.parent&&window.parent.postMessage({type:'u1-progress',id:'watch'},'*'); }catch(e){}
    } else if(done.current&&time<1){
      done.current=false;
    }
  },[time,duration]);
  return null;
}
/* sync the VO audio track to the timeline playhead */
function AudioSync(){
  const {time,playing,rate}=useTimeline();
  React.useEffect(()=>{ const a=document.getElementById('vo'); if(a){ if(playing) a.play().catch(()=>{}); else a.pause(); } },[playing]);
  React.useEffect(()=>{ const a=document.getElementById('vo'); if(a&&Math.abs(a.currentTime-time)>0.3){ try{a.currentTime=time;}catch(e){} } },[time]);
  React.useEffect(()=>{ const a=document.getElementById('vo'); if(a){ a.playbackRate=rate||1; try{a.preservesPitch=true;}catch(e){} } },[rate]);  // audio follows playback speed
  return null;
}
/* Subtitles — burned into the frame (inside the foreignObject, so they land in
   the video export) and synced to the playhead. Reads TIMING.subs authored by the
   VO editor: { lang: [[startSec,endSec,text],...] }. Learner content is EN, so we
   show 'en' (or the only track); no in-player language switch.
   ponytail: single-track render, add a selector only if a course ships multilingual subs. */
function Subtitles(){
  const {time,subsOn}=useTimeline();
  if(!subsOn) return null;
  const subs=TIMING.subs;
  if(!subs||typeof subs!=='object') return null;
  const lang=subs.en?'en':Object.keys(subs)[0];
  const cues=subs[lang];
  if(!Array.isArray(cues)||!cues.length) return null;
  const cue=cues.find(c=>time>=c[0]&&time<c[1]);
  if(!cue||!cue[2]) return null;
  return <div style={{position:'absolute',left:'50%',bottom:40,transform:'translateX(-50%)',
    maxWidth:'86%',padding:'8px 22px',borderRadius:9,background:'rgba(6,8,12,0.82)',
    color:'#fff',fontFamily:SANS,fontWeight:600,fontSize:27,lineHeight:1.34,textAlign:'center',
    whiteSpace:'pre-wrap',pointerEvents:'none',boxShadow:'0 3px 14px rgba(0,0,0,0.45)'}}>{cue[2]}</div>;
}
function Floaty({children,x=290,y=200}){
  const tl=useTimeline();
  return <div style={{position:'absolute',left:x,top:y,transform:`translateY(${Math.sin(tl.time*0.9)*7}px) rotate(${Math.sin(tl.time*0.5)*0.4}deg)`}}>{children}</div>;
}
function Breath(){
  const tl=useTimeline();
  return <div style={{position:'absolute',left:0,top:0,width:1280,height:720,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:SANS,fontWeight:800,fontSize:560,color:C.blue,opacity:0.05+0.035*Math.sin(tl.time*1.1),userSelect:'none'}}>?</div>;
}
window.Video1Neon=Video1Neon;

const _root = ReactDOM.createRoot(document.getElementById('root'));
function _mount(){ _root.render(<div style={{width:'100vw',height:'100vh'}}><Video1Neon loop={false}/></div>); }
// Load editor-tuned timing if present, else fall back to DEFAULT_TIMING.
fetch('timing.json').then(r=>r.ok?r.json():null).then(t=>{
  if(t&&Array.isArray(t.bounds)&&t.bounds.length===12&&Array.isArray(t.holds)) TIMING=t;
}).catch(()=>{}).finally(_mount);

</script>
